name: Server and web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: plainphone
          POSTGRES_PASSWORD: plainphone
          POSTGRES_DB: plainphone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plainphone -d plainphone_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://plainphone:plainphone@localhost:5432/plainphone_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Tests (server, web and encryption vectors)
        run: pnpm -r test
      - name: Build
        run: pnpm -r build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t plainphone:ci .
      - name: Smoke test with Postgres
        run: |
          docker network create pp
          docker run -d --name db --network pp -e POSTGRES_PASSWORD=pw -e POSTGRES_USER=plainphone -e POSTGRES_DB=plainphone postgres:18
          for i in $(seq 1 30); do docker exec db pg_isready -U plainphone -d plainphone && break; sleep 1; done
          docker run -d --name app --network pp -p 8080:8080 \
            -e DATABASE_URL=postgres://plainphone:pw@db:5432/plainphone \
            -e PUBLIC_URL=http://localhost:8080 plainphone:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          curl -fsS http://localhost:8080/api/health | grep '"ok":true'
          curl -fsS http://localhost:8080/ | grep -i '<html'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://localhost:8080/api/device/pairings)
          test "$code" = 201
      - name: Logs on failure
        if: failure()
        run: docker logs app || true
