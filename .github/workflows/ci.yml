name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly run of the E2EE prototype on main only (docs/e2ee-prototype.md).
  schedule:
    - cron: "17 2 * * *"
  # Runs every check, including both emulator legs, on the chosen branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
      emulator: ${{ steps.filter.outputs.emulator }}
      server: ${{ steps.filter.outputs.server }}
      parent: ${{ steps.filter.outputs.parent }}
      dns: ${{ steps.filter.outputs.dns }}
      site: ${{ steps.filter.outputs.site }}
      ios: ${{ steps.filter.outputs.ios }}
      backup: ${{ steps.filter.outputs.backup }}
      e2ee: ${{ steps.filter.outputs.e2ee }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test change detection
        run: python3 -m unittest discover -s .github/scripts
      - name: Detect changes in the checked-out revision
        id: filter
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The first parent is the base of this run's PR merge commit.
            base=$(git rev-parse --verify "$GITHUB_SHA^1")
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            base=nightly
          elif [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base=$PUSH_BEFORE
            if ! git cat-file -e "$base^{commit}" 2>/dev/null &&
               ! git fetch --no-tags --depth=1 origin "$base"; then
              echo "::warning::Push predecessor is unavailable. Running all checks."
              base=all
            fi
          else
            base=all
          fi
          python3 .github/scripts/ci-changes.py "$base" "$GITHUB_SHA"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          keys = {"android", "e2e", "emulator", "server", "parent", "dns", "site", "backup", "ios", "e2ee"}
          lines = Path(os.environ["GITHUB_OUTPUT"]).read_text(encoding="utf-8").splitlines()
          outputs = dict(line.split("=", 1) for line in lines)
          if len(lines) != len(keys) or outputs.keys() != keys or any(
              value not in {"true", "false"} for value in outputs.values()
          ):
              raise SystemExit("::error::Expected one boolean output for each CI check.")
          PYTHON

  android:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.android == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.android == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        if: needs.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Check preinstalled Android SDK packages
        id: sdk
        if: needs.changes.outputs.android == 'true'
        run: |
          echo "path=${ANDROID_HOME:?Android SDK missing from runner}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/source.properties" ||
                ! -f "$ANDROID_HOME/build-tools/36.1.0/source.properties" ]]; then
            echo "cache-needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Android SDK packages
        if: steps.sdk.outputs.cache-needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platforms/android-37.0
            ${{ steps.sdk.outputs.path }}/build-tools/36.1.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform-37.0-build-tools-36.1.0
      - uses: android-actions/setup-android@v4
        if: needs.changes.outputs.android == 'true'
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"

      - name: Cache Robolectric instrumented SDKs
        id: robolectric
        if: needs.changes.outputs.android == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: android/.gradle/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('android/gradle/robolectric.properties') }}

      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.android == 'true'

      # Share compilation and SDK setup across debug and release checks.
      - name: Debug and release APKs, lint and unit tests (including encryption vectors)
        if: needs.changes.outputs.android == 'true'
        env:
          ROBOLECTRIC_SDK_CACHE_HIT: ${{ steps.robolectric.outputs.cache-hit }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleRelease lintRelease

      - name: Smoke test of the minified release APK (R8)
        if: needs.changes.outputs.android == 'true'
        working-directory: .
        run: scripts/smoke-release-apk.sh android/app/build/outputs/apk/release/app-release.apk

      - name: QR script tests
        if: needs.changes.outputs.android == 'true'
        working-directory: .
        run: python3 -m unittest scripts/test_provisioning_qr.py

      - uses: actions/upload-artifact@v7
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.android == 'true'
        with:
          name: plainphone-apks-and-reports
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
          retention-days: 14

  server-and-phone-sync:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ needs.changes.result == 'success' && (needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true') && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: plainphone
          POSTGRES_PASSWORD: plainphone
          POSTGRES_DB: plainphone_test
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U plainphone -d plainphone_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.server == 'false' && needs.changes.outputs.e2e == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Locate the pnpm store
        id: pnpm-store
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the root pnpm store
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore the root pnpm store for phone sync
        if: needs.changes.outputs.server == 'false' && needs.changes.outputs.e2e == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.server == 'true'
      - run: pnpm --filter @plainphone/server install --frozen-lockfile
        if: needs.changes.outputs.server == 'false' && needs.changes.outputs.e2e == 'true'
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        if: needs.changes.outputs.server == 'true'
        run: pnpm -r typecheck
      - name: Tests (server, web and encryption vectors)
        id: tests
        continue-on-error: true
        if: needs.changes.outputs.server == 'true'
        env:
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_test
        run: pnpm -r test
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.e2e == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Check preinstalled Android SDK packages
        id: sdk
        if: needs.changes.outputs.e2e == 'true'
        run: |
          echo "path=${ANDROID_HOME:?Android SDK missing from runner}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/source.properties" ||
                ! -f "$ANDROID_HOME/build-tools/36.1.0/source.properties" ]]; then
            echo "cache-needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Android SDK packages
        if: steps.sdk.outputs.cache-needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platforms/android-37.0
            ${{ steps.sdk.outputs.path }}/build-tools/36.1.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform-37.0-build-tools-36.1.0
      - uses: android-actions/setup-android@v4
        if: needs.changes.outputs.e2e == 'true'
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - name: Cache Robolectric instrumented SDKs
        id: robolectric
        if: needs.changes.outputs.e2e == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: android/.gradle/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('android/gradle/robolectric.properties') }}
      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.e2e == 'true'
      - name: Pair, sync rules, Find and status against the real server
        if: needs.changes.outputs.e2e == 'true'
        env:
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_e2e
          ROBOLECTRIC_SDK_CACHE_HIT: ${{ steps.robolectric.outputs.cache-hit }}
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U plainphone plainphone_e2e
          scripts/e2e-phone-sync.sh
      - name: Require successful typecheck and tests
        if: ${{ !cancelled() && (steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure') }}
        run: exit 1

  # E2EE phase 0 prototype (docs/e2ee-prototype.md): the OpenMLS core, the scripted demo
  # against the real server, the Kotlin -> JNI -> Rust test on the host JVM, and proof that
  # the arm64 library lands in debug APKs only.
  e2ee-prototype:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    services:
      postgres:
        image: ${{ needs.changes.result == 'success' && needs.changes.outputs.e2ee == 'true' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: plainphone
          POSTGRES_PASSWORD: plainphone
          POSTGRES_DB: plainphone_e2ee
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U plainphone -d plainphone_e2ee"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.e2ee == 'false'
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.e2ee == 'true'
        with:
          persist-credentials: false
      - name: Rust toolchain
        if: needs.changes.outputs.e2ee == 'true'
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target aarch64-linux-android
          cargo --version
      - name: Cache crates and build output
        if: needs.changes.outputs.e2ee == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            e2ee/mls-core/target
          key: e2ee-cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('e2ee/mls-core/Cargo.lock') }}
      - name: Core format, lint and tests (scenarios, vectors)
        if: needs.changes.outputs.e2ee == 'true'
        working-directory: e2ee/mls-core
        run: |
          cargo fmt --check
          cargo clippy --locked --release --all-targets --features jni -- -D warnings
          cargo test --locked --release
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.e2ee == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.e2ee == 'true'
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm --filter @plainphone/server install --frozen-lockfile
        if: needs.changes.outputs.e2ee == 'true'
      - name: Demo against the real server (two parents, a child, add, remove, rotate, texts)
        if: needs.changes.outputs.e2ee == 'true'
        env:
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_e2ee
        run: scripts/e2ee-prototype-demo.sh
      - name: Build the core for the host JVM and for arm64 Android
        if: needs.changes.outputs.e2ee == 'true'
        run: |
          (cd e2ee/mls-core && cargo build --locked --release --lib --features jni)
          e2ee/mls-core/scripts/build-android.sh
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.e2ee == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Check preinstalled Android SDK packages
        id: sdk
        if: needs.changes.outputs.e2ee == 'true'
        run: |
          echo "path=${ANDROID_HOME:?Android SDK missing from runner}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/source.properties" ||
                ! -f "$ANDROID_HOME/build-tools/36.1.0/source.properties" ]]; then
            echo "cache-needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Android SDK packages
        if: steps.sdk.outputs.cache-needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platforms/android-37.0
            ${{ steps.sdk.outputs.path }}/build-tools/36.1.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform-37.0-build-tools-36.1.0
      - uses: android-actions/setup-android@v4
        if: needs.changes.outputs.e2ee == 'true'
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - name: Cache Robolectric instrumented SDKs
        id: robolectric
        if: needs.changes.outputs.e2ee == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: android/.gradle/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('android/gradle/robolectric.properties') }}
      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.e2ee == 'true'
      - name: Kotlin binding over JNI, and the library in debug APKs only
        if: needs.changes.outputs.e2ee == 'true'
        working-directory: android
        env:
          ROBOLECTRIC_SDK_CACHE_HIT: ${{ steps.robolectric.outputs.cache-hit }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest --tests 'org.plainphone.app.e2ee.*' assembleDebug assembleRelease \
            -PplainphoneE2eePrototype=true -PplainphoneMlsHostLib="$GITHUB_WORKSPACE/e2ee/mls-core/target/release/libplainphone_mls.so"
          grep -q 'tests="3" skipped="0" failures="0" errors="0"' \
            app/build/test-results/testDebugUnitTest/TEST-org.plainphone.app.e2ee.MlsCoreJniTest.xml
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libplainphone_mls.so'
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'libplainphone_mls'; then
            echo "::error::The release APK contains the E2EE prototype library."
            exit 1
          fi
          echo "debug APK has the prototype library, release APK does not"

  android-e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [34, 29]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: plainphone
          POSTGRES_PASSWORD: plainphone
          POSTGRES_DB: plainphone_e2e
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U plainphone -d plainphone_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Emulator harness tests
        run: python3 -m unittest scripts/test_e2e_android_emulator.py
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm --filter @plainphone/server install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the phone app, instrumentation and PiP fixture
        working-directory: android
        run: >-
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          :app:assembleDebug :app:assembleDebugAndroidTest :e2e-fixture:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm
      - name: Cache clean emulator snapshot
        id: avd
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.android/avd
          key: plainphone-avd-v4-${{ runner.os }}-${{ runner.arch }}-aosp-${{ matrix.api }}
      - name: Boot and save a clean snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel
          force-avd-creation: false
          emulator-boot-timeout: 240
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
            -feature ModemSimulator -phone-number 15555215554 -shell-serial tcp:127.0.0.1:5599,server,nowait
          script: adb shell getprop sys.boot_completed
      - name: Run the device flows once
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_e2e
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel
          force-avd-creation: false
          emulator-boot-timeout: 240
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
            -feature ModemSimulator -phone-number 15555215554 -shell-serial tcp:127.0.0.1:5599,server,nowait
          script: python3 scripts/e2e-android-emulator.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-e2e-api-${{ matrix.api }}
          path: android/build/emulator-e2e/
          retention-days: 14

  offsite-backup:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.backup == 'false'
        run: echo "No backup or deployment Compose changes."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.backup == 'true'
        with:
          persist-credentials: false
      - name: Validate deployment Compose files
        if: needs.changes.outputs.backup == 'true'
        env:
          POSTGRES_PASSWORD: compose-validation-only
          PUBLIC_URL: https://example.org
          DNS_PROVIDER: mock
        run: |
          docker compose config --quiet
          docker compose -f deploy/dokploy-compose.yaml config --quiet
      - name: Run the off-site backup and restore drill
        if: needs.changes.outputs.backup == 'true'
        run: scripts/test-offsite-backup.sh

  docker:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.server == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.server == 'true'
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: needs.changes.outputs.server == 'true'
      - name: Build the server and web in the image
        if: needs.changes.outputs.server == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: plainphone:ci
          cache-from: type=gha,scope=plainphone-server
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=plainphone-server,ignore-error=true' || '' }}
      - name: Smoke test with Postgres
        if: needs.changes.outputs.server == 'true'
        run: |
          docker network create pp
          docker run -d --name db --network pp -e POSTGRES_PASSWORD=pw -e POSTGRES_USER=plainphone -e POSTGRES_DB=plainphone postgres:18
          for _ in $(seq 1 30); do docker exec db pg_isready -U plainphone -d plainphone && break; sleep 1; done
          docker run -d --name app --network pp -p 127.0.0.1::8080 \
            -e DATABASE_URL=postgres://plainphone:pw@db:5432/plainphone \
            -e PUBLIC_URL=http://localhost:8080 plainphone:ci
          url="http://$(docker port app 8080/tcp)"
          for _ in $(seq 1 30); do curl -fsS "$url/api/health" && break; sleep 1; done
          curl -fsS "$url/api/health" | grep '"ok":true'
          curl -fsS "$url/" | grep -i '<html'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$url/api/device/pairings")
          test "$code" = 201
      - name: Logs on failure
        if: failure() && needs.changes.outputs.server == 'true'
        run: docker logs app || true

  parent-app:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parent-app
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.parent == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.parent == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.parent == 'true'
        with:
          package_json_file: parent-app/package.json
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.parent == 'true'
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: parent-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.parent == 'true'
      # Same idea for the copy and formatting shared with the PWA: test the app with the
      # PWA's current files, and warn when the committed copy is behind (pnpm sync:shared).
      - name: Shared copy and formatting match the PWA
        if: needs.changes.outputs.parent == 'true'
        run: pnpm check:shared || echo "::warning::parent-app/src/shared is behind web/src; run pnpm --dir parent-app sync:shared"
      - name: Use the PWA's current shared files
        if: needs.changes.outputs.parent == 'true'
        run: pnpm sync:shared
      # Typecheck against the API as it is now, so a breaking change in openapi.yaml
      # fails here. A stale committed schema only warns; refresh it with pnpm gen:api.
      - name: Typed API client matches server/openapi.yaml
        if: needs.changes.outputs.parent == 'true'
        run: pnpm check:api || echo "::warning file=parent-app/src/api/schema.d.ts::out of date with server/openapi.yaml; run pnpm --dir parent-app gen:api"
      - name: Regenerate the API types from server/openapi.yaml
        if: needs.changes.outputs.parent == 'true'
        run: pnpm gen:api
      - name: Typecheck
        if: needs.changes.outputs.parent == 'true'
        run: pnpm typecheck
      - name: Lint
        if: needs.changes.outputs.parent == 'true'
        run: pnpm lint
      - name: Tests (Jest + React Native Testing Library)
        if: needs.changes.outputs.parent == 'true'
        run: pnpm test --ci
      - name: Export the JS bundles (iOS, Android, web)
        if: needs.changes.outputs.parent == 'true'
        run: pnpm exec expo export --platform all --output-dir dist

  # The iPhone's Swift code (docs/ios/architecture.md): generate the Xcode project with xcodegen,
  # build the dev host and its extensions for the simulator, and run the unit tests. Unsigned.
  # Only takes a macOS runner when ios/ or the Swift module changed.
  ios:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.ios == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.ios == 'false'
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.ios == 'true'
        with:
          persist-credentials: false
      - name: Use the newest Xcode 26
        if: needs.changes.outputs.ios == 'true'
        run: |
          # Highest released Xcode 26 by version number; betas are skipped.
          xcode=$(python3 -c 'import glob, re; c = [p for p in glob.glob("/Applications/Xcode_26*.app") if "beta" not in p.lower()]; print(max(c, key=lambda p: [int(n) for n in re.findall(r"\d+", p)]) if c else "")')
          if [[ -z "$xcode" ]]; then echo "::error::No Xcode 26 on this runner."; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install xcodegen (pinned release, checked)
        if: needs.changes.outputs.ios == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Simulator picker tests
        if: needs.changes.outputs.ios == 'true'
        run: python3 -m unittest discover -s ios/scripts -p 'test_*.py'
      - name: Build for the simulator and run the unit tests
        if: needs.changes.outputs.ios == 'true'
        run: ios/scripts/ci.sh
      - uses: actions/upload-artifact@v7
        if: failure() && needs.changes.outputs.ios == 'true'
        with:
          name: ios-test-results
          path: ios/build/PlainphoneDev.xcresult
          retention-days: 7

  dns:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.dns == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.dns == 'true'
        with:
          persist-credentials: false

      - name: Unit tests
        if: needs.changes.outputs.dns == 'true'
        run: python3 -m unittest discover -s dns/tests -p 'test_ppdns.py' -v

      - name: Whole stack over DNS-over-TLS (AdGuard Home in Docker, self-signed certificate)
        if: needs.changes.outputs.dns == 'true'
        run: dns/tests/run-stack.sh

  site:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.site == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.site == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.site == 'true'
        with:
          node-version: "24"

      - name: Build
        if: needs.changes.outputs.site == 'true'
        run: node build.mjs

      - name: Check pages, internal links and anchors
        if: needs.changes.outputs.site == 'true'
        run: npm run check

      - name: Check external links
        if: needs.changes.outputs.site == 'true'
        # Other sites can be down for reasons outside this repo; report, don't block.
        continue-on-error: true
        run: node scripts/check.mjs --external

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.site == 'true'
        with:
          name: site-dist
          path: site/dist/
          retention-days: 14
