name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly run of the E2EE prototype on main only (docs/e2ee-prototype.md).
  schedule:
    - cron: "17 2 * * *"
  # Runs every check, including both emulator legs, on the chosen branch.
  workflow_dispatch:
    inputs:
      dpc_probe:
        description: Also run the Play Protect DPC provisioning probe (issue #255)
        type: boolean
        default: false
      dpc_probe_api:
        description: Google Play image API level for the probe
        type: choice
        options: ["36", "35", "34", "36.1", "37.0"]
        default: "36"
      dpc_probe_image_tag:
        description: System image tag for the probe
        type: choice
        options: ["google_apis_playstore", "google_apis_playstore_ps16k"]
        default: google_apis_playstore

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The JS checks run through Turborepo (turbo.json) with its local cache only, kept between
  # runs by actions/cache: no remote cache and no telemetry.
  TURBO_TELEMETRY_DISABLED: "1"
  # A manual run checks everything again instead of trusting cached task results.
  TURBO_FORCE: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      e2e: ${{ steps.filter.outputs.e2e }}
      emulator: ${{ steps.filter.outputs.emulator }}
      server: ${{ steps.filter.outputs.server }}
      parent: ${{ steps.filter.outputs.parent }}
      dns: ${{ steps.filter.outputs.dns }}
      site: ${{ steps.filter.outputs.site }}
      markdown: ${{ steps.filter.outputs.markdown }}
      ios: ${{ steps.filter.outputs.ios }}
      backup: ${{ steps.filter.outputs.backup }}
      e2ee: ${{ steps.filter.outputs.e2ee }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test change detection
        run: python3 -m unittest discover -s .github/scripts
      # The probe itself only runs on demand; its decisions are checked on every run (a second).
      - name: Test the DPC provisioning probe
        run: python3 -m unittest scripts/test_dpc_provisioning_probe.py
      - name: Detect changes in the checked-out revision
        id: filter
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The first parent is the base of this run's PR merge commit.
            base=$(git rev-parse --verify "$GITHUB_SHA^1")
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            base=nightly
          elif [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base=$PUSH_BEFORE
            if ! git cat-file -e "$base^{commit}" 2>/dev/null &&
               ! git fetch --no-tags --depth=1 origin "$base"; then
              echo "::warning::Push predecessor is unavailable. Running all checks."
              base=all
            fi
          else
            base=all
          fi
          python3 .github/scripts/ci-changes.py "$base" "$GITHUB_SHA"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          keys = {"android", "e2e", "emulator", "server", "parent", "dns", "site", "markdown", "backup", "ios", "e2ee"}
          lines = Path(os.environ["GITHUB_OUTPUT"]).read_text(encoding="utf-8").splitlines()
          outputs = dict(line.split("=", 1) for line in lines)
          if len(lines) != len(keys) or outputs.keys() != keys or any(
              value not in {"true", "false"} for value in outputs.values()
          ):
              raise SystemExit("::error::Expected one boolean output for each CI check.")
          PYTHON

  android:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.android == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.android == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        if: needs.changes.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Check preinstalled Android SDK packages
        id: sdk
        if: needs.changes.outputs.android == 'true'
        run: |
          echo "path=${ANDROID_HOME:?Android SDK missing from runner}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/source.properties" ||
                ! -f "$ANDROID_HOME/build-tools/36.1.0/source.properties" ]]; then
            echo "cache-needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Android SDK packages
        if: steps.sdk.outputs.cache-needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platforms/android-37.0
            ${{ steps.sdk.outputs.path }}/build-tools/36.1.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform-37.0-build-tools-36.1.0
      - uses: android-actions/setup-android@v4
        if: needs.changes.outputs.android == 'true'
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"

      - name: Cache Robolectric instrumented SDKs
        id: robolectric
        if: needs.changes.outputs.android == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: android/.gradle/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('android/gradle/robolectric.properties') }}

      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.android == 'true'

      # Share compilation and SDK setup across debug and release checks.
      - name: Debug and release APKs, lint and unit tests (including encryption vectors)
        if: needs.changes.outputs.android == 'true'
        env:
          ROBOLECTRIC_SDK_CACHE_HIT: ${{ steps.robolectric.outputs.cache-hit }}
        run: ./gradlew --no-daemon assembleGithubDebug testGithubDebugUnitTest lintGithubDebug assembleGithubRelease lintGithubRelease

      - name: Smoke test of the minified release APK (R8)
        if: needs.changes.outputs.android == 'true'
        working-directory: .
        run: scripts/smoke-release-apk.sh android/app/build/outputs/apk/github/release/app-github-release.apk

      # The Google Play edition (docs/play/play-edition.md). CI has no upload key, so both stay unsigned.
      - name: Play edition, unsigned release APK and bundle, lint and unit tests
        if: needs.changes.outputs.android == 'true'
        env:
          ROBOLECTRIC_SDK_CACHE_HIT: ${{ steps.robolectric.outputs.cache-hit }}
        run: ./gradlew --no-daemon assemblePlayRelease bundlePlayRelease testPlayDebugUnitTest lintPlayDebug

      - name: Smoke test of the Play release APK (what Play forbids is gone)
        if: needs.changes.outputs.android == 'true'
        working-directory: .
        run: scripts/smoke-play-apk.sh android/app/build/outputs/apk/play/release/app-play-release-unsigned.apk

      - name: QR script tests
        if: needs.changes.outputs.android == 'true'
        working-directory: .
        run: python3 -m unittest scripts/test_provisioning_qr.py

      - uses: actions/upload-artifact@v7
        if: always() && needs.changes.result == 'success' && needs.changes.outputs.android == 'true'
        with:
          name: plainphone-apks-and-reports
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
          retention-days: 14

  server-and-phone-sync:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ needs.changes.result == 'success' && (needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true') && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: plainphone
          POSTGRES_PASSWORD: plainphone
          POSTGRES_DB: plainphone_test
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U plainphone -d plainphone_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.server == 'false' && needs.changes.outputs.e2e == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Locate the pnpm store
        id: pnpm-store
        if: needs.changes.outputs.server == 'true' || needs.changes.outputs.e2e == 'true'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the root pnpm store
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore the root pnpm store for phone sync
        if: needs.changes.outputs.server == 'false' && needs.changes.outputs.e2e == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The parent app has its own job; leave React Native out of this install.
      - run: pnpm install --frozen-lockfile --filter '!@plainphone/parent-app'
        if: needs.changes.outputs.server == 'true'
      - run: pnpm --filter @plainphone/server install --frozen-lockfile
        if: needs.changes.outputs.server == 'false' && needs.changes.outputs.e2e == 'true'
      # Turborepo reruns a task only when its inputs in turbo.json changed; the rest come from
      # this cache. Each run saves a new entry, and a run restores the newest one for its Node.
      - name: Turborepo cache key
        id: turbo
        if: needs.changes.outputs.server == 'true'
        run: echo "prefix=turbo-server-${RUNNER_OS}-${RUNNER_ARCH}-node-$(node --version)-" >> "$GITHUB_OUTPUT"
      # The server tests' cache hash includes the PostgreSQL image and its exact version
      # (turbo.json env), so a new service image or tag minor reruns them.
      - name: PostgreSQL version for the Turborepo hash
        if: needs.changes.outputs.server == 'true'
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          image=$(docker inspect --format '{{.Config.Image}}' "$PG_CONTAINER")
          version=$(docker exec "$PG_CONTAINER" postgres --version)
          echo "PLAINPHONE_TEST_PG=${image} ${version}" >> "$GITHUB_ENV"
          echo "PostgreSQL for the tests: ${image} ${version}"
      - name: Restore the Turborepo cache
        if: needs.changes.outputs.server == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.turbo.outputs.prefix }}
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        if: needs.changes.outputs.server == 'true'
        run: pnpm exec turbo run typecheck --filter='!@plainphone/parent-app' --continue
      - name: Tests (server, web, shared packages and encryption vectors)
        id: tests
        continue-on-error: true
        if: needs.changes.outputs.server == 'true'
        env:
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_test
        run: pnpm exec turbo run test --filter='!@plainphone/parent-app' --continue
      # Both apps type their API calls from packages/api-client/src/schema.d.ts. After a change
      # to server/openapi.yaml, run `pnpm --filter @plainphone/api-client generate`.
      - name: API types match server/openapi.yaml
        id: api-types
        continue-on-error: true
        if: needs.changes.outputs.server == 'true'
        run: pnpm exec turbo run check --filter=@plainphone/api-client
      # Turborepo stores only tasks that passed, so a failed run can still save its cache.
      - name: Save the Turborepo cache
        if: ${{ !cancelled() && needs.changes.outputs.server == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.e2e == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Check preinstalled Android SDK packages
        id: sdk
        if: needs.changes.outputs.e2e == 'true'
        run: |
          echo "path=${ANDROID_HOME:?Android SDK missing from runner}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/source.properties" ||
                ! -f "$ANDROID_HOME/build-tools/36.1.0/source.properties" ]]; then
            echo "cache-needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Android SDK packages
        if: steps.sdk.outputs.cache-needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platforms/android-37.0
            ${{ steps.sdk.outputs.path }}/build-tools/36.1.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform-37.0-build-tools-36.1.0
      - uses: android-actions/setup-android@v4
        if: needs.changes.outputs.e2e == 'true'
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - name: Cache Robolectric instrumented SDKs
        id: robolectric
        if: needs.changes.outputs.e2e == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: android/.gradle/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('android/gradle/robolectric.properties') }}
      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.e2e == 'true'
      - name: Pair, sync rules, Find and status against the real server
        if: needs.changes.outputs.e2e == 'true'
        env:
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_e2e
          ROBOLECTRIC_SDK_CACHE_HIT: ${{ steps.robolectric.outputs.cache-hit }}
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U plainphone plainphone_e2e
          scripts/e2e-phone-sync.sh
      - name: Require successful typecheck, tests and API types
        if: ${{ !cancelled() && (steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.api-types.outcome == 'failure') }}
        run: exit 1

  # E2EE phase 0 prototype (docs/e2ee-prototype.md): the OpenMLS core, the scripted demo
  # against the real server, the Kotlin -> JNI -> Rust test on the host JVM, and proof that
  # the arm64 library lands in debug APKs only.
  e2ee-prototype:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    services:
      postgres:
        image: ${{ needs.changes.result == 'success' && needs.changes.outputs.e2ee == 'true' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: plainphone
          POSTGRES_PASSWORD: plainphone
          POSTGRES_DB: plainphone_e2ee
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U plainphone -d plainphone_e2ee"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.e2ee == 'false'
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.e2ee == 'true'
        with:
          persist-credentials: false
      - name: Rust toolchain
        if: needs.changes.outputs.e2ee == 'true'
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt --target aarch64-linux-android
          cargo --version
      - name: Cache crates and build output
        if: needs.changes.outputs.e2ee == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            e2ee/mls-core/target
          key: e2ee-cargo-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('e2ee/mls-core/Cargo.lock') }}
      - name: Core format, lint and tests (scenarios, vectors)
        if: needs.changes.outputs.e2ee == 'true'
        working-directory: e2ee/mls-core
        run: |
          cargo fmt --check
          cargo clippy --locked --release --all-targets --features jni -- -D warnings
          cargo test --locked --release
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.e2ee == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.e2ee == 'true'
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm --filter @plainphone/server install --frozen-lockfile
        if: needs.changes.outputs.e2ee == 'true'
      - name: Demo against the real server (two parents, a child, add, remove, rotate, texts)
        if: needs.changes.outputs.e2ee == 'true'
        env:
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_e2ee
        run: scripts/e2ee-prototype-demo.sh
      - name: Build the core for the host JVM and for arm64 Android
        if: needs.changes.outputs.e2ee == 'true'
        run: |
          (cd e2ee/mls-core && cargo build --locked --release --lib --features jni)
          e2ee/mls-core/scripts/build-android.sh
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.e2ee == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Check preinstalled Android SDK packages
        id: sdk
        if: needs.changes.outputs.e2ee == 'true'
        run: |
          echo "path=${ANDROID_HOME:?Android SDK missing from runner}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/source.properties" ||
                ! -f "$ANDROID_HOME/build-tools/36.1.0/source.properties" ]]; then
            echo "cache-needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Android SDK packages
        if: steps.sdk.outputs.cache-needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platforms/android-37.0
            ${{ steps.sdk.outputs.path }}/build-tools/36.1.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform-37.0-build-tools-36.1.0
      - uses: android-actions/setup-android@v4
        if: needs.changes.outputs.e2ee == 'true'
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - name: Cache Robolectric instrumented SDKs
        id: robolectric
        if: needs.changes.outputs.e2ee == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: android/.gradle/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('android/gradle/robolectric.properties') }}
      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.e2ee == 'true'
      - name: Kotlin binding over JNI, and the library in debug APKs only
        if: needs.changes.outputs.e2ee == 'true'
        working-directory: android
        env:
          ROBOLECTRIC_SDK_CACHE_HIT: ${{ steps.robolectric.outputs.cache-hit }}
        run: |
          ./gradlew --no-daemon testGithubDebugUnitTest --tests 'org.plainphone.app.e2ee.*' assembleGithubDebug assembleGithubRelease \
            -PplainphoneE2eePrototype=true -PplainphoneMlsHostLib="$GITHUB_WORKSPACE/e2ee/mls-core/target/release/libplainphone_mls.so"
          grep -q 'tests="3" skipped="0" failures="0" errors="0"' \
            app/build/test-results/testGithubDebugUnitTest/TEST-org.plainphone.app.e2ee.MlsCoreJniTest.xml
          unzip -l app/build/outputs/apk/github/debug/app-github-debug.apk | grep -q 'lib/arm64-v8a/libplainphone_mls.so'
          if unzip -l app/build/outputs/apk/github/release/app-github-release.apk | grep -q 'libplainphone_mls'; then
            echo "::error::The release APK contains the E2EE prototype library."
            exit 1
          fi
          echo "debug APK has the prototype library, release APK does not"

  android-e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.emulator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # snapshot: restore a cached clean boot. API 29 cold-boots instead: after a snapshot
        # load, sys.boot_completed is 1 before the input service is published, so the
        # emulator action's own `input keyevent 82` fails and its shutdown then hangs
        # (runs 45018411514, 45026999548).
        include:
          - api: 34
            snapshot: true
          - api: 29
            snapshot: false
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: plainphone
          POSTGRES_PASSWORD: plainphone
          POSTGRES_DB: plainphone_e2e
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U plainphone -d plainphone_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Emulator harness tests
        run: python3 -m unittest scripts/test_e2e_android_emulator.py
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm --filter @plainphone/server install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the phone app, instrumentation and PiP fixture
        working-directory: android
        run: >-
          ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest :e2e-fixture:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm
      # Restored and saved as separate steps: a post-job save would store the AVD after the
      # flows below had written to it (Device Owner, adb disabled), not the clean boot.
      - name: Restore clean emulator snapshot
        id: avd
        if: matrix.snapshot
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.android/avd
          key: plainphone-avd-v5-${{ runner.os }}-${{ runner.arch }}-aosp-${{ matrix.api }}
      - name: Boot and save a clean snapshot
        if: matrix.snapshot && steps.avd.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel
          force-avd-creation: false
          emulator-boot-timeout: 240
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
            -feature ModemSimulator -phone-number 15555215554 -shell-serial tcp:127.0.0.1:5599,server,nowait
          script: adb shell getprop sys.boot_completed
      - name: Cache clean emulator snapshot
        if: matrix.snapshot && steps.avd.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.android/avd
          key: ${{ steps.avd.outputs.cache-primary-key }}
      - name: Run the device flows once
        # Ends a hang as a failure, so the artifact upload below still runs; a job that hits
        # its own limit is cancelled and uploads nothing (run 45018411514).
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # Bounds the emulator's own graceful shutdown; the cleanup step below kills what is left.
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "10"
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_e2e
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel
          force-avd-creation: false
          emulator-boot-timeout: 240
          emulator-options: >-
            ${{ matrix.snapshot && '-no-snapshot-save' || '-no-snapshot' }} -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
            -feature ModemSimulator -phone-number 15555215554 -shell-serial tcp:127.0.0.1:5599,server,nowait
          script: python3 scripts/e2e-android-emulator.py
      # The action's `emu kill` can hang after a failed start; the step timeout then stops the
      # action but not the emulator. Kill it so CPU and adb are free before the artifact upload.
      - name: Stop any emulator left running
        if: always()
        run: |
          pkill -9 -f qemu-system || true
          adb kill-server || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-e2e-api-${{ matrix.api }}
          path: android/build/emulator-e2e/
          retention-days: 14

  # Manual only, not a required check: does Play Protect block QR setup? (docs/testing.md)
  dpc-provisioning-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.dpc_probe
    uses: ./.github/workflows/dpc-provisioning-probe.yml
    with:
      api: ${{ inputs.dpc_probe_api }}
      image_tag: ${{ inputs.dpc_probe_image_tag }}

  offsite-backup:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.backup == 'false'
        run: echo "No backup or deployment Compose changes."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.backup == 'true'
        with:
          persist-credentials: false
      - name: Validate deployment Compose files
        if: needs.changes.outputs.backup == 'true'
        env:
          POSTGRES_PASSWORD: compose-validation-only
          PUBLIC_URL: https://example.org
          DNS_PROVIDER: mock
        run: |
          docker compose config --quiet
          docker compose -f deploy/dokploy-compose.yaml config --quiet
      - name: Run the off-site backup and restore drill
        if: needs.changes.outputs.backup == 'true'
        run: scripts/test-offsite-backup.sh

  docker:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.server == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.server == 'true'
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: needs.changes.outputs.server == 'true'
      - name: Build the server and web in the image
        if: needs.changes.outputs.server == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: plainphone:ci
          cache-from: type=gha,scope=plainphone-server
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=plainphone-server,ignore-error=true' || '' }}
      - name: Smoke test with Postgres
        if: needs.changes.outputs.server == 'true'
        run: |
          docker network create pp
          docker run -d --name db --network pp -e POSTGRES_PASSWORD=pw -e POSTGRES_USER=plainphone -e POSTGRES_DB=plainphone postgres:18
          for _ in $(seq 1 30); do docker exec db pg_isready -U plainphone -d plainphone && break; sleep 1; done
          docker run -d --name app --network pp -p 127.0.0.1::8080 \
            -e DATABASE_URL=postgres://plainphone:pw@db:5432/plainphone \
            -e PUBLIC_URL=http://localhost:8080 plainphone:ci
          url="http://$(docker port app 8080/tcp)"
          for _ in $(seq 1 30); do curl -fsS "$url/api/health" && break; sleep 1; done
          curl -fsS "$url/api/health" | grep '"ok":true'
          curl -fsS "$url/" | grep -i '<html'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$url/api/device/pairings")
          test "$code" = 201
      - name: Logs on failure
        if: failure() && needs.changes.outputs.server == 'true'
        run: docker logs app || true

  parent-app:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: parent-app
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.parent == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.parent == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.parent == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.parent == 'true'
        with:
          node-version: "24"
          cache: pnpm
      # The app and the workspace packages it imports (@plainphone/i18n, shared, api-client).
      # The server job checks that the API types match server/openapi.yaml.
      - name: Install the app and its workspace packages
        if: needs.changes.outputs.parent == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile --filter '@plainphone/parent-app...'
      # Same scheme as the server job: unchanged tasks come from Turborepo's cache.
      - name: Turborepo cache key
        id: turbo
        if: needs.changes.outputs.parent == 'true'
        run: echo "prefix=turbo-parent-${RUNNER_OS}-${RUNNER_ARCH}-node-$(node --version)-" >> "$GITHUB_OUTPUT"
      - name: Restore the Turborepo cache
        if: needs.changes.outputs.parent == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.turbo.outputs.prefix }}
      - name: Typecheck
        if: needs.changes.outputs.parent == 'true'
        run: pnpm exec turbo run typecheck --filter=@plainphone/parent-app
      - name: Lint
        if: needs.changes.outputs.parent == 'true'
        run: pnpm exec turbo run lint --filter=@plainphone/parent-app
      - name: Tests (Jest + React Native Testing Library)
        if: needs.changes.outputs.parent == 'true'
        run: pnpm exec turbo run test --filter=@plainphone/parent-app -- --ci
      - name: Export the JS bundles (iOS, Android, web)
        if: needs.changes.outputs.parent == 'true'
        run: pnpm exec turbo run export --filter=@plainphone/parent-app
      - name: Save the Turborepo cache
        if: ${{ !cancelled() && needs.changes.outputs.parent == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

  # The iPhone's Swift code (docs/ios/architecture.md): generate the Xcode project with xcodegen,
  # build the dev host and its extensions for the simulator, and run the unit tests. Unsigned.
  # Only takes a macOS runner when ios/ or the Swift module changed.
  ios:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.ios == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.ios == 'false'
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.ios == 'true'
        with:
          persist-credentials: false
      - name: Use the newest Xcode 26
        if: needs.changes.outputs.ios == 'true'
        run: |
          # Highest released Xcode 26 by version number; betas are skipped.
          xcode=$(python3 -c 'import glob, re; c = [p for p in glob.glob("/Applications/Xcode_26*.app") if "beta" not in p.lower()]; print(max(c, key=lambda p: [int(n) for n in re.findall(r"\d+", p)]) if c else "")')
          if [[ -z "$xcode" ]]; then echo "::error::No Xcode 26 on this runner."; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install xcodegen (pinned release, checked)
        if: needs.changes.outputs.ios == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Simulator picker tests
        if: needs.changes.outputs.ios == 'true'
        run: python3 -m unittest discover -s ios/scripts -p 'test_*.py'
      - name: Build for the simulator and run the unit tests
        if: needs.changes.outputs.ios == 'true'
        run: ios/scripts/ci.sh
      - uses: actions/upload-artifact@v7
        if: failure() && needs.changes.outputs.ios == 'true'
        with:
          name: ios-test-results
          path: ios/build/PlainphoneDev.xcresult
          retention-days: 7

  dns:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.dns == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.dns == 'true'
        with:
          persist-credentials: false

      - name: Unit tests
        if: needs.changes.outputs.dns == 'true'
        run: python3 -m unittest discover -s dns/tests -p 'test_ppdns.py' -v

      - name: Whole stack over DNS-over-TLS (AdGuard Home in Docker, self-signed certificate)
        if: needs.changes.outputs.dns == 'true'
        run: dns/tests/run-stack.sh

  site:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.site == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.site == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.site == 'true'
        with:
          node-version: "24"

      - name: Build
        if: needs.changes.outputs.site == 'true'
        run: node build.mjs

      - name: Check pages, internal links and anchors
        if: needs.changes.outputs.site == 'true'
        run: npm run check

      - name: Check external links
        if: needs.changes.outputs.site == 'true'
        # Other sites can be down for reasons outside this repo; report, don't block.
        continue-on-error: true
        run: node scripts/check.mjs --external

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.site == 'true'
        with:
          name: site-dist
          path: site/dist/
          retention-days: 14

  markdown:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.markdown == 'false'
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.markdown == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.markdown == 'true'
        with:
          node-version: "24"

      # Relative links only: CI has no network, and the site job reports external links.
      - name: Check relative links and anchors in Markdown files
        if: needs.changes.outputs.markdown == 'true'
        run: node --test scripts/check-markdown-links.test.mjs && node scripts/check-markdown-links.mjs
