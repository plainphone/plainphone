name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build
        run: node build.mjs

      - name: Check pages, internal links and anchors
        run: node scripts/check.mjs

      - name: Check external links
        # Other sites can be down for reasons outside this repo; report, don't block.
        continue-on-error: true
        run: node scripts/check.mjs --external

      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist/
          retention-days: 14
