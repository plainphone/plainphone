name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            site:
              - 'site/**'
              - '.github/workflows/**'

  build:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.site == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.site != 'false'

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.site != 'false'
        with:
          node-version: "24"

      - name: Build
        if: needs.changes.outputs.site != 'false'
        run: node build.mjs

      - name: Check pages, internal links and anchors
        if: needs.changes.outputs.site != 'false'
        run: node scripts/check.mjs

      - name: Check external links
        if: needs.changes.outputs.site != 'false'
        # Other sites can be down for reasons outside this repo; report, don't block.
        continue-on-error: true
        run: node scripts/check.mjs --external

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.site != 'false'
        with:
          name: site-dist
          path: site/dist/
          retention-days: 14
