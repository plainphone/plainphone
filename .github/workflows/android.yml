name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and APK build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: QR script tests
        working-directory: .
        run: python3 -m unittest scripts/test_provisioning_qr.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plainphone-apks-and-reports
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
          retention-days: 14
