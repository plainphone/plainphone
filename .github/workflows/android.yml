name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            build:
              - 'android/**'
              - 'scripts/provisioning-qr.py'
              - 'scripts/test_provisioning_qr.py'
              - 'scripts/smoke-release-apk.sh'
              - '.github/workflows/**'
            e2e:
              - 'android/**'
              - 'scripts/provisioning-qr.py'
              - 'scripts/test_provisioning_qr.py'
              - 'scripts/smoke-release-apk.sh'
              - '.github/workflows/**'
              - 'server/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'patches/**'
              - 'scripts/e2e-phone-sync.sh'

  build:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.build == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.build != 'false'

      - uses: actions/setup-java@v6
        if: needs.changes.outputs.build != 'false'
        with:
          distribution: temurin
          java-version: "21"

      - name: Check preinstalled Android SDK packages
        id: sdk
        if: needs.changes.outputs.build != 'false'
        run: |
          echo "path=${ANDROID_HOME:?Android SDK missing from runner}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/source.properties" ||
                ! -f "$ANDROID_HOME/build-tools/36.1.0/source.properties" ]]; then
            echo "cache-needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Android SDK packages
        if: steps.sdk.outputs.cache-needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platforms/android-37.0
            ${{ steps.sdk.outputs.path }}/build-tools/36.1.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform-37.0-build-tools-36.1.0
      - uses: android-actions/setup-android@v4
        if: needs.changes.outputs.build != 'false'
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.build != 'false'

      # Share compilation and SDK setup across debug and release checks.
      - name: Debug and release APKs, lint and debug unit tests
        if: needs.changes.outputs.build != 'false'
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleRelease lintRelease

      - name: Smoke test of the minified release APK (R8)
        if: needs.changes.outputs.build != 'false'
        working-directory: .
        run: scripts/smoke-release-apk.sh android/app/build/outputs/apk/release/app-release.apk

      - name: QR script tests
        if: needs.changes.outputs.build != 'false'
        working-directory: .
        run: python3 -m unittest scripts/test_provisioning_qr.py

      - uses: actions/upload-artifact@v7
        if: always() && needs.changes.outputs.build != 'false'
        with:
          name: plainphone-apks-and-reports
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
          retention-days: 14

  # The phone's sync code against the real server and PostgreSQL, without an emulator.
  phone-sync-e2e:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: ${{ needs.changes.result == 'success' && needs.changes.outputs.e2e != 'false' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: plainphone
          POSTGRES_PASSWORD: plainphone
          POSTGRES_DB: plainphone_e2e
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U plainphone -d plainphone_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.e2e == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.e2e != 'false'
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.e2e != 'false'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.e2e != 'false'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Locate the pnpm store
        id: pnpm-store
        if: needs.changes.outputs.e2e != 'false'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # The full workspace test owns this key. A filtered install would save a partial store.
      - name: Restore the root pnpm store
        if: needs.changes.outputs.e2e != 'false'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @plainphone/server install --frozen-lockfile
        if: needs.changes.outputs.e2e != 'false'
      - uses: actions/setup-java@v6
        if: needs.changes.outputs.e2e != 'false'
        with:
          distribution: temurin
          java-version: "21"
      - name: Check preinstalled Android SDK packages
        id: sdk
        if: needs.changes.outputs.e2e != 'false'
        run: |
          echo "path=${ANDROID_HOME:?Android SDK missing from runner}" >> "$GITHUB_OUTPUT"
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/source.properties" ||
                ! -f "$ANDROID_HOME/build-tools/36.1.0/source.properties" ]]; then
            echo "cache-needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Android SDK packages
        if: steps.sdk.outputs.cache-needed == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ steps.sdk.outputs.path }}/platforms/android-37.0
            ${{ steps.sdk.outputs.path }}/build-tools/36.1.0
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-platform-37.0-build-tools-36.1.0
      - uses: android-actions/setup-android@v4
        if: needs.changes.outputs.e2e != 'false'
        with:
          packages: "platforms;android-37.0 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.e2e != 'false'
      - name: Pair, sync rules, Find and status against the real server
        if: needs.changes.outputs.e2e != 'false'
        env:
          DATABASE_URL: postgres://plainphone:plainphone@localhost:${{ job.services.postgres.ports['5432'] }}/plainphone_e2e
        run: scripts/e2e-phone-sync.sh
