name: DNS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dns: ${{ steps.filter.outputs.dns }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            dns:
              - 'dns/**'
              - '.github/workflows/**'

  test:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a successful change check
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::Change detection did not complete successfully."
          exit 1
      - name: No relevant changes
        if: needs.changes.outputs.dns == 'false'
        working-directory: .
        run: echo "Checks are up to date for this change."
      - uses: actions/checkout@v7
        if: needs.changes.outputs.dns != 'false'

      - name: Unit tests
        if: needs.changes.outputs.dns != 'false'
        run: python3 -m unittest discover -s dns/tests -p 'test_ppdns.py' -v

      - name: Whole stack over DNS-over-TLS (AdGuard Home in Docker, self-signed certificate)
        if: needs.changes.outputs.dns != 'false'
        run: dns/tests/run-stack.sh
