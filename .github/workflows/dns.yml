name: DNS

on:
  push:
    branches: [main]
    paths: ["dns/**", "server/catalog/helplines/**", ".github/workflows/dns.yml"]
  pull_request:
    paths: ["dns/**", "server/catalog/helplines/**", ".github/workflows/dns.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: python3 -m unittest discover -s dns/tests -p 'test_ppdns.py' -v

      - name: Whole stack over DNS-over-TLS (AdGuard Home in Docker, self-signed certificate)
        run: dns/tests/run-stack.sh
