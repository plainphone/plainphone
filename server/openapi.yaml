        "202": { $ref: "#/components/responses/ChangePending" }
        "404": { description: "Not in this phone's catalog" }
  /phones/{pid}/catalog/{package}:
    delete:
      operationId: deletePhonesCatalog
      tags: [catalog]
      summary: Remove an app added from the catalog
      description: Hides it and takes it off the install list. Applies at once.
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: package, in: path, required: true, schema: { $ref: "#/components/schemas/PackageName" } }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }

  /households/{hid}/server-move/phones:
