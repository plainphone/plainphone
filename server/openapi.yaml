  /phones/{pid}/settings:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhonesSettings
      summary: Get the phone settings
      description: Every setting, with `free` filled in for those that are not set. Works the same for Child and Self phones.
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: All settings
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: object
                    propertyNames: { $ref: "#/components/schemas/PhoneSettingKey" }
                    additionalProperties: { $ref: "#/components/schemas/PhoneSetting" }
        "404": { description: "Unknown phone, or not in your household" }
  /phones/{pid}/settings/{key}:
    put:
      operationId: putPhonesSettings
      summary: Set, lock or free one phone setting
      description: |
        A setting that is not supported in the given mode, or a value it does not accept, answers `400`
        (a missing value too, and a value for a setting that takes none). An unknown `key` answers `404`.
        On a Self phone, leaving `locked` or changing the value of a locked setting answers `202` and waits
        for the key (Bluetooth from `noNewDevices` to `off` excepted); everything else applies at once.
        The server stores light-mode phones' settings too, but the phone ignores them there.
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: key, in: path, required: true, schema: { $ref: "#/components/schemas/PhoneSettingKey" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneSetting" }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: "Unknown phone or unknown setting key" }
  /phones/{pid}/home:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhonesHome
      summary: Get the home screen
      description: Defaults are filled in.
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The home screen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
    put:
      operationId: putPhonesHome
      summary: Change the home screen
      description: Send the layout settings. The free promise is updated separately. Never waits for the key.
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeLayoutSettings" }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "400": { $ref: "#/components/responses/Error" }
    patch:
      operationId: patchPhonesHome
      summary: Show or hide the free promise on this phone
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeFreePromise" }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: Unknown phone }

  /phones/{pid}/contact-suggestions:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getContactSuggestions
      tags: [rules]
      summary: List the child's contacts awaiting review
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: "Pending suggestions"
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [id, name, numbers]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        numbers:
                          type: array
                          items: { $ref: "#/components/schemas/E164" }
        "404": { description: "Child phone not found" }
    post:
      operationId: reviewContactSuggestions
      tags: [rules]
      summary: Approve or dismiss a contact suggestion, or approve the suggestions shown together
      description: Each ID represents the displayed name and numbers. IDs that are no longer pending are ignored.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, id]
                  properties:
                    action: { type: string, enum: [approve, reject] }
                    id: { type: string, format: uuid }
                - type: object
                  required: [action, suggestionIds]
                  properties:
                    action: { type: string, enum: [approveAll] }
                    suggestionIds:
                      type: array
                      minItems: 1
                      items: { type: string, format: uuid }
      responses:
        "204": { description: "Reviewed" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: "Child phone not found" }
        "413": { description: "Review exceeds 4 MiB" }

  /phones/{pid}/contact-schedule:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    put:
      operationId: setContactSchedule
      tags: [rules]
      summary: Restrict a Self phone to favourites during active schedules
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [restricted]
              properties:
                restricted: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "400": { $ref: "#/components/responses/Error" }

  /phones/{pid}/contacts:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhonesContacts
      summary: Get phones contacts
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Approved contacts or favourites and contact settings
          content:
            application/json:
              schema:
                type: object
                required: [contacts]
                properties:
                  contacts:
                    type: array
                    items:
                      type: object
                      required: [id, name, number]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        number: { $ref: "#/components/schemas/E164" }
                        sosParent: { type: boolean }
                        group: { $ref: "#/components/schemas/ContactGroup" }
                  selfScheduleContacts: { type: [boolean, "null"] }
                  suggestDeviceContacts: { type: boolean }
                  lightContactRestriction: { type: boolean }
    patch:
      operationId: patchChildContactSettings
      summary: Update a child phone's contact settings
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                suggestDeviceContacts:
                  type: boolean
                  description: Turning this off also deletes all undecided suggestions.
                lightContactRestriction:
                  type: boolean
                  description: Available on light phones only.
      responses:
        "200":
          description: Contact settings immediately before and after the save
          content:
            application/json:
              schema:
                type: object
                required: [before, after]
                properties:
                  before: { $ref: "#/components/schemas/ChildContactSettings" }
                  after: { $ref: "#/components/schemas/ChildContactSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: "Child phone not found" }
    post:
      operationId: postPhonesContacts
      summary: Post phones contacts
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, number]
              properties:
                name: { type: string }
                number: { type: string, description: "International format; spaces, dashes and brackets are removed." }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
  /phones/{pid}/contacts/{cid}:
    patch:
      operationId: setContactGroup
      summary: Move a contact to Family, Friends or Others
      tags: [rules]
      description: Child phones only. A contact marked as a parent is always Family.
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: cid, in: path, required: true, description: Contact id, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [group]
              properties:
                group: { $ref: "#/components/schemas/ContactGroup" }
      responses:
        "200":
          description: The contact
          content:
            application/json:
              schema:
                type: object
                required: [id, name, number, group]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  number: { $ref: "#/components/schemas/E164" }
                  group: { $ref: "#/components/schemas/ContactGroup" }
                  sosParent: { type: boolean }
        "400": { description: "A parent outside Family, or an invalid group" }
        "404": { description: "Contact or child phone not found" }
    delete:
      operationId: deletePhonesContacts
      summary: Delete phones contacts
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: cid, in: path, required: true, description: Contact id, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/Change" }

  /phones/{pid}/dns:
    get:
      operationId: getPhonesDns
      summary: Get phones dns
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "200": { description: "host (null in mock mode or until the resolver confirmed it), rulesReady (the phone is filtered; show waiting texts only while false), synced, blockedCategories, allowDomains, blockDomains" }
  /phones/{pid}/dns/method:
    put:
      operationId: setPhoneFilterMethod
      summary: Switch the filter method of a light phone
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { $ref: "#/components/schemas/FilterMethod" }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "409": { description: The phone uses strong mode }
  /phones/{pid}/dns/categories/{category}:
    put:
      operationId: putPhonesDnsCategories
      summary: Put phones dns categories
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: category, in: path, required: true, schema: { $ref: "#/components/schemas/DnsCategory" } }
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [blocked], properties: { blocked: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
  /phones/{pid}/dns/{list}:
    post:
      operationId: postPhonesDnsDomain
      tags: [rules]
      summary: Add a domain to the allow or block list
      description: A domain is never on both lists; adding it to one removes it from the other.
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: list, in: path, required: true, schema: { enum: [allow, block] } }
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [domain], properties: { domain: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
  /phones/{pid}/dns/{list}/{domain}:
    delete:
      operationId: deletePhonesDnsDomain
      summary: Delete phones dns domain
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: list, in: path, required: true, schema: { enum: [allow, block] } }
        - { name: domain, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }

  /phones/{pid}/schedules:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhonesSchedules
      summary: Get phones schedules
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { description: "School time and bedtime windows" }
    post:
      operationId: postPhonesSchedules
      summary: Post phones schedules
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200": { $ref: "#/components/responses/Change" }
  /phones/{pid}/schedules/{sid}:
    parameters:
      - { $ref: "#/components/parameters/phoneId" }
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: putPhonesSchedules
      summary: Put phones schedules
      tags: [rules]
      description: Pending on a Self phone if the new window frees any minute of the old one or allows more apps.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
    delete:
      operationId: deletePhonesSchedules
      summary: Delete phones schedules
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }

  /phones/{pid}/modes:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhoneModes
      summary: The phone's modes and weekly schedule
      tags: [rules]
      description: Child phones only (404 on a Self phone). See docs/modes.md.
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Modes, slots and the mode on now
          content:
            application/json:
              schema:
                type: object
                required: [enabled, parentsMarked, timezone, modes, slots, current]
                properties:
                  enabled: { type: boolean }
                  parentsMarked: { type: boolean, description: "False: no contact is marked as a parent, so contact groups do not narrow the list." }
                  timezone: { type: string }
                  modes:
                    type: array
                    items: { $ref: "#/components/schemas/Mode" }
                  slots:
                    type: array
                    items: { $ref: "#/components/schemas/ModeSlot" }
                  current:
                    type: [object, "null"]
                    description: Null while modes are off.
                    required: [modeId, until]
                    properties:
                      modeId: { type: string, format: uuid }
                      until: { type: [string, "null"], description: "HH:MM local time the slot ends; null for the default mode." }
        "404": { description: Not a child phone }
    post:
      operationId: createPhoneMode
      summary: Add a mode
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeInput" }
      responses:
        "201":
          description: The new mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mode" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: Not a child phone }
  /phones/{pid}/modes/{mid}:
    parameters:
      - { $ref: "#/components/parameters/phoneId" }
      - { name: mid, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updatePhoneMode
      summary: Change a mode
      tags: [rules]
      description: The default mode only takes `{ name }`.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeInput" }
      responses:
        "200":
          description: The mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mode" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: Mode not found }
    delete:
      operationId: deletePhoneMode
      summary: Delete a mode and its slots
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "204": { description: Deleted }
        "404": { description: Mode not found }
        "409": { description: The default mode cannot be deleted }
  /phones/{pid}/mode-schedule:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    put:
      operationId: setPhoneModeSchedule
      summary: Replace the weekly schedule of modes
      tags: [rules]
      description: Slots may not overlap (400 `overlap`) and may not use the default mode, which applies outside them.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slots]
              properties:
                slots:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [modeId, days, startMinute, endMinute]
                    properties:
                      modeId: { type: string, format: uuid }
                      days:
                        type: array
                        items: { type: integer, minimum: 1, maximum: 7 }
                      startMinute: { type: integer, minimum: 0, maximum: 1439 }
                      endMinute: { type: integer, minimum: 0, maximum: 1439 }
      responses:
        "200":
          description: The saved slots
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items: { $ref: "#/components/schemas/ModeSlot" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: Not a child phone }

  /phones/{pid}/notifications:
    put:
      operationId: putPhoneNotifications
      tags: [notifications]
      summary: Turn my notifications about this phone on or off
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "204": { description: "Saved" }
  /phones/{pid}/requests:
    get:
      operationId: getPhoneRequests
      tags: [phones]
      summary: Open requests from the phone
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "200":
          description: Open requests, oldest first, with the app's name
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/PhoneRequest"
                        - type: object
                          properties:
                            phoneId: { type: string, format: uuid }
                            appLabel: { type: [string, "null"] }
                  recent:
                    type: array
                    description: The last few answered requests (3 days), newest first, with where the answer came from.
                    items:
                      allOf:
                        - $ref: "#/components/schemas/PhoneRequest"
                        - type: object
                          properties:
                            phoneId: { type: string, format: uuid }
                            appLabel: { type: [string, "null"] }
  /phones/{pid}/requests/{rid}/approve:
    post:
      operationId: approvePhoneRequest
      tags: [phones]
      summary: Approve a request
      description: |
        Applies it as a rule change: the app is shown, or the contact is added. On a Self
        phone that waits for the key (202). `name` corrects a contact's name.
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string, maxLength: 60 } } }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "409":
          description: No longer open. `outcome` says who answered first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestOutcomeError" }
  /phones/{pid}/requests/{rid}/reject:
    post:
      operationId: rejectPhoneRequest
      tags: [phones]
      summary: Decline a request
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Declined" }
        "409":
          description: No longer open. `outcome` says who answered first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestOutcomeError" }
  /phones/{pid}/location:
    get:
      operationId: getPhonesLocation
      tags: [rules]
      summary: Last known position (only one is stored)
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "200":
          description: The position, the location mode and the latest ring and check-in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationState" }
  /phones/{pid}/location/mode:
    put:
      operationId: putPhonesLocationMode
      tags: [rules]
      summary: Choose when the phone sends its position
      description: Applies at once. `off` deletes the stored position. `always` needs `alwaysFor` (400 without) and ends by itself.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/LocationMode" }
                alwaysFor: { $ref: "#/components/schemas/AlwaysFor" }
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationState" }
  /phones/{pid}/update:
    post:
      operationId: requestPhoneUpdate
      tags: [rules]
      summary: Ask the phone to check for a Plainphone update now
      description: Sets `update.requestedAt` in the rules and wakes the phone.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "202": { description: "Requested" }
        "404": { description: "Phone not found" }

  /phones/{pid}/app-updates:
    post:
      operationId: requestAppUpdates
      tags: [rules]
      summary: Ask a strong-mode phone to open its app update window now ("Update apps now")
      description: Sets `appUpdates.requestedAt` in the rules and wakes the phone. The phone reports the window in its status.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "202": { description: "Requested" }
        "404": { description: "Phone not found" }
        "409": { description: "The phone is in light mode, which never blocks app updates", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /phones/{pid}/locate:
    post:
      operationId: postPhonesLocate
      tags: [rules]
      summary: Find the phone now
      description: Sets `location.requestedAt` in the rules and wakes the phone. Poll GET location for the answer.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "202": { description: "Requested" }
        "409": { description: "Location is off" }
  /phones/{pid}/ring:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    post:
      operationId: postPhonesRing
      tags: [rules]
      summary: Ring the phone
      description: Alarm sound at full volume and vibration, also on silent, for at most 5 minutes. With `stopOnAnswer` (default) it stops when the child taps "I'm here"; without, it rings the full 5 minutes. Replaces an earlier ring.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stopOnAnswer: { type: boolean, default: true }
      responses:
        "202":
          description: Sent to the phone
          content:
            application/json:
              schema:
                type: object
                properties:
                  ring: { $ref: "#/components/schemas/Ring" }
        "429": { description: "Too many requests for this phone" }
    delete:
      operationId: deletePhonesRing
      tags: [rules]
      summary: Stop ringing
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { description: "The ring, now stopped (or null)" }
  /phones/{pid}/checkin:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    post:
      operationId: postPhonesCheckin
      tags: [rules]
      summary: Ask "Are you okay?"
      description: The phone shows "Yes, I'm okay" and, with `callNumber`, "Call me". If nobody answers within `minutes` and the location mode is `checkin` or `always`, the phone sends one position. Replaces an earlier check-in.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 120, examples: [5, 10, 15, 30] }
                callNumber: { type: [string, "null"], description: "One of the phone's approved contacts (400 otherwise)." }
      responses:
        "202":
          description: Sent to the phone
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkin: { $ref: "#/components/schemas/Checkin" }
        "400": { description: "Bad minutes, or callNumber is not an approved contact" }
        "429": { description: "Too many requests for this phone" }
    delete:
      operationId: deletePhonesCheckin
      tags: [rules]
      summary: Cancel an open "Are you okay?"
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { description: "The check-in, now cancelled (or as it was if already answered or located)" }

  # ---------------------------------------------------------------- self
  /phones/{pid}/setup-undo:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhoneSetupUndo
      summary: Get the phone’s setup undo choice and whether it is still editable
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Minutes, editability, and the deadline reported by the phone
          content:
            application/json:
              schema:
                type: object
                required: [minutes, editable, undoUntil]
                properties:
                  minutes: { type: integer, enum: [0, 5, 10, 30, 60] }
                  editable: { type: boolean }
                  undoUntil: { type: [string, "null"], format: date-time }
    put:
      operationId: putPhoneSetupUndo
      summary: Set the setup undo period on a light-mode phone before pairing
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: integer, enum: [0, 5, 10, 30, 60] }
      responses:
        "200": { description: Minutes and editable flag }
        "409": { $ref: "#/components/responses/Error" }
  /phones/{pid}/trusted-invite:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    post:
      operationId: postPhoneTrustedInvite
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      summary: Create a QR invite for a Self phone waiting for a helper
      responses:
        "402": { $ref: "#/components/responses/PlanLimit" }
        "201": { description: Invite URL and expiry }
        "409": { $ref: "#/components/responses/Error" }
  /phones/{pid}/self-template:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    post:
      operationId: postPhoneSelfTemplate
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      summary: Share a short-lived copy of the phone’s selected rules
      responses:
        "201": { description: Template URL }
        "409": { $ref: "#/components/responses/Error" }
  /phones/{pid}/key:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhonesKey
      summary: Get phones key
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The key (Self phones only)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Key" }
                  - type: object
                    properties:
                      level: { $ref: "#/components/schemas/SelfLevel" }
                      trustedAccepted: { type: boolean, description: The trusted person has signed in. }
                      payUnlockCurrency: { type: string }
                      emergency: { $ref: "#/components/schemas/EmergencyState" }
        "404": { description: "Not a Self phone" }
    put:
      operationId: putPhonesKey
      summary: Put phones key
      tags: [self]
      description: Only a longer delay applies at once; every other key change goes through the current key.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Key" }
      responses:
        "402": { $ref: "#/components/responses/PlanLimit" }
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
  /phones/{pid}/emergency-openings:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhonesEmergencyOpenings
      summary: The emergency-opening settings, this month's use and the last 90 days of openings
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Settings and history (Self phones only)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/EmergencyState" }
                  - type: object
                    required: [openings]
                    properties:
                      openings:
                        type: array
                        items: { $ref: "#/components/schemas/EmergencyOpening" }
        "404": { description: "Not a Self phone" }
    put:
      operationId: putPhonesEmergencyOpenings
      summary: Switch emergency openings on or off and set the monthly allowance
      tags: [self]
      description: Switching them on or raising the allowance loosens, so it goes through the key. Switching off or lowering applies at once.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, allowance]
              properties:
                enabled: { type: boolean }
                allowance: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "404": { description: "Not a Self phone" }

  /phones/{pid}/changes:
    get:
      operationId: getPhonesChanges
      tags: [self]
      summary: Pending changes on a phone
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "200":
          description: Pending changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes: { type: array, items: { $ref: "#/components/schemas/PendingChange" } }
  /changes/{cid}/cancel:
    post:
      operationId: postChangesCancel
      summary: Post changes cancel
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/changeId" }]
      responses:
        "204": { description: "Cancelled" }
        "409": { description: "No longer pending" }
  /people-i-help:
    get:
      operationId: getPeopleIHelp
      tags: [self]
      summary: List Self phones for which I hold the key
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Phones, owner emails and each phone's emergency openings
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required: [id, name, owner, emergency]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        owner: { type: string }
                        emergency:
                          allOf:
                            - { $ref: "#/components/schemas/EmergencyState" }
                            - type: object
                              required: [openings]
                              properties:
                                openings:
                                  type: array
                                  description: The ten latest.
                                  items: { $ref: "#/components/schemas/EmergencyOpening" }
  /approvals:
    get:
      operationId: getApprovals
      tags: [self]
      summary: Requests waiting for me as a trusted person
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Pending approvals with the change shown to the helper.
          content:
            application/json:
              schema:
                type: object
                required: [approvals]
                properties:
                  approvals:
                    type: array
                    items:
                      type: object
                      required: [id, phoneId, phoneName, requestedBy, summary, revision, createdAt]
                      properties:
                        id: { type: string, format: uuid }
                        phoneId: { type: string, format: uuid }
                        phoneName: { type: string }
                        requestedBy: { type: [string, "null"] }
                        summary: { $ref: "#/components/schemas/ApprovalSummary" }
                        revision: { $ref: "#/components/schemas/ApprovalRevision" }
                        createdAt: { type: string, format: date-time }
  /changes/{cid}/approve-qr:
    post:
      operationId: postChangesApproveQr
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      summary: Approve with a one-time QR challenge as the current trusted person
      parameters: [{ $ref: "#/components/parameters/changeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, revision]
              properties:
                challenge: { type: string, maxLength: 240 }
                revision: { $ref: "#/components/schemas/ApprovalRevision" }
      responses:
        "204": { description: Applied }
        "404": { description: Not my request to decide }
        "409": { $ref: "#/components/responses/ApprovalConflict" }
  /changes/{cid}/approve:
    post:
      operationId: postChangesApprove
      summary: Post changes approve
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/changeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: { $ref: "#/components/schemas/ApprovalRevision" }
      responses:
        "204": { description: "Applied" }
        "409": { $ref: "#/components/responses/ApprovalConflict" }
        "404": { description: "Not my request to decide" }
  /changes/{cid}/reject:
    post:
      operationId: postChangesReject
      summary: Post changes reject
      tags: [self]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/changeId" }]
      responses:
        "204": { description: "Rejected, or already rejected by you" }
        "409": { $ref: "#/components/responses/ApprovalConflict" }
  /changes/{cid}/pay-unlock:
    post:
      operationId: postChangesPayUnlock
      tags: [self]
      summary: Pay to apply a delayed change now (not available yet)
      description: Data model and flag only (D13). Answers 409 when not offered and 501 while no payment provider exists.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/changeId" }]
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "501": { $ref: "#/components/responses/Error" }
  /households/{hid}/plan:
    get:
      operationId: getHouseholdPlan
      tags: [billing]
      summary: The household's plan, limits, usage and prices
      description: Also answers while billing is off, with plan "unlimited" and no channels.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "404": { $ref: "#/components/responses/Error" }
  /households/{hid}/plan/checkout:
    post:
      operationId: postHouseholdPlanCheckout
      tags: [billing]
      summary: Open a Stripe Checkout for the paid plan (web dashboard only)
      description: Never used by store builds. The plan changes only when Stripe's signed webhook arrives.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /households/{hid}/plan/portal:
    post:
      operationId: postHouseholdPlanPortal
      tags: [billing]
      summary: Open Stripe's customer portal to change or cancel a card subscription
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } }
        "404": { $ref: "#/components/responses/Error" }
  /changes/{cid}/early-unlock:
    get:
      operationId: getChangeEarlyUnlock
      tags: [billing]
      summary: The early unlock offer for a pending change
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/changeId" }]
      responses:
        "200":
          description: The offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarlyUnlockOffer" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: postChangeEarlyUnlock
      tags: [billing]
      summary: Buy an early unlock by card (web dashboard only)
      description: |
        Needs the express consent to start before the withdrawal period ends (`consent: true`,
        never pre-ticked). A retry returns the same purchase and checkout. The change applies about
        ten minutes after Stripe confirms payment.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/changeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties:
                consent: { const: true }
                locale: { type: string }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [purchase, checkoutUrl]
                properties:
                  purchase: { $ref: "#/components/schemas/EarlyUnlockPurchase" }
                  checkoutUrl: { type: [string, "null"], format: uri }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /early-unlocks/{id}:
    get:
      operationId: getEarlyUnlock
      tags: [billing]
      summary: One early unlock purchase (the receipt)
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: The purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarlyUnlockPurchase" }
        "404": { $ref: "#/components/responses/Error" }
  /early-unlocks/{id}/withdraw:
    post:
      operationId: postEarlyUnlockWithdraw
      tags: [billing]
      summary: Withdraw from the contract (Fortryd aftale)
      description: Before delivery only. Restores the original wait, refunds in full and mails a receipt. Works also after billing is switched off again.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { const: true }
                name: { type: string, maxLength: 120, description: Only written into the receipt mail, never stored. }
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarlyUnlockPurchase" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /billing/stripe/webhook:
    post:
      operationId: postStripeWebhook
      tags: [billing]
      summary: Stripe webhook (signed with STRIPE_WEBHOOK_SECRET)
      description: Idempotent per event id. Handles checkout.session.*, customer.subscription.* and charge.refunded.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Received }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /billing/play/rtdn:
    post:
      operationId: postPlayRtdn
      tags: [billing]
      summary: Google Play real-time developer notifications (Pub/Sub push, ?token=PLAY_RTDN_TOKEN)
      description: Idempotent per Pub/Sub message id. The state is always looked up at Google before it is stored.
      security: []
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Received }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /device/billing:
    get:
      operationId: getDeviceBilling
      tags: [device, billing]
      summary: The household plan and Play product ids, for Play builds (phone)
      security: [{ device: [] }]
      responses:
        "200": { description: The plan }
        "404": { $ref: "#/components/responses/Error" }
  /device/billing/play:
    post:
      operationId: postDeviceBillingPlay
      tags: [device, billing]
      summary: Report a finished Google Play purchase (phone)
      description: The server looks the token up at Google, checks it belongs to this household, then acknowledges or consumes it.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, productId, purchaseToken]
              properties:
                kind: { enum: [plan, earlyUnlock] }
                productId: { type: string }
                purchaseToken: { type: string }
      responses:
        "200": { description: Recorded }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /device/early-unlocks:
    get:
      operationId: getDeviceEarlyUnlocks
      tags: [device, billing]
      summary: Early unlock offers for this Myself phone's pending changes (phone)
      security: [{ device: [] }]
      responses:
        "200": { description: The offers }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: postDeviceEarlyUnlock
      tags: [device, billing]
      summary: Start an early unlock through Google Play (phone, Play builds only)
      description: There is no card path from a phone. Returns the product id and the ids to put in the Play purchase.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeId, consent]
              properties:
                changeId: { type: string, format: uuid }
                consent: { const: true }
      responses:
        "201": { description: Started }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /device/early-unlocks/{id}/withdraw:
    post:
      operationId: postDeviceEarlyUnlockWithdraw
      tags: [device, billing]
      summary: Withdraw from an early unlock bought on this phone (phone)
      security: [{ device: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { const: true }
                name: { type: string }
      responses:
        "200": { description: Withdrawn }
        "409": { $ref: "#/components/responses/Error" }
  # --- E2EE phase 0 prototype (docs/e2ee-prototype.md). Test data only. -------------------------
  /e2ee/devices:
    post:
      operationId: registerE2eeDevice
      summary: Register an MLS client for the caller (prototype)
      description: |
        A parent's app (session) becomes an `admin` device in `householdId`; a child phone
        (device token) becomes the `child` device of its own household. Every `/e2ee` route
        answers 404 unless `E2EE_PROTOTYPE_ENABLED` is true, which production refuses.
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, mlsSignPub]
              properties:
                deviceId: { type: string, format: uuid, description: "A random lowercase UUIDv4 the client picks; its MLS credential carries it" }
                householdId: { type: string, format: uuid, description: Required for parents }
                mlsSignPub: { type: string, description: 32-byte Ed25519 MLS leaf key, base64url }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, role]
                properties:
                  deviceId: { type: string, format: uuid }
                  role: { enum: [admin, child] }
        "404": { description: Prototype off, or not the caller's household }
        "409": { description: Too many devices for the caller, or the device ID is in use }
    get:
      operationId: listE2eeDevices
      summary: The household's active MLS devices (prototype; clients trust the household log, not this list)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      parameters: [{ name: householdId, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      required: [deviceId, role, mlsSignPub]
                      properties:
                        deviceId: { type: string, format: uuid }
                        role: { enum: [admin, child] }
                        mlsSignPub: { type: string }
        "404": { description: Prototype off, or not the caller's household }
  /e2ee/devices/{did}:
    delete:
      operationId: revokeE2eeDevice
      summary: Revoke an MLS device; delivery to it stops at once (prototype)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      parameters: [{ name: did, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Revoked; its key packages and waiting deliveries are deleted }
        "404": { description: Prototype off, or not a device the caller may revoke }
  /e2ee/key-packages:
    post:
      operationId: publishE2eeKeyPackages
      summary: Publish MLS key packages, and optionally replace the last-resort one (prototype)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, format: uuid }
                keyPackages: { type: array, maxItems: 20, items: { type: string, description: "KeyPackage, base64url, at most 4096 bytes" } }
                lastResort: { type: string }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { type: object, required: [stored], properties: { stored: { type: integer } } }
        "400": { description: Not a key package for cipher suite 1 }
        "409": { description: More than 50 key packages waiting }
  /e2ee/key-packages/claim:
    post:
      operationId: claimE2eeKeyPackages
      summary: An admin device claims one key package per device to add (prototype)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, deviceIds]
              properties:
                deviceId: { type: string, format: uuid }
                deviceIds: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
      responses:
        "200":
          description: One key package per device. A normal one is used up; the last-resort one is reused.
          content:
            application/json:
              schema:
                type: object
                required: [keyPackages]
                properties:
                  keyPackages:
                    type: array
                    items:
                      type: object
                      required: [deviceId, keyPackage]
                      properties:
                        deviceId: { type: string, format: uuid }
                        keyPackage: { type: string }
        "403": { description: Only a parent device adds members }
        "409": { description: A device has no key package }
  /e2ee/groups:
    post:
      operationId: createE2eeGroup
      summary: Start a conversation for an MLS group created on the caller's device (prototype)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, mlsGroupId]
              properties:
                deviceId: { type: string, format: uuid }
                mlsGroupId: { type: string, description: "The random MLS group ID, 16 to 64 bytes, base64url" }
      responses:
        "201":
          description: Created at epoch 0 with the caller as the only member
          content:
            application/json:
              schema:
                type: object
                required: [groupId, epoch]
                properties:
                  groupId: { type: string, format: uuid }
                  epoch: { type: integer }
        "403": { description: Only a parent device starts a conversation }
        "409": { description: The conversation exists }
  /e2ee/groups/{gid}:
    get:
      operationId: getE2eeGroup
      summary: The server's epoch and declared members; a client behind it syncs before sending (prototype)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      parameters:
        - { name: gid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                type: object
                required: [groupId, epoch, members]
                properties:
                  groupId: { type: string, format: uuid }
                  epoch: { type: integer }
                  members: { type: array, items: { type: string, format: uuid } }
        "404": { description: Not a member }
  /e2ee/groups/{gid}/commits:
    post:
      operationId: postE2eeCommit
      summary: Submit a commit (and its Welcome) for the current epoch (prototype)
      description: |
        The server reads the commit's clear header and accepts exactly one commit per epoch.
        Old members (also removed ones) get the commit, added members the Welcome. Adding or
        removing members needs an admin device.
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      parameters: [{ name: gid, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, commit, members]
              properties:
                deviceId: { type: string, format: uuid }
                commit: { type: string, description: "MLS PrivateMessage with a commit, at most 64 KiB" }
                welcome: { type: string, description: "MLS Welcome, at most 64 KiB; only with added members" }
                members: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: uuid }, description: Device IDs after the commit }
      responses:
        "201":
          description: Accepted
          content:
            application/json:
              schema: { type: object, required: [epoch], properties: { epoch: { type: integer } } }
        "400": { description: Not a commit for this conversation, or invalid members }
        "403": { description: Only a parent device adds or removes members }
        "409": { $ref: "#/components/responses/Error" }
  /e2ee/groups/{gid}/messages:
    post:
      operationId: postE2eeMessage
      summary: Send an application message to every other member (prototype)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      parameters: [{ name: gid, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, message]
              properties:
                deviceId: { type: string, format: uuid }
                message: { type: string, description: "MLS PrivateMessage with application content, at most 8 KiB" }
      responses:
        "201": { description: Queued for every other member }
        "400": { description: Not an application message for this conversation }
        "409": { $ref: "#/components/responses/Error" }
  /e2ee/inbox:
    get:
      operationId: getE2eeInbox
      summary: Waiting MLS messages for one device, in its delivery order (prototype)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      parameters:
        - { name: deviceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Up to 200 items after the cursor
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [cursor, groupId, kind, epoch, payload]
                      properties:
                        cursor: { type: integer }
                        groupId: { type: string, format: uuid }
                        kind: { enum: [welcome, commit, application] }
                        epoch: { type: integer }
                        payload: { type: string }
  /e2ee/inbox/ack:
    post:
      operationId: ackE2eeInbox
      summary: Delete delivered items up to a cursor (prototype)
      tags: [e2ee-prototype]
      security: [{ session: [] }, { device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, upTo]
              properties:
                deviceId: { type: string, format: uuid }
                upTo: { type: integer, minimum: 1 }
      responses:
        "204": { description: Deleted; messages nobody still needs are deleted too }
