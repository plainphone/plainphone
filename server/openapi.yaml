# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: Plainphone API
  version: 0.4.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    One API for the phone (tag `device`) and for parent apps (the PWA now, native apps later).

    **Phone flow.** The phone starts a pairing and shows the code (and `qrUrl` as a QR code).
    A parent claims the code in the PWA. The phone polls the pairing until it gets its device
    token, then polls `GET /device/rules` with `If-None-Match`. Push (FCM) is a planned extra
    layer that only shortens the wait; polling every `pollSeconds` is the delivery guarantee.

    **Self profile.** Changes that loosen the rules on a Self phone answer `202` with a pending
    change. They take effect after the delay, or when the trusted person approves. Changes that
    tighten always answer `200` and apply at once.

    **Auth.** Parent apps send `Authorization: Bearer pp_s_…` (native) or the `pp_session`
    cookie (PWA; cookie writes must come from the same origin). The phone sends
    `Authorization: Bearer pp_d_…`. All request bodies are JSON with
    `Content-Type: application/json`.
servers:
  - url: https://app.plainphone.org/api
  - url: http://localhost:8080/api

tags:
  - name: device
    description: Called by the Plainphone app on the phone.
  - name: auth
  - name: household
  - name: phones
  - name: rules
  - name: self
    description: Self profile key, pending changes and the trusted person.
  - name: reset-protection
    description: Factory reset protection with the parent's Google account (#20). Only the numeric account ID is stored.
  - name: notifications
    description: Push notifications to parents (Web Push now; APNs/FCM tokens are stored for the native apps).
  - name: limits
    description: Daily time limits (docs/time-limits.md).
  - name: catalog
    description: App catalog per country (docs/app-catalog.md).
  - name: family-contact
    description: An extended family contact's own page (docs/extended-family.md). No account and no parent rights.
  - name: e2ee-prototype
    description: E2EE phase 0 prototype, the MLS delivery service (docs/e2ee-prototype.md). Test data only. Every route answers 404 unless E2EE_PROTOTYPE_ENABLED is true, which production refuses.
  - name: billing
    description: Hosted plan and paid early unlock (docs/billing.md). Every route answers 404 while BILLING_ENABLED is off.

components:
  securitySchemes:
    device:
      type: http
      scheme: bearer
      description: Device token `pp_d_…`, received once from the pairing poll.
    session:
      type: http
      scheme: bearer
      description: Session token `pp_s_…` from `/auth/verify` (native apps).
    familyContact:
      type: http
      scheme: bearer
      description: An extended contact's session `pp_fc_…` from `POST /family-contact/accept`. Only the /family-contact routes take it.
    cookie:
      type: apiKey
      in: cookie
      name: pp_session

  responses:
    ApprovalConflict:
      description: The request was answered already, withdrawn, or the preview or code no longer matches. Repeating your own earlier answer is not a conflict and gives 204.
      content:
        application/json:
          schema:
            type: object
            required: [error, outcome]
            properties:
              error: { type: string }
              outcome:
                type: string
                enum: [approvedByYou, approvedByOther, declinedByYou, declinedByOther, cancelled, failed, changed, codeExpired]
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyOrCapped:
      description: Too many login links, or (with `code` signup_cap_reached) today's cap on new households is reached (SIGNUP_DAILY_CAP). No mail is sent; `retryAt` is the next UTC midnight, also given as Retry-After.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              code: { enum: [signup_cap_reached] }
              retryAt: { type: string, format: date-time }
    Change:
      description: Applied at once
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ChangeApplied" }
    ChangePending:
      description: Self profile, loosening change waiting for the key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ChangePending" }

    PlanLimit:
      description: Only with billing on, on the free plan, when adding beyond the plan's limit (docs/billing.md).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlanLimit" }

  parameters:
    phoneId: { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
    changeId: { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
    householdId: { name: hid, in: path, required: true, schema: { type: string, format: uuid } }
    contactId: { name: cid, in: path, required: true, schema: { type: string, format: uuid }, description: An extended contact }

  schemas:
    SummarySettings:
      type: object
      required: [enabled, byMail, byPush, actNowOnly, day, hour, minute, timeZone, mailEnabled]
      properties:
        enabled: { type: boolean, description: "Send a weekly summary (default on)." }
        byMail: { type: boolean }
        byPush: { type: boolean }
        actNowOnly: { type: boolean, description: "Only alert me when I must act (default on): news that can wait goes into the summary." }
        day: { type: integer, minimum: 0, maximum: 6, description: "0 = Sunday (default)." }
        hour: { type: integer, minimum: 0, maximum: 23, description: "Default 18." }
        minute: { type: integer, minimum: 0, maximum: 59 }
        timeZone: { type: string, description: "IANA time zone the day and time are in (default Europe/Copenhagen)." }
        mailEnabled: { type: boolean, description: "Whether this server can send mail." }
    PhoneWeek:
      type: object
      required: [phoneId, name, usage, requests, changes, events]
      properties:
        phoneId: { type: string, format: uuid }
        name: { type: string }
        usage:
          type: [object, "null"]
          description: Null when the phone reported no use. Use is reported when the phone has a time limit.
          properties:
            days:
              type: array
              items:
                type: object
                required: [day, minutes]
                properties:
                  day: { type: string, format: date }
                  minutes: { type: integer }
            averageMinutes: { type: integer, description: "Over the days with a report." }
            topApps:
              type: array
              items:
                type: object
                required: [packageName, label, minutes]
                properties:
                  packageName: { type: string }
                  label: { type: string }
                  minutes: { type: integer }
        requests:
          type: object
          required: [asked, approved, rejected, byKind]
          properties:
            asked: { type: integer }
            approved: { type: integer }
            rejected: { type: integer }
            byKind: { type: object, additionalProperties: { type: integer } }
        changes:
          type: object
          required: [total, byCategory]
          properties:
            total: { type: integer }
            byCategory: { type: object, additionalProperties: { type: integer }, description: "time, apps, contacts, web, schedules or other" }
        events:
          type: object
          required: [protection, offline, checkin]
          properties:
            protection: { type: integer }
            offline: { type: integer }
            checkin: { type: integer }
    WeeklySummary:
      type: object
      required: [id, weekEnd, periodStart, periodEnd, data]
      properties:
        id: { type: string, format: uuid }
        weekEnd: { type: string, format: date, description: "Local date the summary was due." }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        data:
          type: object
          required: [version, phones]
          properties:
            version: { type: integer }
            phones:
              type: array
              items: { $ref: "#/components/schemas/PhoneWeek" }
    SosPosition:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    SosEvent:
      type: object
      required: [id, kind, createdAt, seenAt, seenByName, deliveredVia, deliveryFailedAt, battery, location]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [urgent, help] }
        trigger: { enum: [power, clock, code, null], description: "How a hidden SOS was sent; null is the SOS screen. See docs/sos.md." }
        message: { type: [string, "null"], description: The quick message's text when it was a code word. }
        createdAt: { type: string, format: date-time }
        seenAt: { type: [string, "null"], format: date-time }
        seenByName: { type: [string, "null"] }
        deliveredVia: { enum: [push, sms, null] }
        deliveryFailedAt: { type: [string, "null"], format: date-time, description: "Set when the alert still had not reached every parent at the final timeout." }
        battery: { type: [integer, "null"] }
        location:
          anyOf:
            - { $ref: "#/components/schemas/SosPosition" }
            - { type: "null" }
    CallbackDeviceState:
      type: object
      description: How far a callback request got, as the child's phone sees it.
      required: [id, state, expiresAt]
      properties:
        id: { type: string, format: uuid, description: The request this tap belongs to; the first open one when a request was already open }
        state: { enum: [queued, sent, expired, done], description: "queued: no parent device has been notified yet, it waits in the dashboard; sent: a parent device got it; expired: nobody answered within 24 hours; done: a parent called or handled it" }
        expiresAt: { type: string, format: date-time }
    CallbackRequest:
      type: object
      required: [id, state, createdAt, expiresAt, doneAt, doneVia, number]
      properties:
        id: { type: string, format: uuid }
        state: { enum: [queued, sent, expired, done] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        doneAt: { type: [string, "null"], format: date-time }
        doneVia: { enum: [number, other, null] }
        number: { enum: [ok, missing, changed], description: "The saved number now: ok to dial, missing (cleared), or changed since the request was made" }
    SosSettings:
      type: object
      description: Per-phone switches for hidden SOS and quick messages (docs/sos.md).
      required: [hiddenPower, hiddenPresses, hiddenClock, hiddenFeedback, quickMessagesEnabled, quickSuggestionsEnabled, familyInbox, checkIns, callbackRequests, callbackConfirmed, extendedFamily, locationSnapshots]
      properties:
        callbackRequests: { type: boolean, default: false, description: "The child may ask a parent to call back from the SOS screen. True only with a confirmed number (docs/sos.md#asking-a-parent-to-call)" }
        callbackConfirmed: { type: boolean, description: A parent has entered and confirmed the number in `callbackNumber` }
        hiddenPower: { type: boolean, default: false, description: Pressing the power button quickly sends a silent urgent SOS }
        hiddenPresses: { type: integer, enum: [3, 4, 5, 6], default: 4, description: How many presses within about three seconds }
        hiddenClock: { type: boolean, default: false, description: A long press on the home screen clock sends a silent urgent SOS }
        hiddenFeedback: { enum: [vibrate, none], default: vibrate, description: The quiet confirmation on the child's phone }
        quickMessagesEnabled: { type: boolean, default: false, description: Off for new phones since the family inbox; earlier phones keep their choice }
        quickSuggestionsEnabled: { type: boolean, default: true, description: The child may suggest new quick messages }
        familyInbox: { type: boolean, default: false, description: One short thread between the child and the parents (docs/family-inbox.md) }
        checkIns: { type: boolean, default: false, description: "\"I'm home\" in the family inbox, without a position" }
        extendedFamily: { type: boolean, default: false, description: "Named, mutually approved family contacts (docs/extended-family.md). Needs the inbox" }
        locationSnapshots: { type: boolean, default: false, description: "The child may share a one-time location snapshot in a conversation. Needs the inbox" }
    LocationSnapshot:
      type: object
      description: A position the child chose to share once (docs/extended-family.md). Only while it has not expired.
      required: [lat, lon, accuracyM, recordedAt, expiresAt]
      properties:
        lat: { type: number }
        lon: { type: number }
        accuracyM: { type: [number, "null"] }
        recordedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ExtendedContact:
      type: object
      description: A named person on a Child phone's extended family roster (docs/extended-family.md).
      required: [id, name, group, status, childApproved, contactAccepted, linkExpiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 40, description: The name the child knows the person by }
        group: { enum: [family, friends, others], description: The contact group the person counts as in modes }
        status: { enum: [waitingForChild, waitingForContact, active, blocked, declinedByChild, declinedByContact, expired] }
        childApproved: { type: boolean }
        contactAccepted: { type: boolean }
        linkExpiresAt: { type: [string, "null"], format: date-time, description: While the invitation is open }
        createdAt: { type: string, format: date-time }
    ExtendedRoster:
      type: object
      required: [enabled, locationSnapshots, contacts]
      properties:
        enabled: { type: boolean }
        locationSnapshots: { type: boolean }
        contacts: { type: array, items: { $ref: "#/components/schemas/ExtendedContact" } }
    ExtendedInvite:
      type: object
      required: [contact, link, expiresAt]
      properties:
        contact: { $ref: "#/components/schemas/ExtendedContact" }
        link: { type: string, description: The single-use link. Shown once; only its hash is kept }
        expiresAt: { type: string, format: date-time }
    ExtendedMessage:
      type: object
      description: One line of a conversation between a child and an extended contact.
      required: [id, from, kind, text, sentAt, receivedAt]
      properties:
        id: { type: string, format: uuid }
        from: { enum: [child, contact] }
        kind: { enum: [quick, reply, snapshot] }
        text: { type: string, maxLength: 60 }
        sentAt: { type: string, format: date-time }
        receivedAt: { type: [string, "null"], format: date-time, description: When the other side's device got it }
        location:
          oneOf: [{ $ref: "#/components/schemas/LocationSnapshot" }, { type: "null" }]
          description: Snapshots only, while live
    FamilyMessage:
      type: object
      description: One message of the family inbox (docs/family-inbox.md). Code words never appear here.
      required: [id, from, kind, text, sentAt]
      properties:
        id: { type: string, format: uuid }
        from: { enum: [child, parent] }
        kind: { enum: [quick, checkin, reply, snapshot] }
        text: { type: string, maxLength: 60 }
        sentAt: { type: string, format: date-time, description: "When it was sent; for the child, the phone's time, never later than the server's" }
        delivered: { type: [integer, "null"], description: "Child messages: parent devices that got a push; 0 means the phone sent an SMS" }
        author: { type: [string, "null"], description: "Parent replies: the name the parent signed with" }
        receivedAt: { type: [string, "null"], format: date-time, description: "Parent replies: when the child's phone got it (the device receipt)" }
        location:
          oneOf: [{ $ref: "#/components/schemas/LocationSnapshot" }, { type: "null" }]
          description: "Snapshots only: the position while it is live; null after it expired or was replaced"
    FamilyInviteToken:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "`pp_fi_…` from the link's fragment" }
    FamilyInbox:
      type: object
      required: [familyInbox, quickMessages, checkIns, recipients, messages]
      properties:
        familyInbox: { type: boolean }
        quickMessages: { type: boolean, description: Quick messages in the inbox (needs the inbox) }
        checkIns: { type: boolean, description: "\"I'm home\" in the inbox (needs the inbox)" }
        recipients: { type: array, items: { type: string }, description: "The SOS parents' names, as the child knows them" }
        messages: { type: array, items: { $ref: "#/components/schemas/FamilyMessage" } }
    AgePreset:
      type: object
      description: What an age preset starts with (docs/age-presets.md). Every value stays editable; a preset locks nothing.
      required: [id, dailyMinutes, bedtime, school, blockedCategories]
      properties:
        id: { type: string, enum: ["8-9", "10-11", "12-13", "14plus"] }
        dailyMinutes:
          type: object
          required: [weekday, weekend]
          properties:
            weekday: { type: integer }
            weekend: { type: integer, description: Saturday and Sunday }
        bedtime:
          type: object
          description: Every day; minutes after local midnight, the window crosses midnight
          required: [startMinute, endMinute]
          properties:
            startMinute: { type: integer }
            endMinute: { type: integer }
        school:
          type: [object, "null"]
          description: Monday to Friday; null for no school window
          properties:
            startMinute: { type: integer }
            endMinute: { type: integer }
        blockedCategories: { type: array, items: { type: string } }
    AgeSuggestion:
      type: object
      description: One idea for what to open next, from the current rules. `time` and `bedtime` carry minutes (bedtime as minutes after midnight); `category` carries the web filter category.
      required: [kind]
      properties:
        kind: { type: string, enum: [time, bedtime, school, category, talk] }
        from: { type: integer }
        to: { type: integer }
        category: { type: string }
    AgeState:
      type: object
      required: [agePreset, review]
      properties:
        agePreset: { type: [string, "null"], enum: ["8-9", "10-11", "12-13", "14plus", null] }
        review:
          type: object
          required: [enabled, intervalMonths, dueAt, due, suggestions]
          properties:
            enabled: { type: boolean }
            intervalMonths: { type: integer, enum: [1, 2, 3, 6, 12] }
            dueAt: { type: [string, "null"], format: date-time, description: The reminder moment (09:00 on the phone's wall clock) }
            due: { type: boolean }
            suggestions: { type: array, items: { $ref: "#/components/schemas/AgeSuggestion" }, description: Up to three ideas; empty while the reminder is off }
    Agreement:
      type: object
      description: The family agreement (docs/family-agreement.md). The family's own words, kept per phone and shown on the child's phone only.
      required: [lines, adultLines, enabled, onHome, updatedAt]
      properties:
        lines: { type: array, items: { type: string, maxLength: 140 }, maxItems: 8, description: In the child's words }
        adultLines: { type: array, items: { type: string, maxLength: 140 }, maxItems: 5, description: Rules for the adults, a suggestion that is not enforced }
        enabled: { type: boolean, description: Show it on the child's phone (default on) }
        onHome: { type: boolean, description: Also on the home screen (default off) }
        updatedAt: { type: [string, "null"], format: date-time }
    QuickMessage:
      type: object
      required: [id, text, meansSos, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, maxLength: 60 }
        meansSos: { type: boolean, description: A code word. The child's phone shows an ordinary message; the parents get an urgent SOS. }
        createdAt: { type: string, format: date-time }
    QuickMessageSuggestion:
      type: object
      required: [id, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, maxLength: 60 }
        createdAt: { type: string, format: date-time }
    ChildContactSettings:
      type: object
      required: [suggestDeviceContacts, lightContactRestriction]
      properties:
        suggestDeviceContacts: { type: boolean }
        lightContactRestriction: { type: boolean }
    SetupUndoWindow:
      type: object
      required: [undoRemainingMs]
      properties:
        undoRemainingMs: { type: integer, minimum: 0, maximum: 3600000 }
    SuggestedContactInput:
      type: object
      additionalProperties: false
      required: [name, numbers]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        numbers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/E164" }
    PhoneRequest:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { enum: [app, contact] }
        packageName: { type: [string, "null"] }
        name: { type: [string, "null"], description: "Contact name" }
        number: { type: [string, "null"], description: "Contact number, E.164" }
        status: { enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        decidedVia:
          enum: [parent, phone, null]
          description: Where the answer came from. `phone` means a parent approved it on the phone with the parent PIN.
    RequestOutcomeError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        outcome:
          enum: [approvedByYou, approvedByOther, approvedOnPhone, declinedByYou, declinedByOther]
    MoreTimeRequest:
      type: object
      description: A request for more time on one app or on the daily cap (docs/more-time.md).
      required: [id, packageName, day, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        packageName: { $ref: "#/components/schemas/LimitTarget" }
        reason: { type: [string, "null"], maxLength: 140, description: "What the child wrote; optional" }
        day: { type: string, format: date, description: "The phone's local date it was asked on; the bonus counts for this date only" }
        status:
          enum: [pending, approved, declined, expired]
          description: "`expired` means nobody answered before the phone's local midnight"
        answer: { enum: ["15", "60", "day", "no", null], description: "The parent's choice" }
        grantedMinutes: { type: [integer, "null"], description: "Minutes added. For `day` it is the time left until local midnight when it was answered." }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
        decidedVia: { enum: [parent, phone, null], description: "`phone` when a parent approved it on the phone with the parent PIN" }
    PushSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { enum: [web, apns, fcm, expo] }
        label: { type: [string, "null"] }
        endpointHash:
          type: string
          description: SHA-256 (hex) of the endpoint or token, so a browser can find its own row. The endpoint itself is never returned.
        createdAt: { type: string, format: date-time }
        lastSuccessAt: { type: [string, "null"], format: date-time }
    Enrollment:
      type: object
      properties:
        phone: { $ref: "#/components/schemas/PhoneSummary" }
        enrollment:
          type: object
          properties:
            id: { type: string, format: uuid, description: Public identifier used by the dashboard to check whether the QR is still current. }
            token: { type: string, examples: ["pp_e_3q2-7wEvR1q8aZ0sLx9Ywg"] }
            expiresAt: { type: string, format: date-time }
        provisioning:
          type: object
          description: Values for the provisioning QR code
          properties:
            adminComponent: { type: string, examples: [org.plainphone.app/.PlainphoneAdminReceiver] }
            downloadUrl:
              type: string
              format: uri
              description: Stable APK address (`/download/android`, outside `/api`); redirects to the newest release.
            signatureChecksum: { type: string, description: base64url SHA-256 of the app's signing certificate }
            serverUrl: { type: string, format: uri }
            dnsHost: { type: string, description: Private DNS until the phone's own filter host is ready }
            mode: { enum: [strong, light] }
            profile: { enum: [child, self] }
            language: { $ref: "#/components/schemas/PhoneLanguage" }
            timezone: { type: string }
            locale: { type: [string, "null"], description: Android setup locale for a strong Child phone, if chosen. }
            countryCode: { type: [string, "null"], description: Calling code inferred from the strong setup time zone. }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        issues:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }

    PackageName:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$"
      examples: [com.spotify.music]

    E164:
      type: string
      pattern: "^\\+[1-9]\\d{6,14}$"
      examples: ["+4512345678"]

    FilterMethod:
      type: string
      enum: [vpn, privateDns]
    DnsCategory:
      type: string
      enum: [social, adult, gambling, games, dating, video]
    OpenCategory:
      type: string
      description: A category open mode can block. "adult" is web filter only; the others also block known apps.
      enum: [social, gambling, adult]

    Op:
      description: A rule change, as stored for pending changes and shown on the phone.
      oneOf:
        - type: object
          properties:
            type: { const: app.set }
            packageName: { $ref: "#/components/schemas/PackageName" }
            allowed: { type: boolean }
        - type: object
          properties:
            type: { const: contact.add }
            name: { type: string }
            number: { $ref: "#/components/schemas/E164" }
        - type: object
          properties:
            type: { const: contact.remove }
            contactId: { type: string, format: uuid }
        - type: object
          properties:
            type: { const: contact.schedule }
            restricted: { type: boolean }
        - type: object
          required: [type, method]
          properties:
            type: { const: dns.method }
            method: { $ref: "#/components/schemas/FilterMethod" }
        - type: object
          properties:
            type: { const: dns.category }
            category: { $ref: "#/components/schemas/DnsCategory" }
            blocked: { type: boolean }
        - type: object
          description: Loosening when turned on while it was off (it lets every app in).
          required: [type, enabled]
          properties:
            type: { const: openMode.set }
            enabled: { type: boolean }
        - type: object
          description: Blocks or allows a category's known apps and the DNS category together. Loosening when allowing.
          required: [type, category, blocked]
          properties:
            type: { const: openMode.category }
            category: { $ref: "#/components/schemas/OpenCategory" }
            blocked: { type: boolean }
        - type: object
          properties:
            type: { enum: [dns.allowDomain, dns.blockDomain] }
            domain: { type: string }
            present: { type: boolean }
        - type: object
          properties:
            type: { enum: [schedule.create, schedule.update, schedule.delete] }
            scheduleId: { type: string, format: uuid }
            schedule: { $ref: "#/components/schemas/ScheduleInput" }
        - type: object
          properties:
            type: { const: setting.set }
            key: { $ref: "#/components/schemas/PhoneSettingKey" }
            setting: { $ref: "#/components/schemas/PhoneSetting" }
        - type: object
          properties:
            type: { const: home.set }
            home:
              oneOf:
                - $ref: "#/components/schemas/HomeLayoutSettings"
                - $ref: "#/components/schemas/HomeFreePromise"
        - type: object
          properties:
            type: { const: key.set }
            key: { $ref: "#/components/schemas/Key" }
        - type: object
          description: Emergency openings on a Self phone. Switching them on or raising the allowance loosens.
          required: [type, enabled, allowance]
          properties:
            type: { const: emergency.set }
            enabled: { type: boolean }
            allowance: { type: integer, minimum: 1, maximum: 10 }
        - type: object
          properties:
            type: { const: phone.remove }
            dnsClientId: { type: string }
        - type: object
          description: Loosening on a phone that has paired. Switches Plainphone off on the phone.
          properties:
            type: { const: phone.release }
        - type: object
          required: [type, allowed]
          properties:
            type: { const: move.allow }
            allowed: { type: boolean }
        - type: object
          required: [type, exportId, serverUrl]
          properties:
            type: { const: move.start }
            exportId: { type: string, format: uuid }
            serverUrl: { type: string, format: uri }
        - type: object
          description: Loosening when any weekday gets more minutes, or the limit is removed (limit null).
          properties:
            type: { const: timeLimit.set }
            packageName: { $ref: "#/components/schemas/LimitTarget" }
            limit:
              oneOf:
                - $ref: "#/components/schemas/Limit"
                - type: "null"
        - type: object
          description: Always loosening.
          properties:
            type: { const: timeLimit.bonus }
            packageName: { $ref: "#/components/schemas/LimitTarget" }
            date: { type: string, format: date, description: "The local date it was asked for. The bonus counts for the local date when it takes effect." }
            minutes: { type: integer, minimum: 5, maximum: 240 }
        - type: object
          description: Always loosening.
          properties:
            type: { const: catalog.add }
            packageName: { $ref: "#/components/schemas/PackageName" }
            label: { type: string }
        - type: object
          description: Always tightening.
          properties:
            type: { const: catalog.remove }
            packageName: { $ref: "#/components/schemas/PackageName" }

    LimitTarget:
      description: '"*" is the daily cap for all non-core apps together; otherwise one app.'
      oneOf:
        - { const: "*" }
        - $ref: "#/components/schemas/PackageName"

    Limit:
      type: object
      required: [minutes]
      properties:
        minutes: { type: integer, minimum: 0, maximum: 1440 }
        days:
          type: object
          description: 'ISO weekday ("1" = Monday … "7" = Sunday) to minutes; overrides `minutes` on that day.'
          propertyNames: { enum: ["1", "2", "3", "4", "5", "6", "7"] }
          additionalProperties: { type: integer, minimum: 0, maximum: 1440 }
          default: {}

    Bonus:
      type: object
      properties:
        packageName: { $ref: "#/components/schemas/LimitTarget" }
        date: { type: string, format: date, description: Local date in the phone's time zone. }
        minutes: { type: integer }

    TimeUsed:
      type: object
      description: 'Minutes used today per limited package; "*" is the total. At most 200 entries.'
      maxProperties: 200
      propertyNames: { $ref: "#/components/schemas/LimitTarget" }
      additionalProperties: { type: integer, minimum: 0, maximum: 1440 }

    Protections:
      type: object
      description: What is active on the phone right now. Unknown keys are refused (400).
      additionalProperties: false
      properties:
        deviceOwner: { type: boolean }
        deviceAdmin: { type: boolean }
        accessibility: { type: boolean }
        usageAccess: { type: boolean, description: Whether usage access is granted or time limits do not need it. }
        usageAccessGranted: { type: boolean, description: Whether Android actually grants access to usage data. }
        vpn: { type: boolean }
        alwaysOnVpn: { type: boolean }
        phoneRole: { type: boolean }
        smsRole: { type: boolean }
        notifications: { type: boolean }
        batteryUnrestricted: { type: boolean }
        privateDnsOk: { type: boolean }

    CatalogFile:
      type: object
      description: One country's catalog, as in server/catalog/<country>.json.
      properties:
        country: { type: string, examples: [dk] }
        name: { $ref: "#/components/schemas/Localized" }
        verifiedAt: { type: string, format: date }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string, examples: [bank] }
              name: { $ref: "#/components/schemas/Localized" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/CatalogApp" }

    CatalogApp:
      type: object
      properties:
        packageName: { $ref: "#/components/schemas/PackageName" }
        name: { type: string }
        category: { type: string }
        starter: { type: boolean, description: Allowed from the start when the phone reports it. }
        source: { type: string, format: uri, description: The Play page the package name was verified against. }
        verifiedAt: { type: string, format: date }
        playTitle: { type: string }

    Localized:
      type: object
      properties:
        en: { type: string }
        da: { type: string }

    PhoneSettingKey:
      type: string
      description: A phone setting the parent can set or lock. See docs/phone-settings.md for what each one does on Android.
      enum:
        - airplaneMode
        - bluetooth
        - brightness
        - camera
        - language
        - location
        - mobileNetworks
        - nfc
        - roaming
        - screenCapture
        - screenTimeout
        - tethering
        - volume
        - wallpaper
        - wifi

    PhoneSetting:
      type: object
      required: [mode]
      description: |
        What one setting is set to. `free`: the child (or the Self user) decides and Plainphone does
        not touch it. `preset`: Plainphone sets the value once, each time the parent changes it.
        `locked`: Plainphone sets it and blocks it in Android's Settings. `value` is only present
        for `preset` and `locked`, and only for settings that have one.
      properties:
        mode: { enum: [free, preset, locked] }
        value:
          oneOf: [{ type: string }, { type: integer }]
          description: |
            Per setting. `bluetooth` (locked): `off` or `noNewDevices`. `location` (preset, locked): `on` or `off`.
            `screenTimeout` (preset, locked): 15, 30, 60, 120, 300 or 600 seconds.
            `brightness` (preset, locked): `auto` or a percentage 10 to 100.
            `volume`: preset is a percentage 0 to 100, locked is `muted`.
            `roaming`, `camera`, `screenCapture`, `tethering`, `nfc`, `airplaneMode` (locked): `off`.
            `wallpaper` (locked): `plainphone`. `wifi`, `mobileNetworks` and `language` (locked) take no value.
      examples:
        - { mode: locked, value: "off" }
        - { mode: preset, value: 60 }
        - { mode: locked }

    Home:
      allOf:
        - $ref: "#/components/schemas/HomeLayoutSettings"
        - $ref: "#/components/schemas/HomeFreePromise"

    HomeFreePromise:
      type: object
      required: [showFreePromise]
      properties:
        showFreePromise:
          type: boolean
          default: true
          description: Show the free promise on the phone.

    HomeLayoutSettings:
      type: object
      required: [layout, theme, palette, apps]
      description: How Plainphone's home screen looks. Phone and the emergency call are always on it and cannot be removed; apps that the rules hide are never shown, even when listed.
      properties:
        layout: { enum: [list, grid], default: list }
        theme: { enum: [system, light, dark], default: system }
        palette: { enum: [grey, sage, sand], default: grey }
        apps:
          type: array
          description: Package names on the front page, in order. At most 8, no duplicates.
          maxItems: 8
          uniqueItems: true
          items: { $ref: "#/components/schemas/PackageName" }

    ChangeApplied:
      type: object
      required: [status]
      properties:
        status: { const: applied }

    ApprovalRevision:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Revision from the helper approval list for the preview being approved.
    ApprovalSummary:
      type: object
      required: [en, da]
      properties:
        en: { type: string }
        da: { type: string }

    PendingChange:
      type: object
      required: [id, op, keyType, effectiveAt]
      properties:
        id: { type: string, format: uuid }
        op: { $ref: "#/components/schemas/Op" }
        summary: { $ref: "#/components/schemas/ApprovalSummary" }
        keyType: { enum: [delay, trusted] }
        effectiveAt:
          type: [string, "null"]
          format: date-time
          description: When a delay-key change takes effect. Null while waiting for a trusted person.
        createdAt: { type: string, format: date-time }
        payUnlock:
          description: Offered only when payments are enabled, on a Self phone with the delay key and pay-to-unlock on.
          oneOf:
            - type: "null"
            - type: object
              properties:
                amount: { type: integer, description: "Minor units, e.g. 50000 = 500 kr." }
                currency: { type: string }
                recipient: { type: string }
        earlyUnlock:
          description: Paid early unlock (docs/billing.md). Present only while billing is on, on a Myself phone with its own delay key and the switch on.
          $ref: "#/components/schemas/EarlyUnlockOffer"

    EarlyUnlockOffer:
      type: object
      required: [available, reason, price, currency, unlockMinutes, nextAvailableAt, purchase]
      properties:
        available: { type: boolean }
        reason:
          type: [string, "null"]
          enum: [savesNoTime, weeklyCap, inProgress, null]
        price: { type: integer, description: Minor units including VAT, e.g. 1000 = 10 kr. }
        currency: { type: string }
        unlockMinutes: { type: integer, description: The change applies about this long after payment. }
        nextAvailableAt: { type: [string, "null"], format: date-time, description: With the weekly cap reached. }
        purchase:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/EarlyUnlockPurchase"

    EarlyUnlockPurchase:
      type: object
      required: [id, status, channel, amount, currency, consentAt, paidAt, unlockAt, deliveredAt, withdrawnAt, refundedAt, canWithdraw]
      properties:
        id: { type: string, format: uuid, description: The contract number on the receipt. }
        status: { enum: [created, scheduled, delivered, refund_due, refunded, expired] }
        channel: { enum: [stripe, play] }
        amount: { type: integer }
        currency: { type: string }
        consentAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        unlockAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        withdrawnAt: { type: [string, "null"], format: date-time }
        refundedAt: { type: [string, "null"], format: date-time }
        canWithdraw: { type: boolean, description: Show the withdrawal control (Fortryd aftale) while true. }

    Plan:
      type: object
      required: [billing, plan, source, until, limits, usage, prioritySupport, prices, channels, canManage]
      properties:
        billing: { type: boolean, description: False while BILLING_ENABLED is off; then plan is "unlimited". }
        plan: { enum: [unlimited, grandfathered, free, plus] }
        source: { type: [string, "null"], enum: [play, stripe, manual, null] }
        until: { type: [string, "null"], format: date-time }
        limits:
          type: object
          required: [phones, trusted]
          properties:
            phones: { type: [integer, "null"], description: Null means no limit. }
            trusted: { type: [integer, "null"] }
        usage:
          type: object
          required: [phones, trusted]
          properties:
            phones: { type: integer }
            trusted: { type: integer }
        prioritySupport: { type: boolean }
        prices:
          type: object
          required: [currency, plus, earlyUnlock]
          properties:
            currency: { type: string }
            plus: { type: integer, description: Per household per month, minor units. }
            earlyUnlock: { type: integer }
        channels:
          type: object
          required: [stripe, play]
          properties:
            stripe: { type: boolean, description: Card checkout from the web dashboard. }
            play: { type: boolean, description: Google Play Billing in Play builds. }
        canManage: { type: boolean, description: A card subscription exists that the Stripe portal can manage. }

    PlanLimit:
      type: object
      required: [error, limit, max]
      properties:
        error: { const: plan_limit }
        limit: { enum: [phones, trusted] }
        max: { type: integer }

    ChangePending:
      type: object
      required: [status, change]
      properties:
        status: { const: pending }
        change: { $ref: "#/components/schemas/PendingChange" }

    PhoneLanguage:
      enum: [da, en, sv, nb, de, null]
      description: Plainphone UI language. Null follows the system.
    MoveSource:
      type: object
      required: [version, serverUrl, publicKey]
      properties:
        version: { const: 1 }
        serverUrl: { type: string, format: uri }
        publicKey: { type: string }
    MoveTicket:
      allOf:
        - $ref: "#/components/schemas/MoveSource"
        - type: object
          required: [id, expiresAt]
          properties:
            id: { type: string, format: uuid }
            expiresAt: { type: string, format: date-time }

    Rules:
      type: object
      description: Everything the phone enforces. Compare the ETag, not the content.
      required: [phoneId, profile, mode, timezone, language, apps, timeLimits, contacts, schedules, dns, location, settings, home, pendingChanges, release, pollSeconds]
      properties:
        phoneId: { type: string, format: uuid }
        selfEmergency:
          $ref: "#/components/schemas/EmergencyState"
        sos:
          type: object
          required: [name, parents]
          properties:
            name: { type: string }
            parents:
              type: array
              items:
                type: object
                required: [name, number]
                properties:
                  name: { type: string }
                  number: { $ref: "#/components/schemas/E164" }
            callback:
              type: object
              description: The child may ask a parent to call back. Only the switch; the number is never sent to the phone.
              required: [enabled]
              properties:
                enabled: { type: boolean }
            hidden:
              type: object
              required: [power, presses, clock, feedback]
              properties:
                power: { type: boolean }
                presses: { type: integer, enum: [3, 4, 5, 6] }
                clock: { type: boolean }
                feedback: { enum: [vibrate, none] }
            quickMessages:
              type: object
              required: [enabled, suggest, items]
              properties:
                enabled: { type: boolean }
                suggest: { type: boolean, description: The child may suggest new quick messages }
                items:
                  type: array
                  maxItems: 6
                  items:
                    type: object
                    required: [id, text, meansSos]
                    properties:
                      id: { type: string, format: uuid }
                      text: { type: string }
                      meansSos: { type: boolean }
        inbox:
          type: object
          description: The family inbox of a Child phone (docs/family-inbox.md). Left out while it is off.
          required: [enabled, quickMessages, checkIns, latest]
          properties:
            enabled: { type: boolean, enum: [true] }
            quickMessages: { type: boolean, description: The quick messages in sos.quickMessages can be sent from the inbox }
            checkIns: { type: boolean, description: "The child can send \"I'm home\"" }
            latest: { type: [string, "null"], format: uuid, description: The newest parent reply; when it changes, the phone fetches GET /device/inbox }
        extended:
          type: object
          description: "Extended family contacts (docs/extended-family.md). While paused, `enabled` is false and the roster is still sent, so the child can see it and block; left out while off with nobody on it."
          required: [enabled, quickMessages, contacts]
          properties:
            enabled: { type: boolean, description: "False while paused: no messages either way" }
            quickMessages: { type: boolean, description: The child can send the quick messages to an active contact }
            contacts:
              type: array
              items:
                type: object
                required: [id, name, status, group, rev]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  status: { enum: [waitingForChild, waitingForContact, active, blocked] }
                  group: { enum: [family, friends, others] }
                  rev: { type: integer, description: "When it changes, the phone fetches GET /device/extended/{cid}" }
        locationSnapshot:
          type: object
          description: The child may share a one-time location snapshot. Left out while off.
          required: [enabled, minutes]
          properties:
            enabled: { type: boolean, enum: [true] }
            minutes: { type: integer, description: How long the recipients can see it }
        ageAgreement:
          type: object
          description: The family agreement of a Child phone (docs/family-agreement.md), in the family's own words. Left out while it is off or empty; old phones ignore it.
          required: [lines, adultLines, onHome, updatedAt]
          properties:
            lines: { type: array, items: { type: string, maxLength: 140 }, maxItems: 8, description: What the family agreed, in the child's words }
            adultLines: { type: array, items: { type: string, maxLength: 140 }, maxItems: 5, description: Rules the adults set for themselves (a suggestion, not enforced) }
            onHome: { type: boolean, description: Also show the agreement on the home screen }
            updatedAt: { type: [string, "null"], format: date-time }
        allowServerMove: { type: boolean }
        fallbackDnsHost:
          type: [string, "null"]
          description: This server's provisioning DNS host, which answers for every ClientID. After a move the phone uses it, not its per-phone host, when it is removed or its host is not ready.
        move:
          type: object
          required: [serverUrl, token]
          properties:
            serverUrl: { type: string, format: uri }
            token: { type: string }
        profile: { enum: [child, self] }
        mode: { enum: [strong, light] }
        language: { $ref: "#/components/schemas/PhoneLanguage" }
        lockSystemLanguage:
          type: boolean
          description: Whether Android system language changes are blocked on a strong Child phone.
        timezone:
          type: string
          description: IANA time zone that schedule times are in.
          examples: [Europe/Copenhagen]
        apps:
          type: object
          properties:
            allowed:
              type: array
              items: { $ref: "#/components/schemas/PackageName" }
            hidden:
              type: array
              description: Installed apps to hide. Apps never reported are not listed; the phone hides unknown apps by default, unless `open` is true.
              items: { $ref: "#/components/schemas/PackageName" }
            open:
              type: boolean
              description: Open mode. Allow every app that is not in `blocked`, also apps the rules have never listed. Missing from older servers (false).
            blocked:
              type: array
              description: The block list in open mode, also apps that are not installed yet (the known apps of blocked categories). Empty when `open` is false.
              items: { $ref: "#/components/schemas/PackageName" }
            toInstall:
              type: array
              description: Apps the parent added from the catalog that the phone has not reported as installed. Treat them as allowed, so they are not hidden once installed, and offer to install them (strong mode via Play for that one app, light mode with a link to Play).
              items:
                type: object
                properties:
                  packageName: { $ref: "#/components/schemas/PackageName" }
                  label: { type: string }
        timeLimits:
          type: object
          description: Always present. The limit for a local date is `days[isoWeekday] ?? minutes` plus the bonuses for that date and package. Days start at local midnight in `timezone`. Core apps never have a limit.
          properties:
            total:
              description: Daily cap for all non-core apps together; null means no cap.
              oneOf:
                - $ref: "#/components/schemas/Limit"
                - type: "null"
            apps:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/Limit"
                  - type: object
                    properties:
                      packageName: { $ref: "#/components/schemas/PackageName" }
            bonuses:
              type: array
              description: Only today's and tomorrow's (phone time zone, server clock).
              items: { $ref: "#/components/schemas/Bonus" }
        suggestDeviceContacts:
          type: boolean
          description: Parent opt-in to send names and numbers from a Child phone.
        rulesRevision:
          type: integer
          description: Advances on rule edits so restoring an earlier configuration still requires a new confirmation.
        dnsRevision:
          type: string
          description: Opaque revision of domain lists and whether the latest rule edit is waiting for the resolver.
        changeReceiptsEnabled:
          type: boolean
          default: true
          description: Send confirmations when a rules document is applied.
        healthBoardEnabled:
          type: boolean
          default: true
          description: Include live web filter checks and the observed usage access permission in phone status.
        weeklySummaryEnabled:
          type: boolean
          default: true
          description: The server keeps this phone's daily use for the parents' weekly summary. The phone only uses it to tell the child on "What can my parents see?". Missing means on.
        silentBedtime:
          type: boolean
          default: true
          description: During bedtime the phone is silent except calls from parents, 112 and help lines. Missing means on.
        pinApprovalEnabled:
          type: boolean
          default: true
          description: A parent may approve a request on the phone with the parent PIN. Always false on a Self phone. Missing means on.
        lightContactRestriction:
          type: boolean
          description: Enforce the approved list on a light Child phone. Missing means off in light mode.
        selfScheduleContacts:
          type: [boolean, "null"]
          description: True limits calls and texts to favourites during schedules, false leaves them unrestricted, and null preserves the previous always-on restriction on a Strong Self phone.
        contacts:
          type: array
          description: Approved numbers on Child phones or favourites on Self phones. Emergency numbers always work.
          items:
            type: object
            properties:
              name: { type: string }
              number: { $ref: "#/components/schemas/E164" }
              group:
                $ref: "#/components/schemas/ContactGroup"
                description: Only while modes are on. A parent is always family.
        schedules:
          type: array
          description: During a window only phone, SMS (approved contacts) and those allowedPackages that are also in apps.allowed work; a hidden app stays hidden. `end` before `start` means the window crosses midnight into the next day.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              kind: { enum: [school, bedtime] }
              days:
                type: array
                description: ISO weekdays, 1 = Monday … 7 = Sunday, of the window's start.
                items: { type: integer, minimum: 1, maximum: 7 }
              start: { type: string, pattern: "^\\d{2}:\\d{2}$", examples: ["08:00"] }
              end: { type: string, pattern: "^\\d{2}:\\d{2}$", examples: ["14:30"] }
              allowedPackages:
                type: array
                items: { $ref: "#/components/schemas/PackageName" }
        modes:
          type: object
          description: >-
            Only while modes are on (docs/modes.md). `schedules` is then built from the slots, so a phone that does not
            know modes still follows each slot's apps and quiet. A phone that knows modes takes the mode's name and
            contact groups from here; outside every slot the default mode applies. Parents, 112 and help lines are
            never narrowed by a mode.
          required: [enabled, defaultModeId, list, slots]
          properties:
            enabled: { type: boolean }
            defaultModeId: { type: [string, "null"], format: uuid }
            list:
              type: array
              items:
                type: object
                required: [id, preset, name, allApps, allowedPackages, contactGroups, quiet]
                properties:
                  id: { type: string, format: uuid }
                  preset: { $ref: "#/components/schemas/ModePreset" }
                  name: { type: [string, "null"], description: "Null: show the preset's translated name." }
                  allApps: { type: boolean }
                  allowedPackages:
                    type: array
                    items: { $ref: "#/components/schemas/PackageName" }
                  contactGroups:
                    type: array
                    items: { $ref: "#/components/schemas/ContactGroup" }
                  quiet: { type: boolean, description: "The mode is a bedtime: silent while silentBedtime is on." }
            slots:
              type: array
              items:
                type: object
                required: [id, modeId, days, start, end]
                properties:
                  id: { type: string, format: uuid }
                  modeId: { type: string, format: uuid }
                  days:
                    type: array
                    items: { type: integer, minimum: 1, maximum: 7 }
                  start: { type: string, pattern: "^\\d{2}:\\d{2}$" }
                  end: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        dns:
          type: object
          properties:
            host:
              type: string
              description: Private DNS (DNS-over-TLS) host to force with setGlobalPrivateDnsModeSpecifiedHost, but only when `ready` is true.
              examples: [k3m2x7q9p4r8t6w2y5z3.dns.plainphone.org]
            ready:
              type: boolean
              description: The phone has a DNS confirmation. Legacy confirmations stay ready during provisioning retries. When switching from mock to HTTP DNS, mock confirmations require a successful HTTP sync. While false, the phone uses the private DNS host from its setup profile.
            privateDnsReady:
              type: boolean
              description: The current DNS-over-TLS provider has confirmed the phone’s ClientID. Required before offering Android Private DNS setup.
            filterMethod: { $ref: "#/components/schemas/FilterMethod" }
            blockedCategories:
              type: array
              description: Informational; filtering happens in the DNS service.
              items: { $ref: "#/components/schemas/DnsCategory" }
        update:
          type: object
          properties:
            requestedAt: { type: [string, "null"], format: date-time }
        appUpdates:
          type: object
          description: Strong mode only (docs/policies.md, "App updates"). Missing means a nightly window and no request.
          properties:
            automatic:
              type: boolean
              description: Open a window once a night (02:00 to 05:00 local, charging, unmetered network) in which Play may update approved apps.
            requestedAt:
              type: [string, "null"]
              format: date-time
              description: Set when a parent pressed "Update apps now"; the phone opens the window once for each new value.
            reportedWindow:
              type: [string, "null"]
              description: The last window whose new apps the server turned into requests.
            recordedApps:
              type: array
              items: { type: string }
              description: The new apps of `reportedWindow` the server has turned into requests. The phone stops holding exactly these back itself.
        location:
          type: object
          properties:
            enabled: { type: boolean, description: "`mode` is not off. Kept for phones from before `mode`." }
            mode: { $ref: "#/components/schemas/LocationMode" }
            alwaysUntil:
              type: [string, "null"]
              format: date-time
              description: When `mode` is `always`, the moment it falls back to `checkin` by itself. The phone shows it.
            intervalMinutes:
              type: integer
              examples: [5]
              description: Report interval when `mode` is `always`. Other modes send 1440, so phones that only know `enabled` report at most once a day (and get 409).
            requestedAt:
              type: [string, "null"]
              format: date-time
              description: A parent pressed Find. Report a fresh position now; the field clears when a position recorded after it arrives.
        ring:
          description: An open "Ring the phone". Play the alarm sound and vibrate until `endsAt` (at most 5 minutes), or until the child taps "I'm here" when `stopOnAnswer`. Null means stop now.
          oneOf:
            - type: "null"
            - type: object
              required: [id, endsAt, stopOnAnswer, answered]
              properties:
                id: { type: string, format: uuid }
                endsAt: { type: string, format: date-time }
                stopOnAnswer: { type: boolean }
                answered: { type: boolean }
        checkIn:
          description: An open "Are you okay?". Show it until the child answers or `deadline` passes. When `locationDue` is true and the phone clock has reached `deadline`, look up a position for this check-in and send it with PUT /device/location. Null means close it.
          oneOf:
            - type: "null"
            - type: object
              required: [id, deadline, callNumber, sendLocation]
              properties:
                id: { type: string, format: uuid }
                deadline: { type: string, format: date-time }
                createdAt: { type: string, format: date-time }
                locationDue: { type: boolean, description: "True from the reply deadline while the unanswered check-in is waiting for a position." }
                callNumber: { type: [string, "null"], description: "An approved contact for the \"Call me\" button." }
                sendLocation: { type: boolean }
        settings:
          type: object
          description: The phone settings that are not `free`, keys in alphabetical order. A missing key is `free`. Needs Device Owner, so a light-mode phone ignores it.
          propertyNames: { $ref: "#/components/schemas/PhoneSettingKey" }
          additionalProperties: { $ref: "#/components/schemas/PhoneSetting" }
          examples:
            - camera: { mode: locked, value: "off" }
              screenTimeout: { mode: preset, value: 60 }
              wifi: { mode: locked }
        home:
          description: The home screen. Defaults are filled in; an older server without this field means the defaults.
          $ref: "#/components/schemas/Home"
        pendingChanges:
          type: array
          description: Self profile; show them with a countdown on the phone.
          items: { $ref: "#/components/schemas/PendingChange" }
        resetProtection:
          type: object
          description: >
            Factory reset protection (#20). Numeric Google account IDs (from the Google People API) of the
            household's parents who turned it on. The phone sets them with
            `setFactoryResetProtectionPolicy` (Android 11+) or Play services' managed configuration
            (Android 10). Empty clears the policy. Old servers do not send the field.
          properties:
            accountIds:
              type: array
              items: { type: string, pattern: "^[0-9]{1,30}$" }
        supportEnabled: { type: boolean, default: true }
        releaseWarningsEnabled: { type: boolean, default: true }
        askMoreTimeEnabled:
          type: boolean
          default: true
          description: Whether the stop screen offers "Ask for more time" (docs/more-time.md). Old servers do not send the field; treat missing as true.
        limitWarningEnabled:
          type: boolean
          default: true
          description: Whether the phone shows a calm notice five minutes before an app or the daily cap runs out. Missing means true.
        release:
          type: boolean
          description: |
            True once the parents have released the phone. The phone then switches Plainphone off
            (the same as the maintenance screen's "Release Device Owner", or light mode's "Switch
            Plainphone off"), never locks again, and calls `POST /device/released`. An older
            server without this field means false.
        pushProvider: { enum: [none, fcm, unifiedpush], description: "Preferred wakeup transport, subject to device availability" }
        fcmValidationKey: { type: string, description: FCM registration cache key that changes with the configured Firebase project or validation version }
        unifiedPushAvailable: { type: boolean, description: "Whether the device can fall back to UnifiedPush" }
        pollSeconds:
          type: integer
          description: Poll interval for GET /device/rules. 10 while a ring or a check-in is open, else 60.
          examples: [60]

    LocationMode:
      enum: ["off", find, checkin, always]
      description: "When the phone sends its position: never; on Find; on Find and once for an unanswered \"Are you okay?\"; every 5 minutes for a chosen time (shown on the phone all the time)."

    AlwaysFor:
      enum: [hour, today, week]
      description: "How long `always` lasts: one hour, until the phone's local midnight, or 7 days. Then it falls back to `checkin`."

    Ring:
      type: object
      required: [id, active, stopOnAnswer, createdAt, endsAt, shownAt, answeredAt, stoppedAt]
      properties:
        id: { type: string, format: uuid }
        active: { type: boolean, description: The phone should be ringing now. }
        stopOnAnswer: { type: boolean }
        createdAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        shownAt: { type: [string, "null"], format: date-time }
        answeredAt: { type: [string, "null"], format: date-time }
        stoppedAt: { type: [string, "null"], format: date-time }

    Checkin:
      type: object
      required: [id, status, createdAt, deadline, callNumber, sendsLocation, shownAt, answeredAt, answer, stoppedAt, locatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [waiting, answered, cancelled, noReply] }
        createdAt: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        callNumber: { type: [string, "null"] }
        sendsLocation: { type: boolean }
        shownAt: { type: [string, "null"], format: date-time }
        answeredAt: { type: [string, "null"], format: date-time }
        answer: { enum: [ok, call, null] }
        stoppedAt: { type: [string, "null"], format: date-time }
        locatedAt: { type: [string, "null"], format: date-time, description: The one position sent because nobody answered. }

    LocationState:
      type: object
      required: [enabled, mode, alwaysUntil, requestedAt, location, ring, checkin]
      properties:
        enabled: { type: boolean }
        mode: { $ref: "#/components/schemas/LocationMode" }
        alwaysUntil: { type: [string, "null"], format: date-time, description: "End of `always`; null in other modes." }
        requestedAt: { type: [string, "null"], format: date-time }
        location:
          oneOf:
            - type: "null"
            - type: object
              required: [lat, lon, accuracyM, recordedAt]
              properties:
                lat: { type: number }
                lon: { type: number }
                accuracyM: { type: [number, "null"] }
                recordedAt: { type: string, format: date-time }
        ring: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Ring" }] }
        checkin: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Checkin" }] }

    Support:
      enum: ["yes", "partial", "no"]
      description: "yes: Plainphone does it. partial: it does part of it, or the platform's own setting does the rest. no: not possible on this platform and tier."

    Capabilities:
      type: object
      description: "What the phone can do, derived from `platform` and `tier` (docs/ios/architecture.md, Capability map). Clients show a short line for features that are not `yes` on an iPhone."
      required: [apps, appNames, installBlock, uninstallProtection, factoryResetBlock, resetProtection, accountLock, usbBlock, vpnBlock, webFilter, adultFilter, safeSearch, systemLanguage, openMode, schoolTime, bedtimeApps, bedtimeSilence, timeLimits, limitWarning, moreTime, contacts, callScreening, callLog, helpLines, sos, location, ring, checkin, pinApproval, receipts, health, updateAlarm, weeklySummary, calmHome, release, maintenance, selfKeys, phoneSettings, pickAppsOnParent, pickAppsOnPhone]
      additionalProperties: false
      properties:
        apps: { $ref: "#/components/schemas/Support" }
        appNames: { $ref: "#/components/schemas/Support" }
        installBlock: { $ref: "#/components/schemas/Support" }
        uninstallProtection: { $ref: "#/components/schemas/Support" }
        factoryResetBlock: { $ref: "#/components/schemas/Support" }
        resetProtection: { $ref: "#/components/schemas/Support" }
        accountLock: { $ref: "#/components/schemas/Support" }
        usbBlock: { $ref: "#/components/schemas/Support" }
        vpnBlock: { $ref: "#/components/schemas/Support" }
        webFilter: { $ref: "#/components/schemas/Support" }
        adultFilter: { $ref: "#/components/schemas/Support" }
        safeSearch: { $ref: "#/components/schemas/Support" }
        systemLanguage: { $ref: "#/components/schemas/Support" }
        openMode: { $ref: "#/components/schemas/Support" }
        schoolTime: { $ref: "#/components/schemas/Support" }
        bedtimeApps: { $ref: "#/components/schemas/Support" }
        bedtimeSilence: { $ref: "#/components/schemas/Support" }
        timeLimits: { $ref: "#/components/schemas/Support" }
        limitWarning: { $ref: "#/components/schemas/Support" }
        moreTime: { $ref: "#/components/schemas/Support" }
        contacts: { $ref: "#/components/schemas/Support" }
        callScreening: { $ref: "#/components/schemas/Support" }
        callLog: { $ref: "#/components/schemas/Support" }
        helpLines: { $ref: "#/components/schemas/Support" }
        sos: { $ref: "#/components/schemas/Support" }
        location: { $ref: "#/components/schemas/Support" }
        ring: { $ref: "#/components/schemas/Support" }
        checkin: { $ref: "#/components/schemas/Support" }
        pinApproval: { $ref: "#/components/schemas/Support" }
        receipts: { $ref: "#/components/schemas/Support" }
        health: { $ref: "#/components/schemas/Support" }
        updateAlarm: { $ref: "#/components/schemas/Support" }
        weeklySummary: { $ref: "#/components/schemas/Support" }
        calmHome: { $ref: "#/components/schemas/Support" }
        release: { $ref: "#/components/schemas/Support" }
        maintenance: { $ref: "#/components/schemas/Support" }
        selfKeys: { $ref: "#/components/schemas/Support" }
        phoneSettings: { $ref: "#/components/schemas/Support" }
        pickAppsOnParent:
          $ref: "#/components/schemas/Support"
          description: "iPhone apps can be picked on the parent's own iPhone (`PUT /phones/{pid}/ios-selection`). `no` on Android."
        pickAppsOnPhone:
          $ref: "#/components/schemas/Support"
          description: "iPhone apps can be picked on the phone after the parent PIN (`PUT /device/ios-selection`). `no` on Android."

    PhoneSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        profile: { enum: [child, self] }
        mode: { enum: [strong, light] }
        platform: { enum: [android, ios], description: "Existing phones are android. See docs/ios/architecture.md." }
        tier:
          enum: [strong, light, family_controls, supervised]
          description: "Android: the mode. iPhone: Family Controls alone, or supervised with Apple Configurator."
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        language: { $ref: "#/components/schemas/PhoneLanguage" }
        lockSystemLanguage:
          type: boolean
          description: Whether Android system language changes are blocked on a strong Child phone.
        openMode: { type: boolean, description: Every app is allowed except the block list. }
        timezone: { type: string }
        locationEnabled: { type: boolean }
        locationMode: { $ref: "#/components/schemas/LocationMode" }
        pairedAt: { type: [string, "null"], format: date-time }
        allowServerMove: { type: boolean }
        awaitingServerMove: { type: boolean }
        setupQrAvailable:
          type: boolean
          description: Whether the dashboard can issue a new setup QR code for this phone.
        supportEnabled: { type: boolean, default: true }
        releaseWarningsEnabled: { type: boolean, default: true }
        askMoreTimeEnabled: { type: boolean, default: true, description: "The phone may ask for more time when a limit runs out" }
        limitWarningEnabled: { type: boolean, default: true, description: "The phone warns five minutes before a limit runs out" }
        releaseSyncCount: { type: integer, minimum: 0, maximum: 3 }
        androidVersion: { type: [string, "null"] }
        setupEnrollmentId:
          type: [string, "null"]
          format: uuid
          description: Identifier of the current unused and unexpired setup QR, if its provisioning values still match. Returned in single-phone responses.
        releaseRequestedAt:
          type: [string, "null"]
          format: date-time
          description: When the parents released the phone, while the phone has not yet switched Plainphone off. Null otherwise. The phone disappears from the dashboard once it has.
        lastSeenAt: { type: [string, "null"], format: date-time }
        rulesCurrent:
          type: [boolean, "null"]
          description: Only on a single phone. Whether the phone has confirmed the rules the server holds now. Null while it has confirmed none.
        dnsHost:
          type: [string, "null"]
          description: The phone's own filter host. Null until the HTTP DNS resolver has confirmed it (`dnsReady`), so the address is never shown before it works.
        dnsSynced: { type: boolean }
        dnsConfigured: { type: boolean, description: Whether this server has a DNS filter service configured }
        dnsReady:
          type: boolean
          description: The configured HTTP DNS resolver has confirmed provisioning of this phone's ClientID with its current settings. Gates showing the address (`dnsHost`).
        rulesDnsReady:
          type: boolean
          description: The phone is filtered by its own host (what `/device/rules` tells it). True for confirmations made before they were tagged with the resolver, so "waiting" texts follow this field, not `dnsReady`.
        hasLocation: { type: boolean }
        attestation:
          description: The phone's last hardware attestation (#23); null when it has not attested.
          oneOf:
            - $ref: "#/components/schemas/Attestation"
            - type: "null"
        openRequests: { type: integer, description: "Open requests from the phone (apps, contacts)" }
        openMoreTimeRequests: { type: integer, description: "Open requests for more time" }
        offlineAlertHours:
          type: [integer, "null"]
          description: Hours of silence before the parents are told. Null means the server default, 0 never.
        pushWakeups: { type: boolean }
        preferUnifiedPush: { type: boolean }
        offlineAlertHoursDefault: { type: integer }
        changeReceiptsEnabled: { type: boolean }
        healthBoardEnabled: { type: boolean }
        weeklySummaryEnabled: { type: boolean }
        agePreset: { type: [string, "null"], enum: ["8-9", "10-11", "12-13", "14plus", null], description: The age preset last applied; null for none }
        reviewEnabled: { type: boolean, description: The "review the rules" reminder (off for phones from before it existed) }
        reviewIntervalMonths: { type: integer }
        reviewDueAt: { type: [string, "null"], format: date-time }
        reviewDue: { type: boolean, description: The review date has come }
        agreementEnabled: { type: boolean, description: Show the family agreement on the child's phone }
        agreementOnHome: { type: boolean, description: Also show it on the home screen }
        agreementHasText: { type: boolean }
        silentBedtime: { type: boolean }
        pinApprovalEnabled: { type: boolean }
        modesEnabled: { type: boolean, description: "Modes on one weekly schedule (docs/modes.md). Always false on a Self phone." }
        appUpdatesEnabled:
          type: boolean
          description: "Strong mode: the nightly window in which Play may update approved apps."
        appUpdatesRequestedAt:
          type: [string, "null"]
          format: date-time
          description: When a parent last pressed "Update apps now".
        ruleReceipt:
          type: [object, "null"]
          description: Confirmation for the current rules document. Null if disabled or unpaired.
          required: [appliedAt, confirmedAt]
          properties:
            needsUpdate:
              type: boolean
              description: The phone still reports a fetched ETag without confirming successful application.
            appliedAt: { type: [string, "null"], format: date-time }
            confirmedAt: { type: [string, "null"], format: date-time }
        status:
          description: The phone's last report from `PUT /device/status`; null when it has never reported.
          oneOf:
            - $ref: "#/components/schemas/PhoneStatus"
            - type: "null"

    Attestation:
      type: object
      description: >
        `verified`: locked bootloader with the maker's system. `unlocked`: bootloader unlocked (FRP is off).
        `custom-os`: verified boot found a system signed by another key. `failed-boot`: verified boot failed.
        `unverifiable`: inconclusive evidence, including revoked keys or contradictory boot state.
        `revoked`: legacy verdict retained in the schema for compatibility.
      required: [state, securityLevel, deviceLocked, verifiedBootState, osPatchLevel, revocationChecked]
      properties:
        state: { enum: [verified, unlocked, custom-os, failed-boot, unverifiable, revoked] }
        securityLevel: { enum: [software, tee, strongbox, null] }
        deviceLocked: { type: [boolean, "null"] }
        verifiedBootState: { enum: [verified, self-signed, unverified, failed, null] }
        osPatchLevel: { type: [integer, "null"], description: YYYYMM }
        revocationChecked: { type: boolean }
        checkedAt: { type: [string, "null"], format: date-time, description: Only in PhoneSummary. }
        lastFailedAt: { type: string, format: date-time, description: Most recent inconclusive check when a negative finding is retained. Only in PhoneSummary. }

    DeviceStatusInput:
      type: object
      required: [appVersion, batteryPct, charging, deviceOwner, lockIntact, maintenance, failedPolicies, rulesEtag, rulesAppliedAt, dnsHost]
      properties:
        appVersion: { type: string, minLength: 1, maxLength: 40, examples: ["0.4.0"] }
        androidVersion: { type: string, maxLength: 23 }
        appVersionCode: { type: integer, minimum: 1 }
        update:
          type: object
          required: [state, detail, checkedAt, latestVersion]
          properties:
            state: { enum: [upToDate, available, installing, prompted, refused, failed] }
            errorCode: { enum: [battery_exemption_missing, network, signature_mismatch, version_not_newer, metadata_mismatch, install_failed, unknown] }
            detail: { type: [string, "null"], maxLength: 200 }
            checkedAt: { type: [string, "null"], format: date-time }
            latestVersion: { type: [string, "null"], maxLength: 40 }
        batteryPct: { type: [integer, "null"], minimum: 0, maximum: 100 }
        charging: { type: [boolean, "null"] }
        deviceOwner: { type: boolean, description: Plainphone is the device owner of this phone. }
        lockIntact:
          type: boolean
          description: Every lock policy was applied and no maintenance unlock is running. In light mode also deviceAdmin, accessibility, usageAccess, vpn, phoneRole and smsRole must be on; for a phone paired as light or a report with mode light, the server stores false when `protections` is missing, one of them is off or missing, a policy failed or maintenance runs.
        maintenance: { type: boolean, description: A PIN maintenance unlock is running on the phone. }
        pushProvider: { enum: [none, fcm, unifiedpush] }
        failedPolicies:
          type: array
          maxItems: 50
          description: Names of the lock steps that failed.
          items: { type: string, minLength: 1, maxLength: 200 }
        liftedPolicies:
          type: array
          maxItems: 10
          description: Lock steps lifted on purpose for a parent-approved window, each with the deadline by which the phone puts it back (today only "restriction no_modify_accounts" during an approved Google sign-in). The phone still reports lockIntact true and leaves the step out of failedPolicies. The server only makes this stricter. An entry more than 2 minutes past its deadline is stored as a failed step with lockIntact false, so the usual protection alert fires. If the phone has not reported 10 minutes after a deadline, the sweeper tells the parents once.
          items:
            type: object
            required: [name, until]
            properties:
              name: { type: string, minLength: 1, maxLength: 200 }
              until: { type: string, format: date-time }
        installOverrunSequence:
          type: integer
          minimum: 1
          description: Phone-local incident sequence sent with an install-window overrun so retries retain its original expiry.
        rulesEtag:
          type: [string, "null"]
          maxLength: 100
          description: ETag of the rules the phone last applied.
        rulesReceiptConfirmed:
          type: boolean
          description: The ETag and time refer to a successful rules application; missing on older phones.
        webFilterActive:
          type: [boolean, "null"]
          description: Whether the phone observed the configured filter in use. Null if it could not tell.
        rulesAppliedAt:
          type: [string, "null"]
          format: date-time
          description: When the phone applied those rules. Must carry a time zone. Clock skew does not invalidate the report.
        dnsHost:
          type: [string, "null"]
          maxLength: 253
          description: The last private DNS host applied by the phone. Web filter observations use webFilterActive.
        resetProtection:
          type: [string, "null"]
          enum: ["on", "off", "no-play-services", "failed", null]
          description: "Factory reset protection on the phone: `on`, `off` (no parent account; Android's own FRP), `no-play-services` or `failed`. Optional for older apps."
          examples: ["on"]
        accountTypes:
          type: [array, "null"]
          maxItems: 20
          description: Account types signed in on the phone (`com.google`, a maker's account). Types only, no names.
          items: { type: string, minLength: 1, maxLength: 100 }
        callRoleActionNeeded:
          type: boolean
          description: A call role requires consent on the phone. This does not affect lock integrity.
        parallelAppsRemoved:
          type: boolean
          description: The phone removed extra Android users or profiles during hardening.
        parallelAppsRemovedId:
          type: string
          format: uuid
          writeOnly: true
          description: Stable identifier for retrying the removal notice.
        lateGoogleAccountId:
          type: string
          format: uuid
          writeOnly: true
          description: Stable identifier for an unexpected catalog account change. Account identities are never sent.
        clockMovedId:
          type: string
          format: uuid
          writeOnly: true
          description: Stable identifier for "the phone's clock is set more than 10 minutes from the server's time". Sent once per move.
        mode:
          enum: [strong, light]
          description: Optional; missing means strong. The phone's mode is decided at pairing; this field does not change it.
        filterMethod: { $ref: "#/components/schemas/FilterMethod" }
        filterWorking: { type: boolean }
        filterIssue: { type: string, enum: ["off", automatic, wrongHost, waiting, unverified, alwaysOn, strictDns] }
        protections: { $ref: "#/components/schemas/Protections" }
        timeUsed: { $ref: "#/components/schemas/TimeUsed" }
        ios: { $ref: "#/components/schemas/IosStatus" }
        appUpdates:
          type: object
          description: The last app update window in strong mode. The server records it and turns `caught` into app requests once per `id`.
          required: [id, trigger, openedAt, closedAt, updated, caught]
          properties:
            id: { type: string, maxLength: 64 }
            trigger: { type: string, enum: [night, parent] }
            openedAt: { type: [string, "null"], format: date-time, description: "Null when the window could not open." }
            closedAt: { type: [string, "null"], format: date-time, description: "Null while it is open." }
            updated: { type: integer, minimum: 0, description: "Installed apps that were updated." }
            caught:
              type: array
              maxItems: 20
              description: New apps installed during the window. The phone hid them at once.
              items: { $ref: "#/components/schemas/PackageName" }
            error: { type: string, enum: [batteryExemption, failed], description: "Why the window could not open." }

    IosNotYet:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { const: ios_pairing_not_yet }

    IosStatus:
      type: object
      description: >
        iPhones only. The lock counts as intact only while `authorizationStatus` is `approved`,
        no policy failed and no maintenance runs; Android's light-mode protections do not apply.
        Unknown fields are ignored, so a newer app can report more. A value outside the listed
        cases (a newer iOS) is recorded, not refused, and only `approved` counts as intact.
      required: [iosVersion, authorizationStatus]
      properties:
        iosVersion: { type: string, examples: ["26.1"] }
        authorizationStatus: { enum: [notDetermined, denied, approved], description: Family Controls authorization. }
        communicationLimits: { type: [boolean, "null"], description: "Apple's Communication Limits, through Declared Age Range; null when unknown." }
        dnsEnabled: { type: [boolean, "null"], description: The per-phone DNS settings are enabled (phase 4). }
        locationAuth: { enum: [notDetermined, denied, whenInUse, always] }
        effectiveStores:
          type: array
          maxItems: 20
          description: Named ManagedSettings stores in effect (base, school, bedtime, limits, maintenance).
          items: { type: string, maxLength: 40 }

    IosSelection:
      type: object
      required: [selection]
      properties:
        selection:
          type: string
          maxLength: 174764
          contentEncoding: base64
          description: Apple's encoded FamilyActivitySelection, base64 with padding, at most 128 KiB decoded. Opaque to the server.

    IosSelectionState:
      type: object
      required: [selection, source, updatedAt]
      properties:
        selection: { type: [string, "null"], contentEncoding: base64 }
        source: { enum: [parent, phone, null] }
        updatedAt: { type: [string, "null"], format: date-time }

    IosSelectionSaved:
      type: object
      required: [source, updatedAt]
      properties:
        source: { enum: [parent, phone] }
        updatedAt: { type: string, format: date-time }

    IosRules:
      type: object
      description: >
        The rules document of an iPhone: only keys an iPhone can act on, each left out when the
        phone's tier cannot do that feature at all (see `capabilities`). No package names, Android
        settings, home screen, push transport or Google accounts. Schedules have no app lists,
        time limits only the whole-phone limit, and apps come as `iosApps`. See
        docs/ios/architecture.md, "iOS rules document".
      required: [phoneId, platform, tier, capabilities, profile, timezone, rulesRevision, pollSeconds, iosApps, release]
      properties:
        phoneId: { type: string, format: uuid }
        platform: { const: ios }
        tier: { enum: [family_controls, supervised] }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        profile: { enum: [child, self] }
        timezone: { type: string }
        language: { type: [string, "null"] }
        rulesRevision: { type: integer }
        pollSeconds: { type: integer }
        release: { type: boolean }
        iosApps:
          type: object
          required: [open, selection]
          properties:
            open: { type: boolean, description: "True: the selection is the block list. False: the apps allowed besides Apple's own." }
            selection:
              description: Fetch the bytes from `GET /device/ios-selection` when `revision` changes. Null until someone picks apps.
              oneOf:
                - type: object
                  required: [revision, source, updatedAt]
                  properties:
                    revision: { type: string }
                    source: { enum: [parent, phone] }
                    updatedAt: { type: string, format: date-time }
                - type: "null"
      additionalProperties: true

    PhoneStatus:
      description: What the phone reported, plus when the server received it. `rulesAppliedAt` is returned in UTC.
      allOf:
        - $ref: "#/components/schemas/DeviceStatusInput"
        - type: object
          required: [reportedAt]
          properties:
            reportedAt: { type: string, format: date-time }
            lateGoogleAccount:
              type: boolean
              description: The phone detected an unexpected account change during catalog fallback or a late Google sign-in.
            clockMoved:
              type: boolean
              description: >-
                The phone's clock was set far from the real time recently. Schedules and limits keep following
                the server's time, so nothing opened up.

    ContactGroup:
      type: string
      enum: [family, friends, others]
    ModePreset:
      type: string
      enum: [school, homework, free, night, custom]
    Mode:
      type: object
      required: [id, preset, name, allApps, allowedPackages, contactGroups, quiet, isDefault]
      properties:
        id: { type: string, format: uuid }
        preset: { $ref: "#/components/schemas/ModePreset" }
        name: { type: [string, "null"], description: "Null: the preset's translated name." }
        allApps: { type: boolean, description: "Every app the parent allows anyway. Otherwise only allowedPackages and the core apps." }
        allowedPackages:
          type: array
          items: { $ref: "#/components/schemas/PackageName" }
        contactGroups:
          type: array
          description: The groups that can call and text during the mode. Parents are always reachable.
          items: { $ref: "#/components/schemas/ContactGroup" }
        quiet: { type: boolean, description: "A bedtime: silent while silentBedtime is on." }
        isDefault: { type: boolean, description: "Applies outside the schedule. Only its name can change." }
    ModeInput:
      type: object
      additionalProperties: false
      required: [preset, allApps, contactGroups]
      properties:
        preset: { $ref: "#/components/schemas/ModePreset" }
        name: { type: [string, "null"], maxLength: 30 }
        allApps: { type: boolean }
        allowedPackages:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PackageName" }
        contactGroups:
          type: array
          items: { $ref: "#/components/schemas/ContactGroup" }
        quiet: { type: boolean }
    ModeSlot:
      type: object
      required: [id, modeId, days, startMinute, endMinute]
      properties:
        id: { type: string, format: uuid }
        modeId: { type: string, format: uuid }
        days:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        startMinute: { type: integer, minimum: 0, maximum: 1439 }
        endMinute: { type: integer, minimum: 0, maximum: 1439, description: "Before startMinute: the slot crosses midnight." }
    ScheduleInput:
      type: object
      required: [kind, days, startMinute, endMinute]
      properties:
        kind: { enum: [school, bedtime] }
        days:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 7 }
        startMinute: { type: integer, minimum: 0, maximum: 1439 }
        endMinute: { type: integer, minimum: 0, maximum: 1439 }
        allowedPackages:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PackageName" }

    InitialSelfKey:
      oneOf:
        - type: object
          required: [keyType, delayHours]
          properties:
            keyType: { enum: [delay] }
            delayHours: { type: integer, enum: [1, 6, 12, 24, 48, 72] }
        - type: object
          required: [keyType, trustedEmail]
          properties:
            keyType: { enum: [trusted] }
            trustedEmail: { type: string, format: email }
        - type: object
          required: [keyType]
          properties:
            keyType: { enum: [trustedQr] }
    Key:
      type: object
      required: [keyType, delayHours, trustedEmail, payUnlockEnabled, payUnlockAmount, payUnlockRecipient]
      properties:
        keyType: { enum: [delay, trusted] }
        delayHours: { type: integer, minimum: 1, maximum: 72, default: 24 }
        trustedEmail: { type: [string, "null"], format: email }
        qrInvite: { type: boolean, description: Choose a trusted person by QR instead of email. }
        payUnlockEnabled: { type: boolean }
        payUnlockAmount: { type: integer, minimum: 100, description: Minor units. }
        payUnlockRecipient: { enum: [plainphone] }
    SelfLevel:
      enum: [mild, firm, strict, custom]
      description: |
        A name for the key, derived and never stored. Mild is a 1-hour wait, Firm a 24-hour wait,
        Strict a trusted person. Any other delay is custom. Choosing a level sends an ordinary `PUT /phones/{pid}/key`.
    EmergencyState:
      type: object
      description: |
        Limited emergency openings on a Self phone (docs/emergency-openings.md). Off by default.
        `used` is the server's count for the current calendar month in the phone's time zone;
        the phone counts for itself too and the larger number wins.
      required: [enabled, allowance, minutes, used]
      properties:
        enabled: { type: boolean }
        allowance: { type: integer, minimum: 1, maximum: 10, description: Openings per month. }
        minutes: { type: integer, description: How long one opening lasts, for one app. }
        used:
          type: object
          required: [month, count]
          properties:
            month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
            count: { type: integer, minimum: 0 }
    EmergencyOpening:
      type: object
      required: [id, packageName, appLabel, openedAt, minutes]
      properties:
        id: { type: string, format: uuid }
        packageName: { type: string }
        appLabel: { type: [string, "null"] }
        openedAt: { type: string, format: date-time }
        minutes: { type: integer }

paths:
  /device/sos:
    post:
      operationId: reportSos
      summary: Report a child SOS once per client ID
      tags: [device]
      security: [{ device: [] }]
      parameters:
        - name: X-Plainphone-Elapsed-Ms
          in: header
          required: false
          description: Milliseconds since the press on the phone's monotonic clock, for the delivery timing (docs/latency.md). A header, so older servers ignore it. Also accepted on `POST /device/quick-messages/send`.
          schema: { type: string, pattern: "^[0-9]{1,10}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, kind]
              properties:
                id: { type: string, format: uuid }
                kind: { enum: [urgent, help] }
                battery: { type: integer, minimum: 0, maximum: 100 }
                location: { $ref: "#/components/schemas/SosPosition" }
                smsSubmitted: { type: boolean }
                sentAt: { type: string, format: date-time }
                trigger: { enum: [power, clock, code], description: "A hidden SOS or a code word. Only with kind urgent." }
                message: { type: string, maxLength: 60, description: The quick message's text; required with trigger code and only then. }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SosEvent" }
        "403": { description: SOS unavailable (only for a report that did not already send an SMS) }
        "410": { description: SOS expired }
  /device/quick-messages/send:
    post:
      operationId: sendQuickMessage
      summary: Send an ordinary quick message to the parents as push
      description: Always accepted. With `notified` 0 no parent device got a push and the phone sends an SMS instead, unless `limited` (over the limit of ten in ten minutes; recorded but quiet) or `pending` (a repeat while the first send is still notifying; ask again). A repeated id is answered from the first send.
      tags: [device]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, text]
              properties:
                id: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 60 }
                inbox: { type: boolean, description: Sent from the family inbox; the message joins the thread (docs/family-inbox.md) }
                kind: { enum: [quick, checkin], default: quick, description: "checkin is \"I'm home\" without a position; it always joins the thread" }
                sentAt: { type: string, format: date-time, description: When the child pressed send; a later time is taken as the server's }
                smsSent: { type: boolean, description: "The phone was offline and sent the message by SMS: it joins the thread, nobody is notified again" }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [notified]
                properties:
                  notified: { type: integer, description: Parent devices that got a push }
                  limited: { type: boolean, description: Over the send limit; the phone sends no SMS either }
                  pending: { type: boolean, description: The first send with this id is still notifying }
        "404": { description: Not a Child phone }
  /device/quick-messages/suggest:
    post:
      operationId: suggestQuickMessage
      summary: Suggest a new quick message for a parent to approve
      tags: [device]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: Waiting for a parent (or the existing message with the same text)
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { enum: [active, suggested] }
        "403": { description: Suggestions are switched off }
        "409": { description: Three suggestions are already waiting }
  /device/inbox:
    get:
      operationId: getDeviceInbox
      summary: The family inbox thread for the child's phone
      description: The newest 30 messages, oldest first (docs/family-inbox.md). With the inbox off, empty lists. The phone fetches it when the rules' `inbox.latest` changes.
      tags: [device]
      security: [{ device: [] }]
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyInbox" }
        "404": { description: Not a Child phone }
  /device/inbox/received:
    post:
      operationId: inboxReceived
      summary: The device receipt for parent replies the phone has
      description: Only the first receipt per reply counts; repeats and unknown ids change nothing.
      tags: [device]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        "204": { description: Recorded }
  /device/extended/{cid}:
    parameters: [{ $ref: "#/components/parameters/contactId" }]
    get:
      operationId: deviceExtendedThread
      summary: The conversation with one extended contact
      tags: [device]
      security: [{ device: [] }]
      responses:
        "200":
          description: The contact and the newest 30 lines
          content:
            application/json:
              schema:
                type: object
                required: [contact, messages]
                properties:
                  contact:
                    type: object
                    required: [id, name, status, rev]
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      status: { type: string }
                      rev: { type: integer }
                  messages: { type: array, items: { $ref: "#/components/schemas/ExtendedMessage" } }
        "404": { description: Not on this phone's roster }
  /device/extended/{cid}/answer:
    parameters: [{ $ref: "#/components/parameters/contactId" }]
    post:
      operationId: deviceExtendedAnswer
      summary: The child says yes or no to an invitation
      tags: [device]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow]
              properties:
                allow: { type: boolean }
      responses:
        "204": { description: Recorded; repeating the same answer changes nothing }
        "404": { description: Not on this phone's roster }
        "409": { description: The invitation is not waiting for the child }
  /device/extended/{cid}/block:
    parameters: [{ $ref: "#/components/parameters/contactId" }]
    post:
      operationId: deviceExtendedBlock
      summary: The child blocks a person
      description: Their link and session stop working at once. Possible also while the feature is off.
      tags: [device]
      security: [{ device: [] }]
      responses:
        "204": { description: Blocked }
        "404": { description: Not on this phone's roster }
  /device/extended/{cid}/messages:
    parameters: [{ $ref: "#/components/parameters/contactId" }]
    post:
      operationId: deviceExtendedSend
      summary: A quick message the child sent to an extended contact
      description: Recorded while the person is a member; a repeated id keeps the first. `gone` when the person was removed, blocked or never joined.
      tags: [device]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, text]
              properties:
                id: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 60 }
                sentAt: { type: string, format: date-time }
      responses:
        "200":
          description: Recorded, or gone
          content:
            application/json:
              schema:
                type: object
                required: [stored]
                properties:
                  stored: { type: boolean }
                  gone: { type: boolean }
  /device/extended/{cid}/received:
    parameters: [{ $ref: "#/components/parameters/contactId" }]
    post:
      operationId: deviceExtendedReceived
      summary: The device receipt for a contact's replies
      tags: [device]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        "204": { description: Recorded }
  /device/location-snapshot:
    post:
      operationId: deviceLocationSnapshot
      summary: A location snapshot the child confirmed
      description: >-
        The line is always recorded in the recipient's conversation. The position is kept for one hour,
        for that recipient only, while snapshots are switched on; a newer snapshot replaces it.
      tags: [device]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, to, lat, lon, recordedAt]
              properties:
                id: { type: string, format: uuid }
                to: { type: string, description: "`parents`, or the id of an active extended contact" }
                lat: { type: number, minimum: -90, maximum: 90 }
                lon: { type: number, minimum: -180, maximum: 180 }
                accuracyM: { type: [number, "null"] }
                recordedAt: { type: string, format: date-time }
                sentAt: { type: string, format: date-time }
      responses:
        "200":
          description: What happened to it
          content:
            application/json:
              schema:
                type: object
                required: [stored, kept]
                properties:
                  stored: { type: boolean }
                  kept: { type: boolean, description: The position is visible to the recipient }
                  gone: { type: boolean, description: The contact is no longer a member }
                  expiresAt: { type: string, format: date-time }
                  notified: { type: integer, description: Parent devices that got a push }
  /device/sos/{id}:
    get:
      operationId: getDeviceSos
      summary: Check whether a parent acknowledged this SOS
      tags: [device]
      security: [{ device: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Acknowledgment status
          content:
            application/json:
              schema:
                type: object
                required: [seenAt, seenBy, seenByName]
                properties:
                  seenAt: { type: [string, "null"], format: date-time }
                  seenBy: { type: boolean }
                  seenByName: { type: [string, "null"] }
        "404": { description: SOS not found }
  /phones/{pid}/sos:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: listPhoneSos
      summary: Get the last 30 days of SOS events
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { in: query, name: unseen, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: SOS history
          content:
            application/json:
              schema:
                type: object
                required: [events, callbackNumber, settings]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/SosEvent" }
                  callbackNumber: { type: [string, "null"] }
                  settings: { $ref: "#/components/schemas/SosSettings" }
    put:
      operationId: setSosCallbackNumber
      summary: Set the callback number and the hidden SOS and quick-message switches
      description: Every field is optional; only the given ones change.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackNumber: { type: [string, "null"], description: "The phone's own number. A new number is unconfirmed and switches callback requests off until `callbackConfirmed` is sent" }
                callbackConfirmed: { type: boolean, description: "The parent says this is the phone's number" }
                callbackRequests: { type: boolean, description: "Let the phone ask for a callback. 409 without a confirmed number" }
                hiddenPower: { type: boolean }
                hiddenPresses: { type: integer, enum: [3, 4, 5, 6] }
                hiddenClock: { type: boolean }
                hiddenFeedback: { enum: [vibrate, none] }
                quickMessagesEnabled: { type: boolean }
                quickSuggestionsEnabled: { type: boolean }
                familyInbox: { type: boolean }
                checkIns: { type: boolean }
      responses:
        "204": { description: Saved }
        "404": { description: Not a Child phone }
        "409": { description: Callback requests need a number a parent has confirmed }
  /device/callback-requests:
    post:
      operationId: requestCallback
      summary: Ask a parent to call the phone back
      description: >
        The request carries no number. A repeated id, or a tap while another request is still open,
        answers with the first request and notifies nobody again. A report with `sentAt` is recorded even
        if the switch was turned off since; one older than 24 hours is stored as expired without an alert.
      tags: [device]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
                sentAt: { type: string, format: date-time, description: When the child pressed the button }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackDeviceState" }
        "403": { description: Asking for a callback is switched off (only for a request without `sentAt`; the phone always sends it, because it is the authority for taps it has already made) }
        "404": { description: Not a Child phone }
  /device/callback-requests/{id}:
    get:
      operationId: getDeviceCallbackRequest
      summary: How far a callback request got
      tags: [device]
      security: [{ device: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackDeviceState" }
        "404": { description: Not found }
  /phones/{pid}/callback-requests:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: listCallbackRequests
      summary: The last callback requests of a Child phone (kept 48 hours)
      description: Includes the number as saved now, so the app can show it before anything is dialled.
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema:
                type: object
                required: [callbackNumber, requests]
                properties:
                  callbackNumber: { type: [string, "null"] }
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/CallbackRequest" }
        "404": { description: Not a Child phone }
  /phones/{pid}/callback-requests/{id}/done:
    parameters:
      - { $ref: "#/components/parameters/phoneId" }
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: markCallbackDone
      summary: A parent is calling back, or has called another way
      description: >
        `number` carries the number the screen showed and is only accepted while it is still the saved
        one (409 `changed` or `missing`), so a stale number is never dialled. `other` records a call from
        the parent's own contacts and may carry the time it happened, so a report queued on a device is
        still recorded after the request expired. Repeating it changes nothing.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [via, number]
                  properties:
                    via: { enum: [number] }
                    number: { $ref: "#/components/schemas/E164" }
                - type: object
                  required: [via]
                  properties:
                    via: { enum: [other] }
                    at: { type: string, format: date-time }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallbackRequest" }
        "404": { description: Request not found }
        "409": { description: "`expired`, `changed` or `missing`" }
  /phones/{pid}/inbox:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getFamilyInbox
      summary: The family inbox thread of a Child phone
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyInbox" }
        "404": { description: Not a Child phone }
    post:
      operationId: replyFamilyInbox
      summary: Send a short reply to the child's phone
      description: The server can read the reply, like the quick messages (docs/family-inbox.md). Wakes the phone.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 60 }
                name: { type: string, minLength: 1, maxLength: 60, description: The name the child knows the parent by }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMessage" }
        "403": { description: The family inbox is off for this phone }
        "404": { description: Not a Child phone }
  /phones/{pid}/extended:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getExtendedRoster
      summary: The extended family roster of a Child phone
      description: Who is on it and their state. Parents do not read the conversations (docs/extended-family.md).
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtendedRoster" }
        "404": { description: Not a Child phone }
    post:
      operationId: inviteExtendedContact
      summary: Invite a named person with a single-use link
      description: The person joins only after the child says yes on the phone and the person accepts the link.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtendedInvite" }
        "403": { description: Extended family contacts are off for this phone }
        "404": { description: Not a Child phone }
        "409": { description: The phone has ten contacts already }
  /phones/{pid}/extended/{cid}:
    parameters: [{ $ref: "#/components/parameters/phoneId" }, { $ref: "#/components/parameters/contactId" }]
    patch:
      operationId: updateExtendedContact
      summary: Put the person in a contact group for modes
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group: { enum: [family, friends, others] }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtendedContact" }
        "404": { description: Not found }
    delete:
      operationId: removeExtendedContact
      summary: Remove the person, with their session and conversation
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "204": { description: Removed }
        "404": { description: Not found }
  /phones/{pid}/extended/{cid}/link:
    parameters: [{ $ref: "#/components/parameters/phoneId" }, { $ref: "#/components/parameters/contactId" }]
    post:
      operationId: renewExtendedLink
      summary: A new single-use link for the same person
      description: Ends the old session and conversation, and the child has to say yes again.
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The new link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtendedInvite" }
        "403": { description: Extended family contacts are off for this phone }
        "404": { description: Not found }
        "409": { description: The child declined or blocked this person }
  /family-contact/invite:
    post:
      operationId: previewFamilyInvite
      summary: What an invitation link is for, without using it up
      tags: [family-contact]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyInviteToken" }
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                required: [childName, contactName, childApproved, expiresAt]
                properties:
                  childName: { type: string }
                  contactName: { type: string }
                  childApproved: { type: boolean }
                  expiresAt: { type: string, format: date-time }
        "404": { description: Unknown or used link }
        "410": { description: Expired }
  /family-contact/accept:
    post:
      operationId: acceptFamilyInvite
      summary: Accept the invitation; the link is used up
      tags: [family-contact]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyInviteToken" }
      responses:
        "200":
          description: The session for this browser
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: { type: string, description: "`pp_fc_…`" }
        "404": { description: Unknown or used link }
        "410": { description: Expired }
  /family-contact/decline:
    post:
      operationId: declineFamilyInvite
      summary: Say no to the invitation
      tags: [family-contact]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyInviteToken" }
      responses:
        "204": { description: Declined }
        "404": { description: Unknown or used link }
        "410": { description: Expired }
  /family-contact/me:
    get:
      operationId: familyContactView
      summary: The contact's conversation with the child
      description: Marks the child's messages as received on this device.
      tags: [family-contact]
      security: [{ familyContact: [] }]
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                type: object
                required: [childName, name, status, paused, canReply, messages]
                properties:
                  childName: { type: string }
                  name: { type: string }
                  status: { type: string }
                  paused: { type: boolean, description: The parents switched the feature off }
                  canReply: { type: boolean }
                  messages: { type: array, items: { $ref: "#/components/schemas/ExtendedMessage" } }
        "401": { description: The session no longer works (blocked, removed or a new link was sent) }
    delete:
      operationId: familyContactLeave
      summary: Leave the child's roster
      tags: [family-contact]
      security: [{ familyContact: [] }]
      responses:
        "204": { description: Left }
        "401": { description: The session no longer works }
  /family-contact/me/messages:
    post:
      operationId: familyContactReply
      summary: A short reply to the child
      tags: [family-contact]
      security: [{ familyContact: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtendedMessage" }
        "401": { description: The session no longer works }
        "403": { description: Not active yet, or paused by the parents }
        "429": { description: Too many replies this hour }
  /age-presets:
    get:
      operationId: listAgePresets
      summary: The age presets and what each one sets
      description: One table for setup in the dashboard and the parent app (docs/age-presets.md).
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The presets, youngest first
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets: { type: array, items: { $ref: "#/components/schemas/AgePreset" } }
  /phones/{pid}/age:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getAgeState
      summary: The age preset and the review reminder of a Child phone
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The state, with ideas for what to open next
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeState" }
        "404": { description: Not a Child phone }
  /phones/{pid}/age-preset:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    post:
      operationId: applyAgePreset
      summary: Apply an age preset
      description: Sets the daily cap, bedtime, school time and blocked web categories to the preset's values, and counts as a review. Nothing is locked; every value stays editable.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              additionalProperties: false
              properties:
                preset: { type: string, enum: ["8-9", "10-11", "12-13", "14plus"] }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeState" }
        "400": { description: Unknown preset }
        "404": { description: Not a Child phone }
  /phones/{pid}/review:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    put:
      operationId: setReview
      summary: Turn the review reminder on or off, change how often it comes, or move the date
      description: Turning it on starts the clock one interval from now. A new interval restarts the clock; a date moves it to 09:00 that day on the phone's clock. The reminder goes out by the household's summary channels (mail and notification).
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                intervalMonths: { type: integer, enum: [1, 2, 3, 6, 12] }
                dueDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: A local date, today or later }
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeState" }
        "400": { description: Not a date, or in the past }
        "404": { description: Not a Child phone }
        "409": { description: The reminder is off }
  /phones/{pid}/review/done:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    post:
      operationId: markReviewed
      summary: "We looked at the rules: the next review is one interval away"
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgeState" }
        "404": { description: Not a Child phone }
        "409": { description: The reminder is off }
  /phones/{pid}/agreement:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getAgreement
      summary: The family agreement of a Child phone
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: The agreement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "404": { description: Not a Child phone }
    put:
      operationId: setAgreement
      summary: Write the family agreement, or switch it on or off
      description: Any field may be left out. The phone gets it in the rules (`ageAgreement`) and shows it on "What can my parents see?". It is never written to logs.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lines: { type: array, items: { type: string }, maxItems: 8 }
                adultLines: { type: array, items: { type: string }, maxItems: 5 }
                enabled: { type: boolean }
                onHome: { type: boolean }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "400": { description: Too many or too long lines }
        "404": { description: Not a Child phone }
  /phones/{pid}/quick-messages:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: listQuickMessages
      summary: The phone's quick messages and the child's waiting suggestions
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Quick messages
          content:
            application/json:
              schema:
                type: object
                required: [messages, suggestions]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/QuickMessage" }
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/QuickMessageSuggestion" }
        "404": { description: Not a Child phone }
    post:
      operationId: addQuickMessage
      summary: Add a quick message (at most six)
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 60 }
                meansSos: { type: boolean, default: false }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickMessage" }
        "409": { description: The phone already has six quick messages }
  /phones/{pid}/quick-messages/{id}:
    parameters:
      - { $ref: "#/components/parameters/phoneId" }
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateQuickMessage
      summary: Change a quick message's text or code-word flag
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, minLength: 1, maxLength: 60 }
                meansSos: { type: boolean }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickMessage" }
        "404": { description: Quick message not found }
    delete:
      operationId: deleteQuickMessage
      summary: Remove a quick message or a suggestion
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "204": { description: Removed }
        "404": { description: Quick message not found }
  /phones/{pid}/quick-messages/{id}/approve:
    parameters:
      - { $ref: "#/components/parameters/phoneId" }
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveQuickMessage
      summary: Approve the child's suggestion as a quick message
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                meansSos: { type: boolean }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuickMessage" }
        "404": { description: Suggestion not found }
        "409": { description: The phone already has six quick messages }
  /phones/{pid}/quick-messages/{id}/decline:
    parameters:
      - { $ref: "#/components/parameters/phoneId" }
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: declineQuickMessage
      summary: Decline the child's suggestion; nothing about it is kept
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "204": { description: Declined }
        "404": { description: Suggestion not found }
  /phones/{pid}/sos/{id}/seen:
    post:
      operationId: acknowledgeSos
      summary: Acknowledge an SOS
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: SOS with its original acknowledgment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SosEvent" }
        "404": { description: SOS not found }
  /phones/{pid}/contacts/{cid}/sos-parent:
    put:
      operationId: markSosParent
      summary: Choose an approved parent number for SOS SMS and calls
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { in: path, name: cid, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204": { description: Saved }
        "404": { description: Contact not found }
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Liveness, database and DNS service check
      description: '`dns` is `mock` (no DNS service configured), `ok` or `down`. `ok` only reflects the database, so a DNS outage does not restart the server. `push` contains configuration booleans for `web`, `fcm`, `apns` and `unifiedpush`, and `push.errors`: short reasons (never secrets) for push providers switched off because their settings were invalid, e.g. `fcm: invalid service account`. Top-level `errors` does the same for other optional integrations such as SMTP. Both are empty arrays when all is well.'
      responses:
        "200": { description: "OK, e.g. `{ok: true, compatibility: 1, db: ok, mail: smtp, dns: ok}`" }
        "503": { description: "Database down" }
  /latency:
    get:
      operationId: getLatency
      security: []
      summary: How fast alerts and wake-ups travel (last 7 days)
      description: 'Median and 95th percentile per path (docs/latency.md). `phone-server`: from the press on the child phone to the server, per `kind` (`sos`, `quick`, `callback`). `server-parent`: from the server to the push service accepting the alert, per `provider` (`web`, `fcm`, `apns`). `parent-device`: from the server to the parent''s device confirming it arrived. `server-child`: from a wake-up to the child phone''s next rules fetch, per `provider` (`fcm`, `unifiedpush`, `poll`). Paths with fewer than `minSamples` samples are left out, and the sample counts are never shown, so the numbers cannot reveal when a single alert happened. No personal data; cached for a minute.'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enabled, windowDays, minSamples, paths]
                properties:
                  enabled: { type: boolean, description: "False when the server has LATENCY_STATS=off." }
                  windowDays: { type: integer }
                  minSamples: { type: integer }
                  paths:
                    type: array
                    items:
                      type: object
                      required: [path, provider, kind, p50Ms, p95Ms]
                      properties:
                        path: { enum: [phone-server, server-parent, parent-device, server-child] }
                        provider: { type: [string, "null"] }
                        kind: { type: [string, "null"] }
                        p50Ms: { type: integer }
                        p95Ms: { type: integer }
  /metrics:
    get:
      operationId: getMetrics
      security: []
      summary: Delivery speed for the operator, as Prometheus text
      description: 'Operator only (docs/latency.md). Needs `Authorization: Bearer <METRICS_TOKEN>`; answers 404 while `METRICS_TOKEN` is unset and 401 for a wrong token (10 wrong guesses a minute per IP). p50 and p95 in milliseconds (`plainphone_latency_ms`) and sample counts (`plainphone_latency_samples`) per `path`, `provider` (`fcm`, `apns`, `webpush`, `unifiedpush`, `poll`), `kind` and `window` (`1h`, `24h`), and failed parent pushes since start-up per provider (`plainphone_push_failures_total`). Aggregates only: no household, phone or user. Not cached.'
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4
          content:
            text/plain:
              schema: { type: string }
        "401": { description: Missing or wrong token }
        "404": { description: METRICS_TOKEN is not set }
        "429": { description: Too many wrong tokens from this IP }
  /push-receipt:
    post:
      operationId: postPushReceipt
      security: []
      summary: A parent device confirms a notification arrived or was opened
      description: '`receipt` is the random id in the push payload (`receipt`). Only the first `delivered` and the first `opened` per id count. Unknown ids answer 204 too. Rate limited to 120 a minute per IP.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
                event: { enum: [delivered, opened], default: delivered }
      responses:
        "204": { description: Recorded (or ignored) }
        "429": { description: Too many receipts }

  # ---------------------------------------------------------------- device
  /device/pairings:
    post:
      operationId: postDevicePairings
      security: []
      tags: [device]
      summary: Start pairing (phone)
      description: Rate limited to 10 per hour per IP. The code is valid for 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { enum: [strong, light], default: strong, description: "Ignored for an iPhone, which always pairs as light." }
                platform:
                  enum: [android, ios]
                  default: android
                  description: "`ios` needs IOS_PAIRING_ENABLED on the server; otherwise 403 with code `ios_pairing_not_yet`."
                profile: { enum: [child, self] }
                confirmOnPhone: { type: boolean, default: false }
                deviceInfo:
                  type: object
                  additionalProperties: { type: string, maxLength: 200 }
                  maxProperties: 20
                  examples: [{ model: "Galaxy A15", android: "15" }]
      responses:
        "201":
          description: Show `code` and a QR code of `qrUrl`; keep `pollSecret` private.
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmOnPhone: { type: boolean }
                  platform: { enum: [android, ios] }
                  pairingId: { type: string, format: uuid }
                  code: { type: string, examples: ["K7MP-4QXR"] }
                  pollSecret: { type: string }
                  expiresAt: { type: string, format: date-time }
                  qrUrl: { type: string, format: uri }
        "403":
          description: "iPhone pairing is not available on this server yet (`code: ios_pairing_not_yet`). Show it as \"not yet\", not as an error."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IosNotYet" }
        "429": { $ref: "#/components/responses/Error" }

  /device/pairings/{id}:
    get:
      operationId: getDevicePairings
      security: []
      tags: [device]
      summary: Poll pairing (phone)
      description: Poll every 3-5 seconds. Light-mode phones review the claimed account before confirming. Strong-mode phones receive the token automatically and can display the account. After delivery, the same poll secret can recover the token for up to 24 hours or until the first rules sync.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Poll-Secret, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: Paired. Store the token in encrypted storage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: paired }
                  phoneId: { type: string, format: uuid }
                  deviceToken: { type: string, examples: [pp_d_…] }
                  setupUndoMinutes: { type: integer, enum: [0, 5, 10, 30, 60], description: Optional dashboard override for light-mode setup. }
                  account:
                    type: object
                    description: Masked claimer and household for strong-mode pairing, when available.
                    required: [maskedEmail, householdName]
                    properties:
                      maskedEmail: { type: string }
                      householdName: { type: [string, "null"] }
        "202":
          description: Waiting for a claim or for the phone to review the masked account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { enum: [waiting, confirm] }
                  maskedEmail: { type: string }
                  householdName: { type: [string, "null"] }
        "404": { description: "Unknown pairing or wrong secret" }
        "410": { description: "Expired, or the phone already synced. Start again if the token was lost." }

    post:
      operationId: postDevicePairingDecision
      security: []
      tags: [device]
      summary: Confirm the claimed account or cancel pairing (phone)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Poll-Secret, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { enum: [confirm, cancel] }
                filterMethod: { $ref: "#/components/schemas/FilterMethod" }
                key: { $ref: "#/components/schemas/InitialSelfKey" }
      responses:
        "200":
          description: Confirmed. The token can be recovered for up to 24 hours or until the first rules sync.
          content:
            application/json:
              schema:
                type: object
                required: [status, phoneId, deviceToken]
                properties:
                  status: { const: paired }
                  phoneId: { type: string, format: uuid }
                  deviceToken: { type: string }
                  setupUndoMinutes: { type: integer, enum: [0, 5, 10, 30, 60], description: Optional dashboard override for light-mode setup. }
                  account:
                    type: object
                    description: Masked claimer and household for strong-mode pairing, when available.
                    required: [maskedEmail, householdName]
                    properties:
                      maskedEmail: { type: string }
                      householdName: { type: [string, "null"] }
        "204": { description: "Cancelled. Any pending phone entry was removed." }
        "404": { description: "Unknown pairing or wrong secret" }
        "410": { description: "Expired or already confirmed" }

  /device/enrollment-review:
    post:
      operationId: postDeviceEnrollmentReview
      security: []
      tags: [device]
      summary: Review or cancel an unused dashboard setup token (phone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, mode]
              properties:
                token: { type: string, pattern: "^pp_e_", maxLength: 100 }
                mode: { enum: [strong, light] }
                cancel: { type: boolean }
      responses:
        "200":
          description: The masked account that issued the link and the existing profile.
          content:
            application/json:
              schema:
                type: object
                required: [maskedEmail, householdName, profile]
                properties:
                  maskedEmail: { type: string }
                  householdName: { type: [string, "null"] }
                  profile: { enum: [child, self] }
        "204": { description: "Cancelled and pending phone entry removed" }
        "404": { description: "Setup link unavailable" }
        "429": { $ref: "#/components/responses/Error" }

  /device/enrollment-template:
    post:
      operationId: postDeviceEnrollmentTemplate
      security: []
      tags: [device]
      summary: Copy a template into an unused light-mode Self setup link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, template]
              properties:
                token: { type: string, pattern: "^pp_e_", maxLength: 100 }
                template: { type: string, pattern: "^pp_r_[A-Za-z0-9_-]{30,70}$" }
      responses:
        "200":
          description: Rules copied into the draft with one or more core app blocks skipped
          content:
            application/json:
              schema:
                type: object
                required: [skippedCoreBlocks]
                properties:
                  skippedCoreBlocks: { type: integer, minimum: 1 }
        "204": { description: Rules copied into the existing draft with no blocks skipped }
        "404": { description: Setup link or template unavailable }
        "429": { $ref: "#/components/responses/Error" }

  /device/enroll:
    post:
      operationId: postDeviceEnroll
      security: []
      tags: [device]
      summary: Pair with a dashboard setup token (phone)
      description: |
        A strong-mode provisioning QR code (`plainphone.enroll` in the admin extras) or a light-mode
        setup link carries a one-time enrollment token. Strong mode redeems it automatically and
        shows the connected account for information. Light mode redeems it after account confirmation.
        The phone gets its device token with no code to type. The token is bound to the phone entry the parent made,
        works once and expires after 24 hours. If the answer is lost, the same phone (same `installId`)
        may ask again for 60 minutes; it then gets a new device token and the earlier one stops
        working. Rate limited to 20 per hour per IP. Phones set up with a script-made QR code (no
        token) pair with a code as before (`POST /device/pairings`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, installId]
              properties:
                token: { type: string, pattern: "^pp_e_", maxLength: 100 }
                filterMethod: { $ref: "#/components/schemas/FilterMethod" }
                key: { $ref: "#/components/schemas/InitialSelfKey" }
                installId:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{16,64}$"
                  description: Random id the phone makes once and keeps; only its hash is stored.
                deviceInfo:
                  type: object
                  additionalProperties: { type: string, maxLength: 200 }
                  maxProperties: 20
      responses:
        "200":
          description: Paired. Store `deviceToken` like a token from a pairing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: paired }
                  phoneId: { type: string, format: uuid }
                  deviceToken: { type: string }
                  setupUndoMinutes: { type: integer, enum: [0, 5, 10, 30, 60], description: Optional dashboard override for light-mode setup. }
                  account:
                    type: object
                    description: Masked token issuer for a new strong-mode enrollment, when available.
                    required: [maskedEmail, householdName]
                    properties:
                      maskedEmail: { type: string }
                      householdName: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: Unknown token. Strong setup requires a fresh QR and a factory reset. }
        "409":
          description: "This QR code is out of date. Make a new one."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Token superseded, expired, already used by another phone, or the phone entry is already paired. Strong setup requires a fresh QR and a factory reset.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  code: { const: outdated_qr, description: Present for superseded tokens. }
        "429": { $ref: "#/components/responses/Error" }

  /device/move:
    post:
      operationId: redeemServerMove
      tags: [device]
      security: []
      summary: Redeem a one-time move token into a phone-generated device credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, deviceToken]
              properties:
                token: { type: string }
                deviceToken: { type: string }
      responses:
        "204": { description: Token consumed }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /device/move-rules:
    get:
      operationId: previewServerMoveRules
      tags: [device]
      security: [{ device: [] }]
      summary: Validate the new rules before changing the phone's connection.
      responses:
        "200":
          description: Destination rules for the pending move
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rules" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /device/rules:
    get:
      operationId: getDeviceRules
      tags: [device]
      summary: Fetch rules (phone)
      security: [{ device: [] }]
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200":
          description: Rules changed (or first fetch). Cache the document and ETag, and confirm the ETag in status after a successful application.
          headers:
            ETag: { schema: { type: string } }
            X-Server-Time:
              description: >-
                The server's clock in milliseconds since the epoch. Every `/device/*` answer carries it.
                Phones keep their schedules on it instead of their own clock (docs/light-mode.md, "The phone's clock").
              schema: { type: string, pattern: "^[0-9]+$" }
          content:
            application/json:
              schema:
                description: Android phones get `Rules`; iPhones get `IosRules` (docs/ios/architecture.md).
                oneOf:
                  - $ref: "#/components/schemas/Rules"
                  - $ref: "#/components/schemas/IosRules"
        "304":
          description: Unchanged
          headers:
            X-Server-Time: { description: "The server's clock in milliseconds since the epoch.", schema: { type: string, pattern: "^[0-9]+$" } }
        "401": { description: "Token unknown (phone removed by a parent). Keep the last rules and show \"pair again\"." }

  /device/ios-selection:
    get:
      operationId: getDeviceIosSelection
      tags: [device]
      summary: Fetch this iPhone's app selection (iPhone)
      security: [{ device: [] }]
      responses:
        "200":
          description: The selection, or nulls when none was picked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IosSelectionState" }
        "404": { description: "Not an iPhone" }
    put:
      operationId: putDeviceIosSelection
      tags: [device]
      summary: Report apps picked on the iPhone after the parent PIN (iPhone)
      description: >
        The phone already applies the pick; the server records it. Allowed while the capability
        `pickAppsOnPhone` is not `no` (spike (a), docs/ios/spikes.md).
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IosSelection" }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IosSelectionSaved" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: "This phone cannot pick its own apps (`code: not_supported`, e.g. Android)" }
        "413": { description: "Selection too large" }

  /device/self/favourites:
    post:
      operationId: setDeviceFavourite
      tags: [device]
      summary: Add or remove a Self phone favourite
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, number, favourite]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                number: { $ref: "#/components/schemas/E164" }
                favourite: { type: boolean }
      responses:
        "202": { description: "Waiting for the Self key" }
        "204": { description: "Applied" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: "Self phone not found" }

  /device/contact-suggestions:
    put:
      operationId: putDeviceContactSuggestions
      tags: [device]
      summary: Replace pending suggestions with the current address book of a child phone
      description: Send up to 2,000 of the most recently updated contacts when the parent has opted in, including an empty list after the last contact is deleted. Reviewed numbers stay excluded from future suggestions.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contacts]
              properties:
                contacts:
                  type: array
                  items: { $ref: "#/components/schemas/SuggestedContactInput" }
      responses:
        "204": { description: "Received" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: "Contact suggestions are off" }
        "404": { description: "Available only for child phones" }
        "413": { description: "Snapshot exceeds 4 MiB" }
        "429": { description: "Too many suggestion uploads" }

  /device/apps:
    put:
      operationId: putDeviceApps
      tags: [device]
      summary: Report installed launchable apps (phone)
      description: Send the full list after pairing and whenever packages change. Apps missing from the list are marked uninstalled. New apps start hidden unless `core` or in the country starter pack.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apps]
              properties:
                apps:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [packageName, label]
                    properties:
                      packageName: { $ref: "#/components/schemas/PackageName" }
                      label: { type: string, maxLength: 100 }
                      core:
                        type: boolean
                        description: Dialer, messages, settings, launcher, keyboard, clock, camera, contacts. Never hidden.
      responses:
        "204": { description: "Stored" }

  /device/location:
    put:
      operationId: putDeviceLocation
      tags: [device]
      summary: Report the current position (phone)
      description: In mode `always` every `location.intervalMinutes`; in every mode but `off` at once when `location.requestedAt` is set, and once when `checkIn.locationDue` is true. A check-in requires a position recorded after its creation. Only the newest position is kept.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon, recordedAt]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lon: { type: number, minimum: -180, maximum: 180 }
                accuracyM: { type: number, minimum: 0 }
                recordedAt: { type: string, format: date-time }
                purpose:
                  type: string
                  description: >-
                    Use always, find:<requestedAt in epoch milliseconds>, or checkin:<id>.
                    Each tag serves only its matching request. Without a purpose, one fix can serve
                    Find, always and check-in together. Untagged check-in uploads are accepted up to
                    two minutes before the reply deadline, based on server time. A fix clears Find
                    only if recorded at or after the Find request.
      responses:
        "204": { description: "Accepted. A check-in fix is held for publication after the reply grace period." }
        "400": { description: "Invalid fix: recorded in the future, at or before the check-in was created, or (with a check-in purpose) before its reply deadline." }
        "409": { description: "Location is off for this phone, or no position was asked for; stop reporting." }

  /device/safety/{rid}:
    post:
      operationId: postDeviceSafety
      tags: [device]
      summary: Report what happened to a ring or an "Are you okay?" (phone)
      description: "`shown` when the screen appeared; `here` answers a ring; `ok` and `call` answer a check-in. The first answer counts."
      security: [{ device: [] }]
      parameters:
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { enum: [shown, here, ok, call] }
      responses:
        "204": { description: "Stored" }
        "400": { description: "The event does not fit the request's kind" }
        "404": { description: "No such request for this phone" }

  /device/update-request:
    get:
      operationId: waitForPhoneUpdateRequest
      tags: [device]
      summary: Wait briefly for a parent update request
      security: [{ device: [] }]
      parameters:
        - in: query
          name: after
          required: true
          schema: { type: integer, minimum: 0 }
          description: Last handled request in epoch milliseconds.
      responses:
        "200":
          description: A newer request
          content:
            application/json:
              schema:
                type: object
                required: [requestedAtMs]
                properties:
                  requestedAtMs: { type: integer }
        "204": { description: "No newer request before the wait expired" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { description: "The phone already has a waiter" }

  /device/status:
    put:
      operationId: putDeviceStatus
      tags: [device]
      summary: Report battery, app version and lock state (phone)
      description: The newest report replaces the one before; no history is kept. Parents see it on the phone's page. How often to send is up to the app; sending at once when the lock state or a maintenance unlock changes is useful.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceStatusInput" }
      responses:
        "204": { description: "Stored, including any install-window overrun in failedPolicies" }
        "400": { $ref: "#/components/responses/Error" }

  /device/released:
    post:
      operationId: postDeviceReleased
      tags: [device]
      summary: Tell the server Plainphone is switched off (phone)
      description: |
        Sent by the phone after it has switched Plainphone off because the rules said
        `release: true`. The server deletes the phone and its DNS client, so the device token is
        unknown from then on (401, which the phone reads as "removed"). Answers 409 when nobody
        asked for a release. Send it again after a network error; 401 on a retry means it
        already went through. See docs/sync-api.md.
      security: [{ device: [] }]
      responses:
        "204": { description: "The phone is deleted" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /device/approval-challenge:
    get:
      operationId: getDeviceApprovalRequests
      security: [{ device: [] }]
      tags: [device]
      summary: List pending trusted approvals for this Self phone
      responses:
        "200":
          description: Pending changes and their affected rule targets.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      required: [id, type, appLabel, summary]
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string }
                        appLabel: { type: [string, "null"], description: "App label, package fallback, or * for the total time limit." }
                        summary: { $ref: "#/components/schemas/ApprovalSummary" }
    post:
      operationId: postDeviceApprovalChallenge
      security: [{ device: [] }]
      tags: [device]
      summary: Issue a two-minute code and replace any earlier code for this change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeId]
              properties:
                changeId: { type: string, format: uuid }
      responses:
        "200":
          description: Challenge, QR URL and the change shown with it.
          content:
            application/json:
              schema:
                type: object
                required: [challenge, url, summary]
                properties:
                  challenge: { type: string }
                  url: { type: string, format: uri }
                  summary: { $ref: "#/components/schemas/ApprovalSummary" }
        "404": { $ref: "#/components/responses/Error" }
  /device/approval-challenge/{changeId}:
    get:
      operationId: getDeviceApprovalState
      security: [{ device: [] }]
      tags: [device]
      summary: Whether the request behind a QR code on this Self phone has been answered
      parameters: [{ name: changeId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200":
          description: The state of the request.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [waiting, approved, declined, cancelled, failed] }
        "404": { $ref: "#/components/responses/Error" }
  /device/trusted-invite:
    post:
      operationId: postDeviceTrustedInvite
      security: [{ device: [] }]
      tags: [device]
      summary: Create a 15-minute helper invite for a Self phone waiting for a QR invite
      responses:
        "402": { $ref: "#/components/responses/PlanLimit" }
        "201": { description: Invite URL and expiry }
        "409": { $ref: "#/components/responses/Error" }
  /device/self-template:
    post:
      operationId: postDeviceSelfTemplate
      security: [{ device: [] }]
      tags: [device]
      summary: Share a short-lived copy of this Self phone’s selected rules
      responses:
        "201": { description: Template URL }
        "409": { $ref: "#/components/responses/Error" }

  /device/setup-completion:
    get:
      operationId: getDeviceSetupCompletion
      tags: [device]
      summary: Read the remaining setup undo window (phone)
      security: [{ device: [] }]
      responses:
        "200":
          description: The time left, or zero when setup undo is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupUndoWindow" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: postDeviceSetupCompletion
      tags: [device]
      summary: Record completion once for a light-mode phone
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [elapsedMs]
              properties:
                elapsedMs:
                  type: [integer, "null"]
                  minimum: 0
                  description: Elapsed time since local setup completed, capped at seven days by the server. Null when unknown after a reboot.
                undoMinutes: { type: integer, enum: [0, 5, 10, 30, 60], description: Optional Self phone choice. }
      responses:
        "200":
          description: The time left, or zero when setup undo is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupUndoWindow" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /device/undo-setup:
    post:
      operationId: postDeviceUndoSetup
      tags: [device]
      summary: Report local undo of light-mode setup (phone)
      description: |
        The phone decides its local undo window and switches off locally. The server records
        authenticated light-mode reports at any time by removing the phone and queuing a notice.
        Reports received more than 48 hours after a known window ended are marked as late.
        A strong-mode phone receives a 409.
      security: [{ device: [] }]
      responses:
        "204": { description: "The phone was removed" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /device/requests:
    post:
      operationId: postDeviceRequest
      tags: [device]
      summary: Ask for an app or a contact (phone)
      description: |
        The person with the phone asks for an app from the phone's own app list (by package
        name, as reported in `PUT /device/apps`) or for a contact. The parents get a push
        notification. Asking again for the same thing while it is open returns the open
        request (200). At most 10 open requests per phone. See docs/sync-api.md.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [kind, packageName]
                  properties:
                    kind: { const: app }
                    packageName: { type: string, example: com.spotify.music }
                - type: object
                  required: [kind, name, number]
                  properties:
                    kind: { const: contact }
                    name: { type: string, maxLength: 60 }
                    number: { type: string, description: "International format, e.g. +4512345678" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneRequest" }
        "200":
          description: The same thing is already asked for; the open request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneRequest" }
        "404": { description: "The app is not on the phone's app list" }
        "409": { description: "The app is already allowed, or the number is already a contact" }
        "429": { description: "Too many open requests" }
    get:
      operationId: getDeviceRequests
      tags: [device]
      summary: The phone's requests and their answers (phone)
      description: Open requests and those answered in the last 30 days, newest first.
      security: [{ device: [] }]
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/PhoneRequest"
                        - type: object
                          properties:
                            waitingForKey:
                              type: boolean
                              description: Approved on a Self phone, but the change still waits for the key
                            effectiveAt:
                              type: [string, "null"]
                              format: date-time
                              description: When a delay-key change takes effect

  /device/emergency-openings:
    post:
      operationId: reportEmergencyOpening
      tags: [device]
      summary: Report an emergency opening the Self phone already used (phone)
      description: |
        The phone opens first, offline if need be, and reports later. It is the authority for what
        it did, so the server never refuses: the opening is recorded once per `id` (a retry is a
        no-op) and the trusted person is told. Counted per calendar month in the phone's time zone.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, packageName, openedAt]
              properties:
                id: { type: string, format: uuid, description: Generated on the phone. }
                packageName: { type: string }
                openedAt: { type: string, format: date-time }
                minutes: { type: integer, minimum: 1, default: 15 }
      responses:
        "204": { description: Recorded, or already known }
        "400": { $ref: "#/components/responses/Error" }

  /device/requests/{rid}/approve-on-phone:
    post:
      operationId: approveDeviceRequestOnPhone
      tags: [device]
      summary: Report that a parent approved a request on the phone with the parent PIN (phone)
      description: |
        The phone checked the parent PIN itself and is the authority for what it did, so this is a
        report, not a question. The first answer wins and a repeat changes nothing: if a parent
        already answered in the dashboard or the parent app, `won` is false and the body shows
        what was decided. The approval is applied like a parent's (the app is shown, the contact
        is added) and the parents are told it happened on the phone. Only child phones.
        The id may also be a request for more time (`/device/more-time-requests`): then 15 minutes
        are granted, `decidedVia` is `phone` and the body is that request (no `kind`).
      security: [{ device: [] }]
      parameters:
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The request as it stands now, and whether this report decided it
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [won]
                    properties:
                      won: { type: boolean }
                  - oneOf:
                      - $ref: "#/components/schemas/PhoneRequest"
                      - $ref: "#/components/schemas/MoreTimeRequest"
        "404": { description: "No such request on this phone" }
        "409": { description: "A Self phone has no parent PIN, or the change could not be applied (the request stays open)" }
  /device/attestation/challenge:
    post:
      operationId: postDeviceAttestationChallenge
      tags: [device]
      summary: A fresh challenge for hardware key attestation (#23)
      description: Valid for 10 minutes, one open challenge per phone.
      security: [{ device: [] }]
      responses:
        "200":
          description: Challenge (base64url)
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expiresAt]
                properties:
                  challenge: { type: string }
                  expiresAt: { type: string, format: date-time }
  /device/attestation:
    put:
      operationId: putDeviceAttestation
      tags: [device]
      summary: Send the attestation certificate chain of a key made with the challenge
      description: >
        The server checks the chain against Google's attestation roots and revocation list and reads
        the boot state. Verification happens only on the server. No serial number or IMEI is attested.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, chain]
              properties:
                challenge: { type: string, maxLength: 100 }
                chain:
                  type: array
                  maxItems: 10
                  not: { minItems: 1, maxItems: 1 }
                  description: Two or more DER certificates, base64, leaf first. Empty when the keystore cannot provide an attestation chain.
                  items: { type: string, minLength: 1, maxLength: 12000 }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attestation" }
        "400": { description: The chain does not verify, or was made for another challenge }
        "409": { description: Unknown, used or expired challenge }
        "503": { description: Certificate verifier temporarily unavailable. Request a new challenge to retry. }
  /device/push-token:
    put:
      operationId: putDevicePushToken
      tags: [device]
      summary: Register or clear the phone wakeup transport
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcmToken: { type: [string, "null"] }
                unifiedPushEndpoint: { type: [string, "null"] }
      responses:
        "204": { description: "Stored" }
        "409": { description: "Wakeup settings changed or the transport is unavailable" }
        "422": { description: "Firebase rejected the registration token" }
        "503": { description: "Firebase token validation is temporarily unavailable" }

  # ---------------------------------------------------------------- auth
  /auth/request:
    post:
      operationId: postAuthRequest
      security: []
      tags: [auth]
      summary: Mail a sign-in link
      description: Same answer for known and unknown addresses, except that a new address gets 429 `signup_cap_reached` while today's cap on new households is full. `mailEnabled` is false on servers without mail settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                locale: { enum: [en, da, sv, nb, de] }
                client:
                  enum: [web, native]
                  default: web
                  description: "`native` mails a link to /auth/app, which the native parent app opens (universal/app link)."
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mailEnabled: { type: boolean }
                  codeSignIn:
                    type: boolean
                    description: "Only for the store review address (REVIEW_LOGIN_EMAIL): no mail is sent; sign in with POST /auth/review instead."
        "429": { $ref: "#/components/responses/TooManyOrCapped" }

  /auth/review:
    post:
      operationId: postAuthReview
      security: []
      tags: [auth]
      summary: Sign in with the store review code
      description: >-
        Only on servers with REVIEW_LOGIN_EMAIL and REVIEW_LOGIN_CODE set (docs/store-review.md); otherwise 404.
        Only that address with that code signs in. The first sign-in creates the account and household, and every
        sign-in gives the household its demo phone (or checks it in again). Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, maxLength: 200 }
                locale: { enum: [en, da, sv, nb, de] }
                client:
                  enum: [web, native]
                  default: web
                  description: Native apps send `native` to get the session token in the body. The PWA only gets the HttpOnly cookie.
      responses:
        "200":
          description: Signed in. Sets the `pp_session` cookie; `sessionToken` is only in the body for `client=native`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      locale: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/verify:
    post:
      operationId: postAuthVerify
      security: []
      tags: [auth]
      summary: Exchange the link token for a session
      description: The link is `${PUBLIC_URL}/auth/callback#token=…`; the page posts the token here. Creates the account and a household on first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                locale: { enum: [en, da, sv, nb, de] }
                client:
                  enum: [web, native]
                  default: web
                  description: Native apps send `native` to get the session token in the body. The PWA only gets the HttpOnly cookie.
      responses:
        "200":
          description: Signed in. Sets the `pp_session` cookie; `sessionToken` is only in the body for `client=native`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      email: { type: string }
                      locale: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyOrCapped" }

  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Post auth logout
      tags: [auth]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "204": { description: "Signed out" }

  /me:
    get:
      operationId: getMe
      summary: Get me
      tags: [auth]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { description: "User, households, `mailEnabled` and `iosPairing` (true when this server pairs iPhones: show \"Add an iPhone\")" }
    patch:
      operationId: patchMe
      summary: Change my language
      tags: [auth]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { enum: [en, da, sv, nb, de] }
      responses:
        "204": { description: "Saved" }
    delete:
      operationId: deleteMe
      summary: Delete my account
      description: |
        Deletes the account. Households shared with another parent stay, with their phones;
        if you owned one, the longest-standing other member becomes the owner. Households
        where you are the only member are deleted with all their phones: those phones get 401
        on their next request and fall back as described in docs/sync-api.md. Refused with 409
        while such a household holds a Self phone; remove those first (through their key).
        Where you are someone's trusted person, their key falls back to the delay.
        See docs/account-deletion.md.
      tags: [auth]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmEmail]
              properties:
                confirmEmail: { type: string, description: "Your own email address, as a confirmation" }
      responses:
        "200":
          description: Deleted. The session cookie is cleared.
          content:
            application/json:
              schema:
                type: object
                required: [householdsDeleted, phonesRemoved]
                properties:
                  householdsDeleted: { type: integer }
                  phonesRemoved: { type: integer }
        "400": { description: "confirmEmail does not match" }
        "409":
          description: A household only you belong to holds a Self phone
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  selfPhoneIds: { type: array, items: { type: string, format: uuid } }

  # ---------------------------------------------------------------- live updates
  /events:
    get:
      operationId: getEvents
      tags: [notifications]
      summary: Live updates (server-sent events)
      description: |
        A `text/event-stream` that stays open while the dashboard or the parent app is open
        (docs/live-updates.md). Only events of your own households. Each event carries ids only
        (`{"type","phoneId","id"?,"kind"?}`); refetch through the normal API. Event names:
        `sos.created`, `sos.updated`, `request.created`, `request.answered`, `location.updated`,
        `safety.updated`, `inbox.message`, `phone.status`. Control events: `ready` (connected;
        `{"resumed":bool}`), `refetch` (the gap since `Last-Event-ID` is unknown: reload everything),
        `ping` (every 25 s) and `bye` (signed out; the stream ends).
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, maxLength: 40 }, description: "The last event id seen; missed events are replayed when still known" }
        - { name: lastEventId, in: query, required: false, schema: { type: string, maxLength: 40 }, description: "Same as the header, for clients that cannot set it" }
      responses:
        "200":
          description: The event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { description: "Sign in first" }
        "429": { description: "Too many live connections for this account; fall back to polling and retry later" }
        "503": { description: "The server has too many live connections; fall back to polling and retry later" }

  # ---------------------------------------------------------------- notifications
  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: My push subscriptions and muted phones
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  webPushEnabled: { type: boolean, description: "False when the server has no VAPID keys" }
                  webPushPublicKey: { type: [string, "null"], description: "applicationServerKey for PushManager.subscribe" }
                  offlineAlertHours: { type: number, description: "0 means off" }
                  subscriptions: { type: array, items: { $ref: "#/components/schemas/PushSubscription" } }
                  mutedPhoneIds: { type: array, items: { type: string, format: uuid } }
  /notifications/subscriptions:
    post:
      operationId: postNotificationSubscription
      tags: [notifications]
      summary: Register this browser or app install
      description: |
        `web`: the PushSubscription from the browser. Only the browsers' push services are
        accepted as endpoint. `apns`/`fcm`: a device token from a native parent app.
        Registering an endpoint that belongs
        to someone else moves it to you (another person signed in on the same device).
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [platform, endpoint, keys]
                  properties:
                    platform: { const: web }
                    endpoint: { type: string, format: uri, maxLength: 2000 }
                    keys:
                      type: object
                      required: [p256dh, auth]
                      properties:
                        p256dh: { type: string }
                        auth: { type: string }
                    label: { type: string, maxLength: 60 }
                    replaces:
                      type: string
                      maxLength: 2000
                      description: The endpoint of the subscription this one replaces (sent by the service worker after the browser rotated it). That row is deleted and its label kept.
                - type: object
                  required: [platform, token]
                  properties:
                    platform: { enum: [apns, fcm, expo] }
                    token: { type: string, minLength: 16, maxLength: 1024 }
                    replaces: { type: string, maxLength: 1024 }
                    subscriptionId: { type: string, format: uuid, description: Existing native subscription to refresh }
                    installationKey: { type: string, minLength: 16, maxLength: 1024, description: Opaque installation key persisted before first registration and across token rotations and logins }
                    optIn: { type: boolean, description: True when the parent explicitly enables native notifications }
                    label: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
        "400": { description: "Unknown push service or invalid keys" }
        "404": { description: "The native subscription was removed or its token is no longer valid" }
        "409": { description: "Notifications are not set up on this server or the registration changed concurrently" }
  /notifications/subscriptions/{sid}:
    delete:
      operationId: deleteNotificationSubscription
      tags: [notifications]
      summary: Unregister a browser or app install
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Gone" }
  /notifications/test:
    post:
      operationId: postNotificationTest
      tags: [notifications]
      summary: Send a test notification to my devices (or one of them)
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscriptionId: { type: string, format: uuid }
      responses:
        "200":
          description: How many were sent
          content:
            application/json:
              schema: { type: object, properties: { sent: { type: integer } } }
        "429": { description: "Too many tests" }

  # ---------------------------------------------------------------- household
  /households/{hid}:
    patch:
      operationId: updateHousehold
      summary: Rename a household
      tags: [household]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        "204": { description: "Renamed" }
  /households/{hid}/summary-settings:
    get:
      operationId: getHouseholdSummarySettings
      summary: Settings of the weekly summary
      description: One calm summary a week instead of a stream of alerts (docs/weekly-summary.md).
      tags: [household]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      responses:
        "200":
          description: The household's settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummarySettings" }
        "404": { description: "Not a member" }
    patch:
      operationId: updateHouseholdSummarySettings
      summary: Change the weekly summary settings
      tags: [household]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                byMail: { type: boolean }
                byPush: { type: boolean }
                actNowOnly: { type: boolean, description: "With the summary on, news that can wait goes into it instead of a push or mail." }
                day: { type: integer, minimum: 0, maximum: 6, description: "0 = Sunday" }
                hour: { type: integer, minimum: 0, maximum: 23 }
                minute: { type: integer, minimum: 0, maximum: 59 }
                timeZone: { type: string, description: IANA time zone }
      responses:
        "200":
          description: The new settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummarySettings" }
        "400": { description: "Invalid value" }
        "404": { description: "Not a member" }
  /households/{hid}/summaries:
    get:
      operationId: getHouseholdSummaries
      summary: The last 8 weekly summaries, newest first
      tags: [household]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      responses:
        "200":
          description: Summaries
          content:
            application/json:
              schema:
                type: object
                required: [summaries, firstSummaryOn]
                properties:
                  summaries:
                    type: array
                    items: { $ref: "#/components/schemas/WeeklySummary" }
                  firstSummaryOn:
                    type: [string, "null"]
                    format: date
                    description: Local date the first summary comes, while there is none yet. The first summary waits for a full week of history. Null once one exists, when the summary is off, or when the date has passed.
        "404": { description: "Not a member" }
  /households/{hid}/members:
    get:
      operationId: getHouseholdsMembers
      summary: Get households members
      tags: [household]
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      responses:
        "200": { description: "Members and open invites" }
  /households/{hid}/members/{uid}:
    delete:
      operationId: deleteHouseholdsMembers
      tags: [household]
      summary: Remove a member (owner) or leave (yourself)
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/householdId" }
        - { name: uid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Removed" }
        "409": { description: "Last member" }
  /households/{hid}/reset-protection:
    get:
      operationId: getResetProtection
      tags: [reset-protection]
      summary: Who protects the household's phones against a reset
      description: >
        `available` is false when the server has no Google OAuth client (`GOOGLE_OAUTH_CLIENT_ID`).
        `activeFrom` is the time the link was added plus 72 hours (Google's delay for new accounts).
        Account IDs never leave the server.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      responses:
        "200":
          description: State
          content:
            application/json:
              schema:
                type: object
                required: [available, accounts]
                properties:
                  available: { type: boolean }
                  accounts:
                    type: array
                    items:
                      type: object
                      required: [mine, userId, addedAt, activeFrom]
                      properties:
                        mine: { type: boolean }
                        userId: { type: string, format: uuid }
                        addedAt: { type: string, format: date-time }
                        activeFrom: { type: string, format: date-time }
  /households/{hid}/reset-protection/google:
    post:
      operationId: postResetProtectionGoogle
      tags: [reset-protection]
      summary: Start Google sign-in for reset protection
      description: Returns the Google URL to open. People API profile scope without email, PKCE, single-use state valid for 10 minutes.
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/householdId" }
        - name: X-Plainphone-App
          in: header
          schema: { const: parent }
          description: With bearer authentication, returns to the native parent app after Google sign-in.
      responses:
        "200":
          description: Sign-in URL
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } }
        "409": { description: Google sign-in is not set up on this server }
  /households/{hid}/reset-protection/mine:
    delete:
      operationId: deleteResetProtectionMine
      tags: [reset-protection]
      summary: Remove your own Google account; the phones clear it at the next sync
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      responses:
        "204": { description: Removed }
  /reset-protection/google/callback:
    get:
      operationId: getResetProtectionCallback
      tags: [reset-protection]
      summary: Google redirects here after sign-in
      description: >
        No session is needed: the `state` from the start call says who signed in. Stores the
        numeric account ID and redirects to `${PUBLIC_URL}/household?reset-protection=ok|cancelled|failed`.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to the dashboard }
  /households/{hid}/invites:
    post:
      operationId: postHouseholdsInvites
      tags: [household]
      summary: Invite another parent
      description: Mails `${PUBLIC_URL}/invite#token=…`. Without mail the response includes `url` to pass on by hand.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/householdId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                locale: { enum: [en, da, sv, nb, de] }
      responses:
        "201": { description: "Invited" }
  /households/{hid}/invites/{iid}:
    delete:
      operationId: deleteHouseholdsInvites
      summary: Delete households invites
      tags: [household]
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/householdId" }
        - { name: iid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: "Withdrawn" }
  /invites/accept:
    post:
      operationId: postInvitesAccept
      summary: Post invites accept
      tags: [household]
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "200": { description: "Joined" }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: The invitation was sent to another e-mail address. It stays valid for the invited account (`code` is `invite_email_mismatch`).
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [invite_email_mismatch] }

  # ---------------------------------------------------------------- phones
  /phones:
    get:
      operationId: getPhones
      summary: List my phones
      tags: [phones]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Phones in all my households
          content:
            application/json:
              schema:
                type: object
                properties:
                  phones: { type: array, items: { $ref: "#/components/schemas/PhoneSummary" } }
  /phones/pairing-profile:
    post:
      operationId: postPhonesPairingProfile
      tags: [phones]
      summary: Read the profile hint for a pairing code
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: The profile selected on the phone, if supplied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { enum: [child, self, null] }
                  mode: { enum: [strong, light] }
                  platform: { enum: [android, ios] }
        "404": { description: "Code not found or expired" }
        "429": { $ref: "#/components/responses/Error" }

  /phones/claim:
    post:
      operationId: postPhonesClaim
      tags: [phones]
      summary: Claim the code shown on a phone
      description: Case and separators in the code do not matter. Rate limited.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, profile]
              properties:
                code: { type: string }
                name: { type: string, maxLength: 40 }
                profile: { enum: [child, self] }
                filterMethod: { $ref: "#/components/schemas/FilterMethod" }
                householdId: { type: string, format: uuid }
                language: { $ref: "#/components/schemas/PhoneLanguage" }
                timezone: { type: string, examples: [Europe/Copenhagen] }
      responses:
        "402": { $ref: "#/components/responses/PlanLimit" }
        "201":
          description: Claimed. For new clients, the phone must confirm before it receives rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneSummary" }
        "404": { description: "Code not found or expired" }
        "409": { description: "Profile differs from the choice on the phone" }
        "403": { description: "iPhone pairing was switched off after the iPhone started (`code: ios_pairing_not_yet`)" }

  /phones/enroll:
    post:
      operationId: postPhonesEnroll
      tags: [phones]
      summary: Add a phone for setup from the dashboard
      description: |
        Makes a phone entry that waits for setup (`pairedAt` is null) and a one-time enrollment
        token, valid 24 hours. The browser builds a provisioning QR code in strong mode or a
        download and setup link in light mode from `provisioning`, the token and the maintenance PIN, which it hashes itself (PBKDF2-HMAC-SHA256, 120,000
        iterations, 32 bytes, 16-byte random salt, as `scripts/provisioning-qr.py`). The PIN and
        its hash never reach the server. Rate limited to 30 per day per user.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, profile]
              properties:
                template: { type: string, description: Optional rule template code for an unconnected Self phone. }
                name: { type: string, maxLength: 40 }
                mode: { type: string, enum: [strong, light], default: strong }
                filterMethod: { $ref: "#/components/schemas/FilterMethod" }
                profile: { enum: [child, self] }
                householdId: { type: string, format: uuid }
                language: { $ref: "#/components/schemas/PhoneLanguage" }
                timezone: { type: string, examples: [Europe/Copenhagen] }
      responses:
        "402": { $ref: "#/components/responses/PlanLimit" }
        "201":
          description: Phone entry, token and what the QR code needs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "404": { description: Household not found }
        "429": { $ref: "#/components/responses/Error" }
  /phones/{pid}/enrollment:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    post:
      operationId: postPhoneEnrollment
      tags: [phones]
      summary: New setup token for a phone that is not set up yet
      description: Replaces earlier tokens for the phone. `409` once the phone is set up.
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "201":
          description: Token and what the QR code needs (no `phone`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "404": { description: Not found }
        "409": { description: Already set up }
  /phones/{pid}:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhone
      summary: Get a phone
      tags: [phones]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200":
          description: Phone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneSummary" }
    patch:
      operationId: updatePhone
      summary: Update a phone’s name or preferences
      tags: [phones]
      description: Turning location off deletes the stored position. Changing the language or time zone invalidates outstanding setup QR codes and links.
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                supportEnabled: { type: boolean }
                releaseWarningsEnabled: { type: boolean }
                askMoreTimeEnabled: { type: boolean }
                limitWarningEnabled: { type: boolean }
                locationEnabled: { type: boolean }
                changeReceiptsEnabled: { type: boolean }
                healthBoardEnabled: { type: boolean }
                weeklySummaryEnabled: { type: boolean, description: "Include this phone in the weekly summary (default on)." }
                silentBedtime: { type: boolean }
                pinApprovalEnabled: { type: boolean }
                appUpdatesEnabled: { type: boolean, description: "Strong mode: update approved apps in a nightly window (default on)." }
                modesEnabled: { type: boolean, description: "Child phones only (409 on a Self phone). Turning it on the first time makes the modes from school time and bedtime." }
                pushWakeups: { type: boolean }
                preferUnifiedPush: { type: boolean }
                language: { $ref: "#/components/schemas/PhoneLanguage" }
                lockSystemLanguage: { type: boolean }
                timezone:
                  type: string
                  description: IANA time zone for the household. Can be set before strong setup.
                offlineAlertHours:
                  type: [integer, "null"]
                  minimum: 0
                  maximum: 168
                  description: Hours of silence before the parents get a push and a mail. Null = server default, 0 = never.
      responses:
        "200":
          description: Updated phone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneSummary" }
        "400": { description: Invalid time zone }
        "409": { description: Time zone can only be set before strong setup }
    delete:
      operationId: deletePhone
      summary: Remove a phone
      tags: [phones]
      description: Removes the phone, its rules and its DNS client. The device token stops working; the lock on the phone stays until released there (to switch it off from the dashboard, use `POST /phones/{pid}/release` instead). On a Self phone removal goes through the key.
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }

  /phones/{pid}/release:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    post:
      operationId: postPhoneRelease
      summary: Release the phone
      tags: [phones]
      description: |
        Switches Plainphone off on the phone, with the same effect as the maintenance screen's
        "Release Device Owner" (strong mode) or light mode's "Switch Plainphone off": the lock and
        the filters stop, and Plainphone is an ordinary app that can be uninstalled. The phone is
        told in its rules (`release: true`), does it the next time it is online, and then
        disappears from the dashboard. Until then `releaseRequestedAt` is set on the phone. On a
        Self phone this goes through the key. A phone that never paired answers 400: remove it instead.
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "400": { $ref: "#/components/responses/Error" }

  /phones/{pid}/ios-selection:
    get:
      operationId: getPhoneIosSelection
      tags: [phones]
      summary: Read an iPhone's app selection
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The selection, or nulls when none was picked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IosSelectionState" }
        "404": { description: "Not found, or not an iPhone" }
    put:
      operationId: putPhoneIosSelection
      tags: [phones]
      summary: Send apps picked on the parent's iPhone
      description: >
        A rule change: the iPhone gets a new rules revision and a wake-up. Allowed while the
        capability `pickAppsOnParent` is not `no` (spike (a), docs/ios/spikes.md).
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { name: pid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IosSelection" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IosSelectionSaved" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: "Phone not found in your households" }
        "409": { description: "Apps for this phone cannot be picked on another device (`code: not_supported`)" }
        "413": { description: "Selection too large" }

  /phones/{pid}/apps:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    get:
      operationId: getPhonesApps
      summary: Get phones apps
      tags: [rules]
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { description: "Installed apps: packageName, label, allowed, blocked (open mode block list, also via a category), blockedBy (the category, when a blocked category blocks it), core" }
  /phones/{pid}/apps/{package}:
    put:
      operationId: putPhonesApps
      tags: [rules]
      summary: Show or hide an app
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: package, in: path, required: true, schema: { $ref: "#/components/schemas/PackageName" } }
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [allowed], properties: { allowed: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "400": { description: "Core apps cannot be hidden" }

  /phones/{pid}/open-mode:
    get:
      operationId: getPhonesOpenMode
      tags: [rules]
      summary: Open mode, its blocked categories and the apps blocked one by one
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "200":
          description: Open mode state
          content:
            application/json:
              schema:
                type: object
                required: [enabled, categories, blockedApps]
                properties:
                  enabled: { type: boolean }
                  categories:
                    type: array
                    items:
                      type: object
                      required: [category, blocked, hasApps]
                      properties:
                        category: { $ref: "#/components/schemas/OpenCategory" }
                        blocked: { type: boolean }
                        hasApps: { type: boolean }
                  blockedApps:
                    type: array
                    items:
                      type: object
                      required: [packageName, label]
                      properties:
                        packageName: { $ref: "#/components/schemas/PackageName" }
                        label: { type: string }
    put:
      operationId: putPhonesOpenMode
      tags: [rules]
      summary: Turn open mode on or off
      description: Turning it on loosens the rules, so on a Self phone it waits for the key. Turning it off applies at once.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
  /phones/{pid}/open-mode/categories/{category}:
    put:
      operationId: putPhonesOpenModeCategories
      tags: [rules]
      summary: Block or allow a category in open mode
      description: Blocks the category's known apps and its web filter category in one action. Allowing it loosens, so on a Self phone it waits for the key.
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: category, in: path, required: true, schema: { $ref: "#/components/schemas/OpenCategory" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [blocked], properties: { blocked: { type: boolean } } }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }

  /phones/{pid}/time-limits:
    get:
      operationId: getPhonesTimeLimits
      tags: [limits]
      summary: Time limits, today's and tomorrow's bonuses and today's use
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    oneOf:
                      - $ref: "#/components/schemas/Limit"
                      - type: "null"
                  apps:
                    type: array
                    items:
                      type: object
                      properties:
                        packageName: { $ref: "#/components/schemas/PackageName" }
                        label: { type: string }
                        limit: { $ref: "#/components/schemas/Limit" }
                  bonuses: { type: array, items: { $ref: "#/components/schemas/Bonus" } }
                  used:
                    description: "`timeUsed` from the phone's last status report when that report is from today (phone time zone), otherwise null."
                    oneOf:
                      - $ref: "#/components/schemas/TimeUsed"
                      - type: "null"
  /phones/{pid}/time-limits/total:
    parameters: [{ $ref: "#/components/parameters/phoneId" }]
    put:
      operationId: putPhonesTimeLimitsTotal
      tags: [limits]
      summary: Set the daily cap for all non-core apps
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
    delete:
      operationId: deletePhonesTimeLimitsTotal
      tags: [limits]
      summary: Remove the daily cap
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
  /phones/{pid}/time-limits/apps/{package}:
    parameters:
      - { $ref: "#/components/parameters/phoneId" }
      - { name: package, in: path, required: true, schema: { $ref: "#/components/schemas/PackageName" } }
    put:
      operationId: putPhonesTimeLimitsApp
      tags: [limits]
      summary: Set a daily limit for one app
      security: [{ session: [] }, { cookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "400": { description: "Core apps cannot have a limit" }
        "404": { description: "The phone has not reported this app" }
    delete:
      operationId: deletePhonesTimeLimitsApp
      tags: [limits]
      summary: Remove an app's limit
      security: [{ session: [] }, { cookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
  /phones/{pid}/time-limits/bonus:
    post:
      operationId: postPhonesTimeLimitsBonus
      tags: [limits]
      summary: Give extra minutes today (phone time zone)
      description: Always a loosening, so on a Self phone it waits for the key; it then counts for the local date when it takes effect.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageName, minutes]
              properties:
                packageName: { $ref: "#/components/schemas/LimitTarget" }
                minutes: { type: integer, minimum: 5, maximum: 240 }
      responses:
        "200": { $ref: "#/components/responses/Change" }
        "202": { $ref: "#/components/responses/ChangePending" }
        "400": { description: "Core apps cannot have a limit, or the target has no limit" }
  /device/more-time-requests:
    post:
      operationId: postDeviceMoreTimeRequest
      tags: [device]
      summary: Ask for more time on an app or the daily cap (phone)
      description: |
        Sent from the stop screen when an app's time or the daily cap is used up. `packageName` is
        the app, or `*` for the daily cap. The parents get a push notification with the choices.
        Asking again while the request is open returns it (200). At most 6 new requests an hour
        per phone. Only for child phones with `askMoreTimeEnabled`. See docs/more-time.md.
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageName]
              properties:
                packageName: { $ref: "#/components/schemas/LimitTarget" }
                reason: { type: string, maxLength: 140 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoreTimeRequest" }
        "200":
          description: Already open; the open request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoreTimeRequest" }
        "403": { description: "Asking is switched off for this phone" }
        "409": { description: "Not a child phone, or there is no limit on the target" }
        "429": { description: "Too many requests; wait for an answer" }
    get:
      operationId: getDeviceMoreTimeRequests
      tags: [device]
      summary: The phone's requests for more time and their answers (phone)
      description: The last 24 hours, newest first. An approval also arrives as a bonus in `timeLimits.bonuses` of the rules.
      security: [{ device: [] }]
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items: { $ref: "#/components/schemas/MoreTimeRequest" }
  /phones/{pid}/more-time-requests:
    get:
      operationId: getPhonesMoreTimeRequests
      tags: [limits]
      summary: Open and recently answered requests for more time
      description: Open ones and those from the last 24 hours, newest first, so a second parent sees what the first decided.
      security: [{ session: [] }, { cookie: [] }]
      parameters: [{ $ref: "#/components/parameters/phoneId" }]
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/MoreTimeRequest"
                        - type: object
                          properties:
                            phoneId: { type: string, format: uuid }
                            appLabel: { type: [string, "null"], description: "Null for the daily cap" }
                            answeredByYou: { type: [boolean, "null"], description: "Null while open" }
  /phones/{pid}/more-time-requests/{rid}/answer:
    post:
      operationId: answerPhonesMoreTimeRequest
      tags: [limits]
      summary: Answer a request for more time
      description: |
        `15` or `60` add that many minutes, `day` adds the time left until the phone's local midnight,
        `no` declines. It is a bonus for that app (or the daily cap) on the day of the request only.
        Idempotent: the first answer wins. A later answer, from another parent or a second tap, changes
        nothing and returns the decided request with `won: false`. A request nobody answered before
        local midnight comes back as `expired`.
      security: [{ session: [] }, { cookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/phoneId" }
        - { name: rid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { enum: ["15", "60", "day", "no"] }
                source:
                  const: notification
                  description: "Set when the answer is given from a push notification button. The server then sends this parent a silent follow-up when the phone has applied a bonus (`Active on the phone at 14:05`), under the notification's tag. Ignored when the phone's change receipts are off."
      responses:
        "200":
          description: The request as it stands now
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MoreTimeRequest"
                  - type: object
                    required: [won, answeredByYou]
                    properties:
                      won: { type: boolean, description: "True when this call decided it. False when it was already answered, or closed as expired because the limit was removed or the phone is no longer a child's" }
                      answeredByYou: { type: boolean }
        "404": { description: "No such request" }

  /catalog:
