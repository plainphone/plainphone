# SPDX-License-Identifier: Apache-2.0
# The hosted service (app.plainphone.org) on Dokploy. Dokploy adds the Traefik
# route for the domain set in its UI and backs up the db service to object storage.
# Environment (set in Dokploy, never in git): POSTGRES_PASSWORD, PUBLIC_URL,
# MAIL_PROVIDER, SMTP_URL, MAIL_FROM, DNS_PROVIDER (required, no default: an unset value
# would fall back to mock and re-tag every phone), DNS_API_URL, DNS_API_TOKEN,
# GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET.
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY (Web Push; generate with
# `pnpm --filter @plainphone/server exec tsx src/lib/webpush.ts`), and optionally
# VAPID_SUBJECT, OFFLINE_ALERT_HOURS, PUSH_EXTRA_HOSTS, IOS_PAIRING_ENABLED.
# iOS push: APNS_KEY_P8, APNS_KEY_ID, APNS_TEAM_ID, APNS_BUNDLE_ID (docs/push-setup.md).
# App links (docs/parent-app.md): APPLE_APP_IDS, ANDROID_APP_PACKAGE, ANDROID_APP_CERT_SHA256.
# Optional, unset keeps the server default: LATENCY_STATS, METRICS_TOKEN, MIGRATE_ON_START,
# DB_POOL_MAX (docs/operations.md#capacity),
# the APK_* and PROVISIONING_DNS_HOST setup-QR settings, and billing (docs/billing.md:
# BILLING_*, STRIPE_*, PLAY_*; off until BILLING_ENABLED=true with BILLING_GRANDFATHER_BEFORE).
# server/test/env-wiring.test.ts checks this file against server/src/config.ts.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: plainphone
      POSTGRES_USER: plainphone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plainphone -d plainphone"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://plainphone:${POSTGRES_PASSWORD}@db:5432/plainphone
      PUSH_PROVIDER: ${PUSH_PROVIDER:-none}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_SANDBOX: ${APNS_SANDBOX:-false}
      APPLE_APP_IDS: ${APPLE_APP_IDS:-P7698GU4AV.org.plainphone.app}
      ANDROID_APP_PACKAGE: ${ANDROID_APP_PACKAGE:-org.plainphone.parent}
      ANDROID_APP_CERT_SHA256: ${ANDROID_APP_CERT_SHA256:-}
      PUBLIC_URL: ${PUBLIC_URL:?}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-none}
      MAIL_FROM: ${MAIL_FROM:-Plainphone <no-reply@plainphone.org>}
      SMTP_URL: ${SMTP_URL:-}
      DNS_PROVIDER: ${DNS_PROVIDER:?set DNS_PROVIDER to http (or mock) explicitly; a missing value must not fall back to mock}
      DNS_API_URL: ${DNS_API_URL:-}
      DNS_API_TOKEN: ${DNS_API_TOKEN:-}
      DNS_HOST_SUFFIX: dns.plainphone.org
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:privacy@plainphone.org}
      OFFLINE_ALERT_HOURS: ${OFFLINE_ALERT_HOURS:-12}
      PUSH_EXTRA_HOSTS: ${PUSH_EXTRA_HOSTS:-}
      IOS_PAIRING_ENABLED: ${IOS_PAIRING_ENABLED:-false}
      # New households per UTC day (docs/operations.md#daily-cap-on-new-households). 0 = no cap.
      SIGNUP_DAILY_CAP: ${SIGNUP_DAILY_CAP:-0}
      MAIL_HOURLY_CAP: ${MAIL_HOURLY_CAP:-0}
      MAIL_DAILY_CAP: ${MAIL_DAILY_CAP:-0}
      # Bot and spam protection on sign-in and invitations (docs/operations.md#bot-and-spam-protection).
      # Off until the parent app that solves it is in the stores: older builds cannot sign in with it on.
      BOT_CHALLENGE: ${BOT_CHALLENGE:-off}
      BOT_CHALLENGE_DIFFICULTY: ${BOT_CHALLENGE_DIFFICULTY:-100000}
      BOT_CHALLENGE_HMAC_KEY: ${BOT_CHALLENGE_HMAC_KEY:-}
      SPAM_HONEYPOT: ${SPAM_HONEYPOT:-on}
      BLOCK_DISPOSABLE_EMAIL: ${BLOCK_DISPOSABLE_EMAIL:-on}
      INVITES_PER_HOUSEHOLD_DAILY: ${INVITES_PER_HOUSEHOLD_DAILY:-20}
      # App store review sign-in (docs/store-review.md). Unset = the path does not exist.
      REVIEW_LOGIN_EMAIL: ${REVIEW_LOGIN_EMAIL:-}
      REVIEW_LOGIN_CODE: ${REVIEW_LOGIN_CODE:-}
      # Setup QR codes (docs/self-hosting.md): empty = the project's own app releases.
      APK_DOWNLOAD_URL: ${APK_DOWNLOAD_URL:-}
      APK_METADATA_URL: ${APK_METADATA_URL:-}
      APK_RELEASES_REPO: ${APK_RELEASES_REPO:-}
      APK_SIGNATURE_CHECKSUM: ${APK_SIGNATURE_CHECKSUM:-}
      PROVISIONING_DNS_HOST: ${PROVISIONING_DNS_HOST:-}
      # Apply database migrations at start (the server's default).
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      # Database connections the app keeps open at most (docs/operations.md#capacity).
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # Delivery timings (docs/latency.md); METRICS_TOKEN unset = /api/metrics answers 404.
      LATENCY_STATS: ${LATENCY_STATS:-on}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Billing (docs/billing.md): off unless BILLING_ENABLED=true and BILLING_GRANDFATHER_BEFORE
      # are set. Empty values keep the server's defaults.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_GRANDFATHER_BEFORE: ${BILLING_GRANDFATHER_BEFORE:-}
      BILLING_FREE_PHONES: ${BILLING_FREE_PHONES:-}
      BILLING_FREE_TRUSTED: ${BILLING_FREE_TRUSTED:-}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-}
      BILLING_PLUS_PRICE_MINOR: ${BILLING_PLUS_PRICE_MINOR:-}
      BILLING_EARLY_UNLOCK_PRICE_MINOR: ${BILLING_EARLY_UNLOCK_PRICE_MINOR:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PLUS: ${STRIPE_PRICE_PLUS:-}
      PLAY_PACKAGE_NAME: ${PLAY_PACKAGE_NAME:-}
      PLAY_SERVICE_ACCOUNT_JSON: ${PLAY_SERVICE_ACCOUNT_JSON:-}
      PLAY_SERVICE_ACCOUNT_FILE: ${PLAY_SERVICE_ACCOUNT_FILE:-}
      PLAY_PRODUCT_PLUS: ${PLAY_PRODUCT_PLUS:-}
      PLAY_PRODUCT_EARLY_UNLOCK: ${PLAY_PRODUCT_EARLY_UNLOCK:-}
      PLAY_RTDN_TOKEN: ${PLAY_RTDN_TOKEN:-}
      # Traefik sits in front, so X-Forwarded-For is trustworthy here.
      TRUST_PROXY: "true"
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  db:
