[package]
name = "mls-harness"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Synthetic OpenMLS experiment for Plainphone #120. Not part of the app."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"

# Browser/Node build for the cross-runtime check (wasm-bindgen glue).
[target.'cfg(target_family = "wasm")'.dependencies]
openmls = { version = "=0.9.2", features = ["js"] }
wasm-bindgen = "=0.2.130"
# rand_core 0.6 (via the RustCrypto ECDSA crates in openmls_rust_crypto)
# still uses getrandom 0.2, which needs its own `js` switch.
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["js"] }

[profile.release]
# Size measurements in the recommendation use this profile.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
